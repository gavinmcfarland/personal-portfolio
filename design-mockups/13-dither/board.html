<script>(()=>{document.documentElement.classList.toggle('light',localStorage.getItem('gm-surface-13')==='bone');})();</script>

<link rel="stylesheet" href="system.css">
</head>

<body data-page="board">
<a class="skip" href="#board">Skip to the board</a>

<header class="bar">
  <nav id="nav" aria-label="Primary"></nav>
  <div class="bar__tools" style="align-items:center">
    <output id="board-zoomval" class="sm faint" aria-live="off" style="min-width:4ch;text-align:right">100%</output>
    <button class="btn" id="board-reset" type="button" style="padding:.1rem .7rem">reset</button>
    <button id="theme-toggle" type="button">surface</button>
  </div>
</header>

<div class="board" id="board"></div>

<p class="board__hint" id="board-hint" aria-hidden="true">drag or scroll to pan · pinch to zoom · 0 fits</p>

<script src="data.js"></script>
<script src="system.js"></script>
<script src="board.js"></script>
<script>
  (() => {
    const api = Board.mount(document.getElementById('board'), DATA.board.notes);
    document.getElementById('board-reset').addEventListener('click', () => api.fit());

    /* The hint earns its keep once, then leaves. */
    const hint = document.getElementById('board-hint');
    const dismiss = () => { hint.style.opacity = '0'; };
    addEventListener('pointerdown', dismiss, { once: true });
    addEventListener('wheel', dismiss, { once: true });
    setTimeout(dismiss, 8000);
  })();
</script>
</body>
</html>
