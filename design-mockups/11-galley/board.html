<head>

<meta name="description" content="The plugma working board — notes, code and the argument, laid out spatially.">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Spectral:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">

<script>(()=>{const s=localStorage.getItem('gm-theme');document.documentElement.classList.toggle('dark',s?s==='dark':matchMedia('(prefers-color-scheme: dark)').matches);})();</script>

<link rel="stylesheet" href="system.css">
</head>

<!-- The board keeps the sheet's own paper and its own running head.
     What changes on arriving here is not the surface but the fact
     that colour is suddenly allowed on it. -->
<body data-page="board">
<a class="skip" href="#board">Skip to the board</a>

<header class="head">
  <a class="head__name" href="index.html">G. McFarland</a>
  <nav id="nav" aria-label="Primary"></nav>
  <div class="head__tools" style="align-items:center">
    <output id="board-zoomval" class="micro faint" aria-live="off" style="min-width:4ch;text-align:right">100%</output>
    <button class="btn" id="board-reset" type="button" style="padding:.15rem .8rem">Reset</button>
    <button id="theme-toggle" type="button">Theme</button>
  </div>
</header>

<div class="board" id="board"></div>

<p class="board__hint" id="board-hint" aria-hidden="true">Drag or scroll to pan · pinch to zoom · 0 fits</p>

<script src="data.js"></script>
<script src="system.js"></script>
<script src="board.js"></script>
<script>
  (() => {
    const api = Board.mount(document.getElementById('board'), DATA.board.notes);
    document.getElementById('board-reset').addEventListener('click', () => api.fit());

    /* The hint earns its keep once, then leaves. */
    const hint = document.getElementById('board-hint');
    const dismiss = () => { hint.style.opacity = '0'; };
    addEventListener('pointerdown', dismiss, { once: true });
    addEventListener('wheel', dismiss, { once: true });
    setTimeout(dismiss, 8000);
  })();
</script>
</body>
</html>
