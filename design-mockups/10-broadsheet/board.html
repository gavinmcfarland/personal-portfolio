<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board · plugma — The Working Sheet</title>
<meta name="description" content="The plugma working board — notes, code and the argument, laid out spatially.">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23D8D6CD'/%3E%3Crect x='4' y='4' width='24' height='7' fill='%2317171A'/%3E%3Crect x='4' y='14' width='11' height='14' fill='%23C4321B'/%3E%3Crect x='17' y='14' width='11' height='14' fill='%231B3C96'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">

<script>(()=>{const s=localStorage.getItem('gm-theme');document.documentElement.classList.toggle('dark',s?s==='dark':matchMedia('(prefers-color-scheme: dark)').matches);})();</script>

<link rel="stylesheet" href="system.css">
</head>

<!-- Unlike 09, this board keeps the sheet's own theme rather than
     forcing dark. The bar stays, so the board reads as one more
     page in the edition instead of a separate application. -->
<body data-page="board">
<a class="skip" href="#board">Skip to the board</a>

<header class="bar">
  <div class="sheet bar__in">
    <nav id="nav" aria-label="Primary"></nav>
    <div class="bar__tools" style="align-items:center">
      <output id="board-zoomval" class="micro faint" aria-live="off" style="min-width:4ch;text-align:right">100%</output>
      <button class="btn" id="board-reset" type="button" style="padding:.2rem .7rem">Reset view</button>
      <button id="theme-toggle" type="button">Theme</button>
    </div>
  </div>
</header>

<div class="board" id="board"></div>

<p class="board__hint" id="board-hint" aria-hidden="true">Drag or scroll to pan · pinch to zoom · 0 fits</p>

<script src="data.js"></script>
<script src="system.js"></script>
<script src="board.js"></script>
<script>
  (() => {
    const api = Board.mount(document.getElementById('board'), DATA.board.notes);
    document.getElementById('board-reset').addEventListener('click', () => api.fit());

    /* The hint earns its keep once, then leaves. */
    const hint = document.getElementById('board-hint');
    const dismiss = () => { hint.style.opacity = '0'; };
    addEventListener('pointerdown', dismiss, { once: true });
    addEventListener('wheel', dismiss, { once: true });
    setTimeout(dismiss, 8000);
  })();
</script>
</body>
</html>
