<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>@gavinmcfarland/canvas · Enamel skin</title>
  <meta name="description" content="Re-skinning the canvas to a bespoke look using only the public styling contract — no package internals touched.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chivo:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Follow the system colour scheme: the canvas activates its dark tokens from a
       `.dark` ancestor, so mirror prefers-color-scheme onto <html> (and keep it live). -->
  <script>
    (() => {
      const mq = matchMedia('(prefers-color-scheme: dark)');
      const apply = () => document.documentElement.classList.toggle('dark', mq.matches);
      apply();
      mq.addEventListener('change', apply);
    })();
  </script>
  <style>
    html, body, #root { margin: 0; height: 100%; background: #b0b6bc; color-scheme: light; }
    html.dark, html.dark body, html.dark #root { background: #1b1e22; color-scheme: dark; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./enamel.jsx"></script>
</body>
</html>
