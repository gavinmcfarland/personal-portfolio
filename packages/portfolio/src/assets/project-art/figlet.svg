<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400">
  <!-- Figlet — write on the left, it runs on the right. A column of set lines
       against a lit pane, the editor and its live result as two halves of one
       sheet. Grayscale and tonal by design: the dither reads luminance, so a
       gradient is what becomes a ramp of dots. -->
  <defs>
    <linearGradient id="fg-ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1e1e"/>
      <stop offset="0.55" stop-color="#4a4a4a"/>
      <stop offset="1" stop-color="#8f8f8f"/>
    </linearGradient>
    <linearGradient id="fg-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2f2f2"/>
      <stop offset="1" stop-color="#767676"/>
    </linearGradient>
    <radialGradient id="fg-run" cx="42%" cy="34%" r="76%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#cfcfcf"/>
      <stop offset="1" stop-color="#242424"/>
    </radialGradient>
  </defs>

  <rect width="960" height="400" fill="url(#fg-ground)"/>

  <!-- the editor: lines of code, indented into blocks -->
  <g fill="url(#fg-line)">
    <rect x="72"  y="86"  width="252" height="16"/>
    <rect x="104" y="122" width="188" height="16"/>
    <rect x="104" y="158" width="286" height="16"/>
    <rect x="136" y="194" width="150" height="16"/>
    <rect x="136" y="230" width="214" height="16"/>
    <rect x="104" y="266" width="122" height="16"/>
    <rect x="72"  y="302" width="176" height="16"/>
  </g>
  <!-- the gutter -->
  <g fill="#ffffff" opacity="0.34">
    <rect x="48" y="86"  width="8" height="16"/>
    <rect x="48" y="122" width="8" height="16"/>
    <rect x="48" y="158" width="8" height="16"/>
    <rect x="48" y="194" width="8" height="16"/>
    <rect x="48" y="230" width="8" height="16"/>
    <rect x="48" y="266" width="8" height="16"/>
    <rect x="48" y="302" width="8" height="16"/>
  </g>

  <!-- the seam between writing and running -->
  <rect x="466" y="40" width="3" height="320" fill="#ffffff" opacity="0.5"/>

  <!-- the live pane -->
  <rect x="524" y="56" width="392" height="288" fill="#151515"/>
  <circle cx="720" cy="200" r="118" fill="url(#fg-run)"/>
  <path d="M694 148 l84 52 -84 52z" fill="#0d0d0d" opacity="0.72"/>
  <rect x="524" y="56" width="392" height="14" fill="#ffffff" opacity="0.24"/>
</svg>
