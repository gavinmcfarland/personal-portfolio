<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400">
  <!-- Awenate — touch the page, and the source moves with it. A selected
       element on the left, its handles out, and the one line of code it
       belongs to lit on the right: the same edit seen from both sides.
       Grayscale and tonal by design: the dither reads luminance, so a
       gradient is what becomes a ramp of dots. -->
  <defs>
    <linearGradient id="aw-ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161616"/>
      <stop offset="0.6" stop-color="#424242"/>
      <stop offset="1" stop-color="#858585"/>
    </linearGradient>
    <radialGradient id="aw-el" cx="36%" cy="30%" r="80%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#c8c8c8"/>
      <stop offset="1" stop-color="#3a3a3a"/>
    </radialGradient>
    <linearGradient id="aw-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bdbdbd"/>
      <stop offset="1" stop-color="#555555"/>
    </linearGradient>
    <linearGradient id="aw-link" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9a9a9a"/>
    </linearGradient>
  </defs>

  <rect width="960" height="400" fill="url(#aw-ground)"/>

  <!-- the page: quiet blocks around the one being edited -->
  <g fill="#ffffff" opacity="0.2">
    <rect x="72"  y="64"  width="336" height="20"/>
    <rect x="72"  y="316" width="150" height="20"/>
    <rect x="258" y="316" width="150" height="20"/>
  </g>

  <!-- the selected element, with its bounding box and handles -->
  <rect x="112" y="128" width="256" height="144" fill="url(#aw-el)"/>
  <rect x="96" y="112" width="288" height="176" fill="none" stroke="#ffffff" stroke-width="6"/>
  <g fill="#ffffff">
    <rect x="84"  y="100" width="24" height="24"/>
    <rect x="372" y="100" width="24" height="24"/>
    <rect x="84"  y="276" width="24" height="24"/>
    <rect x="372" y="276" width="24" height="24"/>
  </g>

  <!-- the write: from the element to its line -->
  <rect x="396" y="193" width="180" height="14" fill="url(#aw-link)"/>

  <!-- the source: a file of lines, one of them lit -->
  <rect x="576" y="48" width="328" height="304" fill="#0e0e0e" opacity="0.55"/>
  <g fill="url(#aw-line)" opacity="0.8">
    <rect x="608" y="84"  width="196" height="14"/>
    <rect x="640" y="120" width="148" height="14"/>
    <rect x="640" y="156" width="218" height="14"/>
    <rect x="640" y="228" width="122" height="14"/>
    <rect x="640" y="264" width="184" height="14"/>
    <rect x="608" y="300" width="96"  height="14"/>
  </g>
  <rect x="576" y="184" width="328" height="32" fill="#ffffff"/>
  <rect x="640" y="193" width="168" height="14" fill="#1a1a1a"/>
</svg>
