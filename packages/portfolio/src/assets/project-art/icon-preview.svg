<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400">
  <!-- Icon Preview — the same mark, every size that matters. One shaded solid
       repeated down a shared baseline from 256 to 16, the size ramp the plugin
       shows you all at once. -->
  <defs>
    <linearGradient id="ip-ground" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c1c"/>
      <stop offset="0.55" stop-color="#4d4d4d"/>
      <stop offset="1" stop-color="#8b8b8b"/>
    </linearGradient>
    <radialGradient id="ip-solid" cx="32%" cy="26%" r="86%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#c2c2c2"/>
      <stop offset="1" stop-color="#2b2b2b"/>
    </radialGradient>
  </defs>

  <rect width="960" height="400" fill="url(#ip-ground)"/>

  <!-- the baseline they all sit on -->
  <rect x="48" y="324" width="864" height="5" fill="#ffffff" opacity="0.45"/>

  <!-- the ramp: 256, 160, 104, 64, 40, 24, 16 -->
  <g fill="url(#ip-solid)">
    <rect x="72"  y="68"  width="256" height="256" rx="52"/>
    <rect x="364" y="164" width="160" height="160" rx="34"/>
    <rect x="556" y="220" width="104" height="104" rx="22"/>
    <rect x="692" y="260" width="64"  height="64"  rx="14"/>
    <rect x="788" y="284" width="40"  height="40"  rx="9"/>
    <rect x="860" y="300" width="24"  height="24"  rx="6"/>
    <rect x="908" y="308" width="16"  height="16"  rx="4"/>
  </g>

  <!-- the mark inside the largest, the detail that survives or does not -->
  <path d="M200 122 l30 74 74 30 -74 30 -30 74 -30 -74 -74 -30 74 -30z" fill="#131313" opacity="0.7"/>
  <path d="M444 190 l19 46 46 19 -46 19 -19 46 -19 -46 -46 -19 46 -19z" fill="#131313" opacity="0.62"/>
</svg>
