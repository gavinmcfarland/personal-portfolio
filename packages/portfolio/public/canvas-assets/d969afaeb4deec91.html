  0% { transform: scale(1); }
  100% { transform: scale(1.08); }

  33% { transform: translate(-6vw, -4vh) scale(1.1); }
  66% { transform: translate(5vw, -8vh) scale(0.92); }

  0%, 100% { transform: translate(0px, 0px) scale(1); }
  50% { transform: translate(-8vw, 6vh) scale(1.18); }

  100% { transform: none; }
}

  100% { opacity: 1; }
}

// Playback runtime for HTML exports that carry a recorded interaction.
// This file's SOURCE is inlined verbatim into the exported document (capture.js
// reads it and passes it to the serializer, which appends it as a <script>) —
// so it must be self-contained: no imports, no build step, no page globals.
//
// It reads the timeline written by recorder.js from
//   <script type="application/json" id="__shot_timeline">
// and drives three things against one clock:
//   - a synthetic cursor (the real pointer isn't reproducible any other way),
//     drawn with the macOS cursor set that capture.js inlines ahead of this
//     file, picking the shape from the `cursor` of whatever it is over
//   - scroll offsets of the page and of any element that was scrolled
//   - hover states, by marking the recorded hover chain with .__shot_hov
//     (the exporter emits every :hover rule a second time against that class)
//
// The recorded path is stored RAW. All smoothing happens here, so it can be
// switched at runtime without re-exporting: recording.setPath('raw'|'smooth'|
// 'normalised').
;(function () {
  var node = document.getElementById('__shot_timeline')
  if (!node || window.recording) return
  var TL
  try {
    TL = JSON.parse(node.textContent)
  } catch (e) {
    return
  }

  const OPT = Object.assign(
    {
      autoplay: true,
      loop: true,
      playOnVisible: true,
      speed: 1,
      path: 'normalised',
      compressPausesMs: 400,
      showClicks: true,
      cursorSize: null, // null → the artwork's own size
      anchorToUi: true,
    },
    TL.opts || {},
  )

  const SRC_DUR = Math.max(1, TL.duration || 0)
  const N = Math.max(2, Math.round((SRC_DUR / 1000) * HZ) + 1)
  const tOf = (i) => (i * 1000) / HZ
  const clampIdx = (i) => Math.max(0, Math.min(N - 1, i | 0))
  const lerp = (a, b, f) => a + (b - a) * f

  // ---------------------------------------------------------------------
  // 1. Resample the raw pointer track onto a uniform grid
  // ---------------------------------------------------------------------
  // Pointer events arrive at whatever rate the OS/browser coalesces them to.
  // A fixed grid makes every later step (filtering, splines, sampling during
  // rAF) a plain array index instead of a search.
  const rawX = new Float64Array(N)
  const rawY = new Float64Array(N)
  const cur = TL.cursor || { t: [], x: [], y: [] }
  const hasPath = cur.t.length > 0
  {
    const t = cur.t
    const x = cur.x
    const y = cur.y
    let j = 0
    for (let i = 0; i < N; i++) {
      if (!hasPath) break
      const tt = tOf(i)
      while (j + 1 < t.length && t[j + 1] <= tt) j++
      if (tt <= t[0]) {
        rawX[i] = x[0]
        rawY[i] = y[0]
      } else if (j + 1 >= t.length) {
        rawX[i] = x[t.length - 1]
        rawY[i] = y[t.length - 1]
      } else {
        const span = t[j + 1] - t[j] || 1
        const f = Math.min(1, Math.max(0, (tt - t[j]) / span))

        rawY[i] = lerp(y[j], y[j + 1], f)

  // Long idle stretches are the main thing that makes a real recording drag.
  // Compressing them as a TIME remap (rather than editing the tracks) keeps
  // the cursor, scroll, hover and click channels automatically in sync.
  const scrollTracks = TL.scrolls || []
  // Every moment something OTHER than the pointer was moving. A stretch is
  // only a pause if NOTHING is happening: while wheel-scrolling, or panning a
  // canvas, the cursor sits perfectly still and the page is in full motion —
  // compressing that replays the motion several times too fast (measured: a
  // 1.09s canvas pan squashed into 0.4s).
  const activity = []
  for (const s of scrollTracks) for (const t of s.t) activity.push(t)
  for (const s of TL.styles || []) for (const t of s.t) activity.push(t)
  // Typing is activity even though nothing moves: the cursor rests in the
  // field, no state fires, and compressed away the whole string would land in
  // one frame instead of being typed out.
  for (const s of TL.inputs || []) for (const t of s.t) activity.push(t)
  // A state's transitions animate in wall-clock time, unaffected by this
  // remap, so leave the moments just after one alone or they get cut off.
  for (const st of TL.states || []) activity.push(st.t, st.t + 600)
  activity.sort((a, b) => a - b)
  const activityFrom = (a) => {
    let lo = 0
    let hi = activity.length
    while (lo < hi) {
      const m = (lo + hi) >> 1
      if (activity[m] <= a) lo = m + 1
      else hi = m
    }
    return lo
  }
  function buildRemap(maxPause) {
    const map = [[0, 0]] // [playbackTime, sourceTime]
    if (maxPause > 0) {
      // Compressible = the pointer is still AND nothing else is moving. A long
      // stationary stretch is split at each activity timestamp, so the idle
      // parts still shrink while the moving parts keep their real speed.
      const gaps = []
      for (const d of dwells) {
        const a = tOf(d.i)
        const b = tOf(d.j)
        let prev = a
        for (let k = activityFrom(a); k < activity.length && activity[k] < b; k++) {
          if (activity[k] - prev > maxPause) gaps.push([prev, activity[k]])
          prev = activity[k]
        }
        if (b - prev > maxPause) gaps.push([prev, b])
      }
      gaps.sort((x, y) => x[0] - y[0])
      let dst = 0
      let cur = 0
      for (const g of gaps) {
        if (g[0] < cur) continue // overlapping dwells — keep the first
        dst += g[0] - cur
        map.push([dst, g[0]])
        dst += maxPause
        map.push([dst, g[1]])
        cur = g[1]
      }
      map.push([dst + (SRC_DUR - cur), SRC_DUR])
    } else {
      map.push([SRC_DUR, SRC_DUR])
    }
    return map
  }
  let remap = buildRemap(0)
  const toSource = (t) => {
    for (let i = 1; i < remap.length; i++) {
      if (t <= remap[i][0]) {
        const span = remap[i][0] - remap[i - 1][0] || 1
        return lerp(remap[i - 1][1], remap[i][1], (t - remap[i - 1][0]) / span)
      }
    }
    return SRC_DUR
  }
  const playDuration = () => remap[remap.length - 1][0]

  // ---------------------------------------------------------------------
  // 5. Stage: cursor, ripples, and the styles they need
  // ---------------------------------------------------------------------
  const style = document.createElement('style')
  style.textContent =
    '#__shot_cursor{position:fixed;left:0;top:0;z-index:2147483646;pointer-events:none;' +
    'transform:translate3d(-200px,-200px,0);will-change:transform;opacity:0;transition:opacity .18s}' +
    '#__shot_cursor svg{display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35));transition:transform .09s ease-out}' +
    '#__shot_cursor.__down svg{transform:scale(.86)}' +
    '.__shot_ripple{position:fixed;z-index:2147483645;pointer-events:none;border-radius:50%;' +
    'border:2px solid rgba(59,130,246,.9);background:rgba(59,130,246,.18)}' +
    'html{scroll-behavior:auto !important}'
  document.head.appendChild(style)

  let ui = null // the toolbar root, once built (section 9)
  const cursor = document.createElement('div')
  cursor.id = '__shot_cursor'

  // --- the cursor artwork -------------------------------------------------
  // The macOS cursor set, inlined ahead of this runtime by capture.js as
  // window.__shotCursors (see cursors.js). WHICH of them to draw isn't in the
  // timeline; it's read off the export while it plays — see cursorFor in
  // section 6. Absent (an export made before this existed, or this file loaded
  // on its own), one plain arrow stands in for every kind.
  const SPRITE = window.__shotCursors || null
  // The fallback arrow, at the 17px this runtime drew before there was a sprite.
  const PLAIN = {
    vb: '0 0 12 19',
    x: 1,
    y: 1.3,
    nat: 17,
    d: '<path d="M1 1.3v14.2l3.3-3.4h5.1L1 1.3z" fill="#000" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/>',
  }
  const artOf = (kind) => {
    if (!SPRITE) return PLAIN
    return SPRITE.art[SPRITE.map[kind]] || SPRITE.art[SPRITE.map.default] || PLAIN
  }
  // One viewBox unit is one pixel: the artwork is drawn at the size macOS draws
  // it, which is the point of using the real thing. cursorSize overrides that
  // with a box size in px — and it scales the WHOLE set by one factor, so the
  // kinds keep their true proportions to each other (the pointing hand really
  // is wider than the arrow).
  const base = artOf('default')
  const baseW = Number(base.vb.split(' ')[2])
  const K = (OPT.cursorSize || base.nat || baseW) / baseW // px per viewBox unit
  // The element is placed AT the pointer position, so the artwork's hotspot has
  // to sit exactly on its origin. Two things would otherwise move it: the
  // height must keep the viewBox's aspect ratio (mismatched, the SVG scales to
  // fit and centres itself — measured 4.2px of drift), and the hotspot's own
  // inset inside the viewBox is pulled back out with a negative margin. The
  // press animation then scales around the hotspot rather than the box corner.
  const svgFor = (a) => {
    const vb = a.vb.split(' ')
    const hx = a.x * K
    const hy = a.y * K
    return (
      '<svg width="' + (vb[2] * K).toFixed(2) + '" height="' + (vb[3] * K).toFixed(2) +
      '" viewBox="' + a.vb + '" style="margin-left:' + (-hx).toFixed(2) + 'px;margin-top:' + (-hy).toFixed(2) +
      'px;transform-origin:' + hx.toFixed(2) + 'px ' + hy.toFixed(2) + 'px">' + a.d + '</svg>'
    )
  }
  let kind = null
  let kindLocked = false // recording.cursor.set() took the artwork over
  const setKind = (k) => {
    if (kindLocked || k === kind) return
    kind = k
    // `cursor: none` hides the pointer without hiding the click ripples, the
    // same way it does on the real page.
    cursor.innerHTML = k === 'none' ? '' : svgFor(artOf(k))
  }
  setKind('default')
  const mount = () => {
    ;(document.body || document.documentElement).appendChild(cursor)
  }
  if (document.body) mount()
  else document.addEventListener('DOMContentLoaded', mount)

  function ripple(x, y) {
    if (!OPT.showClicks) return
    const r = document.createElement('div')
    r.className = '__shot_ripple'
    r.style.left = x - 6 + 'px'
    r.style.top = y - 6 + 'px'
    r.style.width = r.style.height = '12px'
    ;(document.body || document.documentElement).appendChild(r)
    const anim = r.animate(
      [
        { transform: 'scale(.4)', opacity: 0.9 },
        { transform: 'scale(3.2)', opacity: 0 },
      ],
      { duration: 480, easing: 'cubic-bezier(.2,.7,.3,1)' },
    )
    anim.onfinish = () => r.remove()
  }

  // ---------------------------------------------------------------------
  // 6. Channels
  // ---------------------------------------------------------------------
  const byId = (h) => (h === 'root' ? document.scrollingElement || document.documentElement : document.querySelector('[data-h="' + h + '"]'))
  const scrollEls = []
  const scrollBase = []
  // Where a track stood at a given SOURCE time — [top, left], or null before
  // its first sample. Scroll offset is a STEP function: it only changes when an
  // event fired. Interpolate within a gesture (events land every frame or so)
  // but hold between gestures — otherwise a single jump at the end of a
  // recording would drift the page along for the whole thing.
  const scrollAt = (s, srcT) => {
    if (!s.t.length || srcT < s.t[0]) return null
    let i = 0
    while (i + 1 < s.t.length && s.t[i + 1] <= srcT) i++
    const span = i + 1 < s.t.length ? s.t[i + 1] - s.t[i] : 0
    if (span > 0 && span <= 160) {
      const f = Math.min(1, Math.max(0, (srcT - s.t[i]) / span))
      return [lerp(s.top[i], s.top[i + 1], f), lerp(s.left[i], s.left[i + 1], f)]
    }
    return [s.top[i], s.left[i]]
  }
  const applyScroll = (srcT) => {
    for (let k = 0; k < scrollTracks.length; k++) {
      const s = scrollTracks[k]
      if (!s.t.length) continue
      if (scrollEls[k] === undefined) {
        scrollEls[k] = byId(s.h)
        // Where this container sits with nothing applied — restored when we
        // rewind past the track's first sample, or the last applied offset
        // would stick around at times the recording knows nothing about.
        if (scrollEls[k]) scrollBase[k] = [scrollEls[k].scrollTop, scrollEls[k].scrollLeft]
      }
      const el = scrollEls[k]
      if (!el) continue
      const at = scrollAt(s, srcT)
      el.scrollTop = at ? at[0] : scrollBase[k][0]
      el.scrollLeft = at ? at[1] : scrollBase[k][1]
    }
  }

  // --- dark-mode attribute swaps ------------------------------------------
  // Almost everything a theme changes is CSS, and the capture writes it into a
  // @media (prefers-color-scheme: dark) block that needs no JavaScript. A URL
  // is the exception: a logo pair, or an embed pointed at a themed document.
  // CSS can't set an attribute, so those swaps travel as data and are applied
  // here — on load and whenever the viewer's preference changes. The light
  // value is whatever the document already carries, so nothing has to be
  // recorded twice, and a viewer with JavaScript off simply keeps it.
  {
    const swaps = []
    for (const s of TL.darkAttrs || []) {
      const el = byId(s.h)
      if (el) swaps.push({ el: el, a: s.a, dark: s.v, light: el.getAttribute(s.a) })
    }
    if (swaps.length) {
      const mq = window.matchMedia('(prefers-color-scheme: dark)')
      const applyAttrs = () => {
        for (const s of swaps) {
          const v = mq.matches ? s.dark : s.light
          // Only when it actually differs: reassigning src restarts a load.
          if (v == null) s.el.removeAttribute(s.a)
          else if (s.el.getAttribute(s.a) !== v) s.el.setAttribute(s.a, v)
        }
      }
      if (mq.addEventListener) mq.addEventListener('change', applyAttrs)
      else if (mq.addListener) mq.addListener(applyAttrs)
      applyAttrs()
    }
  }

  // Recorded DOM states. Each one is a full diff against the base capture, so
  // applying a state is "enable exactly one <style> block" and resetting is
  // "enable none". Text can't be expressed as CSS, so it rides along as ops.
  const states = TL.states || []
  const stateStyles = {}
  for (const s of document.querySelectorAll('style[data-shot-state]')) {
    stateStyles[s.getAttribute('data-shot-state')] = s
  }
  const baseText = new Map()
  let curState = -1
  const applyState = (srcT) => {
    let want = 0
    for (let i = 0; i < states.length; i++) if (states[i].t <= srcT) want = i + 1
    if (want === curState) return
    for (const k in stateStyles) stateStyles[k].media = 'not all'
    if (want) {
      const st = stateStyles[String(states[want - 1].i)]
      if (st) st.media = 'all'
    }
    for (const pair of baseText) pair[0].textContent = pair[1] // back to base…
    if (want) {
      for (const op of states[want - 1].ops || []) {
        const el = byId(op.h)
        if (!el) continue
        if (!baseText.has(el)) baseText.set(el, el.textContent)
        el.textContent = op.t
      }
    }
    curState = want
    emit('state', want)
  }

  // Inline style channel — JS-driven motion (smooth scrolling, a pan/zoom
  // canvas, a drag) recorded as the element's own style attribute over time.
  // Applied with !important so it beats a state's [data-h] override, and the
  // properties it touches are restored to their base values when it lets go.
  const styleTracks = TL.styles || []
  const styleEl = []
  const styleIdx = []
  const styleApplied = [] // Set of properties this track currently forces
  const styleBase = [] // property → [baseValue, basePriority] before we touched it
  const declCache = {}
  const parseDecls = (text) => {
    if (declCache[text]) return declCache[text]
    const probe = document.createElement('div')
    probe.style.cssText = text || ''
    const out = []
    for (let i = 0; i < probe.style.length; i++) {
      const p = probe.style[i]
      out.push([p, probe.style.getPropertyValue(p), probe.style.getPropertyPriority(p)])
    }
    return (declCache[text] = out)
  }
  const releaseStyle = (k, only) => {
    const el = styleEl[k]
    const held = styleApplied[k]
    if (!el || !held) return
    for (const p of held) {
      if (only && only.has(p)) continue
      const b = styleBase[k].get(p)
      if (b && b[0]) el.style.setProperty(p, b[0], b[1])
      else el.style.removeProperty(p)
      if (only) held.delete(p)
    }
    if (!only) styleApplied[k] = null
  }
  const applyStyles = (srcT) => {
    for (let k = 0; k < styleTracks.length; k++) {
      const s = styleTracks[k]
      if (!s.t.length) continue
      if (styleEl[k] === undefined) {
        styleEl[k] = byId(s.h)
        styleBase[k] = new Map()
        styleIdx[k] = -1
      }
      const el = styleEl[k]
      if (!el) continue
      // Before the first sample the element's base styling is the truth.
      if (srcT < s.t[0]) {
        if (styleIdx[k] !== -1) {
          releaseStyle(k)
          styleIdx[k] = -1
        }
        continue
      }
      let i = 0
      while (i + 1 < s.t.length && s.t[i + 1] <= srcT) i++
      if (styleIdx[k] === i) continue
      styleIdx[k] = i
      const decls = parseDecls(s.v[i])
      const next = new Set()
      for (const d of decls) next.add(d[0])
      releaseStyle(k, next) // drop what this sample no longer sets
      for (const d of decls) {
        if (!styleBase[k].has(d[0])) {
          styleBase[k].set(d[0], [el.style.getPropertyValue(d[0]), el.style.getPropertyPriority(d[0])])
        }
        el.style.setProperty(d[0], d[1], 'important')
      }
      styleApplied[k] = next
    }
  }

  // Typed input channel — what someone typed, checked or picked, recorded per
  // event (see recorder.js). A field's contents are a property rather than
  // style, so this sets them directly; the value the export was captured with
  // is remembered the first time a track is touched and put back when the
  // playhead rewinds in front of the first sample.
  const inputTracks = TL.inputs || []
  const inputEl = []
  const inputIdx = []
  const inputBase = []
  const setValue = (el, kind, v) => {
    try {
      if (kind === 'c') el.checked = !!v
      else el.value = v
    } catch (e) {}
  }
  const applyInputs = (srcT) => {
    for (let k = 0; k < inputTracks.length; k++) {
      const s = inputTracks[k]
      if (!s.t.length) continue
      if (inputEl[k] === undefined) {
        const el = (inputEl[k] = byId(s.h))
        inputIdx[k] = -1
        inputBase[k] = el ? (s.k === 'c' ? (el.checked ? 1 : 0) : el.value) : null
      }
      const el = inputEl[k]
      if (!el) continue
      if (srcT < s.t[0]) {
        if (inputIdx[k] !== -1) {
          setValue(el, s.k, inputBase[k])
          inputIdx[k] = -1
        }
        continue
      }
      let i = 0
      while (i + 1 < s.t.length && s.t[i + 1] <= srcT) i++
      if (inputIdx[k] === i) continue
      inputIdx[k] = i
      setValue(el, s.k, s.v[i])
    }
  }

  // Hover follows the DRAWN cursor, by hit-testing where it is — not the
  // recorded pointerover timestamps. Smoothing re-times the path, so a
  // timestamp-driven chain drifts out of step with the cursor you can see
  // (measured: exact in 'raw', off on ~7% of frames in 'normalised'). The
  // export's layout matches the recording's, so a hit test gives the same
  // element the real pointer was over — and stays right in every path mode.
  // The cursor and ripples are pointer-events:none, so they never hit-test. The
  // toolbar can't be — it has to take clicks — so when one exists the whole
  // stack under the point is read and its nodes skipped, which finds the page
  // element the cursor is really over even while it passes behind the bar.
  let hovered = []
  let hoverPt = null // where the last hit test was taken, for re-deriving later
  const hitTest = (x, y) => {
    if (!ui) return document.elementFromPoint(x, y)
    for (const n of document.elementsFromPoint(x, y)) if (!ui.contains(n)) return n
    return null
  }
  const applyHover = (x, y) => {
    hoverPt = x == null ? null : { x: x, y: y }
    let el = x == null ? null : hitTest(x, y)
    const want = []
    for (let n = el, i = 0; n && n.nodeType === 1 && i < 24; n = n.parentElement, i++) want.push(n)
    if (!(want.length === hovered.length && want.every((n, k) => n === hovered[k]))) {
      for (const n of hovered) n.classList.remove('__shot_hov')
      for (const n of want) n.classList.add('__shot_hov')
      hovered = want
    }
    // After the hover classes, never before: `.btn:hover{cursor:pointer}` is a
    // real and common thing, and reading the cursor first would show the
    // un-hovered one for a frame on the way in and out of every control.
    setKind(cursorFor(el, x, y))
  }

  // --- which cursor ---------------------------------------------------------
  // Not recorded — read off the export, live, for the same reason hover is. The
  // flattened CSS carries every element's computed `cursor`, and the class
  // above puts the export in the cascade state the real page was in, so
  // getComputedStyle under the drawn cursor answers what the pointer looked
  // like over that element at the moment it was recorded. Deriving it here also
  // keeps it in step with the cursor you can SEE in every path mode, where a
  // recorded, timestamp-driven track would drift once smoothing re-times things.
  //
  // The keyword, minus the parts a synthetic cursor can't honour: a `url()`
  // image is the page's own artwork, not the theme's, so it falls through to
  // whatever keyword the author gave after it (CSS requires one).
  const KEYWORD = /(?:^|,)\s*([a-z-]+)\s*$/
  const keywordOf = (cs) => {
    const m = KEYWORD.exec(((cs && cs.cursor) || '').trim())
    return m ? m[1] : 'default'
  }
  // `auto` is the UA's "work it out from the content" — an I-beam over text you
  // could select, an arrow everywhere else. That decision is NOT recoverable
  // from the recording: the computed value is `auto` at both ends, and no API
  // reports the shape the OS actually drew. So it's made again here from the
  // same two things the UA looks at: is this content selectable, and is the
  // point on a line of it.
  const NOT_TEXT = /^(BUTTON|SELECT|OPTION|OPTGROUP|IMG|SVG|VIDEO|AUDIO|CANVAS|IFRAME|OBJECT|EMBED|HR|BR|INPUT|TEXTAREA)$/
  const TEXT_INPUT = /^(text|search|url|tel|password|email|number|)$/
  const selectable = (el, cs) => {
    // Uppercased, not compared raw: an inline <svg> and its children report
    // their tag name as authored, so SVG elements come through lowercase.
    const tag = el.tagName.toUpperCase()
    if (el.isContentEditable) return true
    if (tag === 'INPUT') return TEXT_INPUT.test(el.type || '')
    if (tag === 'TEXTAREA') return true
    if (NOT_TEXT.test(tag)) return false
    // A button's label is text and hit-tests like text, but you can't select it
    // and the UA draws an arrow over it. Same for anything the page has opted
    // out of selecting.
    if (el.closest('button,select,summary,[role="button"]')) return false
    return (cs.webkitUserSelect || cs.userSelect) !== 'none'
  }
  // The element's own lines of text, as offsets INSIDE its box. A block can be
  // far taller than the text in it — the I-beam belongs on the lines, not on
  // the padding around them — so the text is measured rather than the element.
  //
  // What a range reports is the glyph runs, and a LINE BOX is bigger than its
  // glyphs in both directions: the empty run to the right of a short last line
  // still selects, and so does the half-leading above and below a line. Both
  // show an I-beam. So each row is widened to the content box, and grown
  // vertically until the rows meet — the rows of a block tile its content box,
  // which is what the outer edges snap to and the inner gaps split.
  //
  // Stored relative to the element so the test survives scrolling: these are
  // measured once and then hold, while the viewport coordinates they came from
  // are stale by the next frame.
  const lineBoxes = (el, cs) => {
    const box = el.getBoundingClientRect()
    const px = (v) => parseFloat(v) || 0
    const left = px(cs.borderLeftWidth) + px(cs.paddingLeft)
    const right = box.width - px(cs.borderRightWidth) - px(cs.paddingRight)
    const top = px(cs.borderTopWidth) + px(cs.paddingTop)
    const bottom = box.height - px(cs.borderBottomWidth) - px(cs.paddingBottom)
    const rows = []
    const r = document.createRange()
    for (let n = el.firstChild; n; n = n.nextSibling) {
      if (n.nodeType !== 3 || !/\S/.test(n.nodeValue)) continue
      r.selectNodeContents(n)
      const rects = r.getClientRects()
      for (let i = 0; i < rects.length; i++) {
        const t = rects[i].top - box.top
        const b = rects[i].bottom - box.top
        // Two runs on the same line (two text nodes, or a wrap) are one row.
        const row = rows.find((q) => t < q[3] && b > q[1])
        if (row) {
          row[1] = Math.min(row[1], t)
          row[3] = Math.max(row[3], b)
        } else {
          rows.push([Math.min(left, rects[i].left - box.left), t, Math.max(right, rects[i].right - box.left), b])
        }
      }
    }
    rows.sort((a, b) => a[1] - b[1])
    for (let i = 0; i < rows.length; i++) {
      if (i === 0) rows[i][1] = Math.min(rows[i][1], top)
      if (i === rows.length - 1) rows[i][3] = Math.max(rows[i][3], bottom)
      else if (rows[i][3] < rows[i + 1][1]) {
        const mid = (rows[i][3] + rows[i + 1][1]) / 2
        rows[i][3] = mid
        rows[i + 1][1] = mid
      }
    }
    return rows
  }
  // Measured once per element per DOM state — the two things the answer depends
  // on — so a frame costs a keyword lookup and, over text, one rect read.
  let kindEl = null
  let kindState = -1
  let kindKw = 'default'
  let kindLines = null
  const cursorFor = (el, x, y) => {
    if (!el) return 'default'
    if (el !== kindEl || kindState !== curState) {
      kindEl = el
      kindState = curState
      kindLines = null
      let cs = null
      try {
        cs = getComputedStyle(el)
      } catch (e) {}
      kindKw = keywordOf(cs)
      if (kindKw === 'auto') {
        if (!cs || !selectable(el, cs)) kindKw = 'default'
        else if (el.isContentEditable || /^(INPUT|TEXTAREA)$/.test(el.tagName.toUpperCase())) kindKw = 'text'
        else {
          kindLines = lineBoxes(el, cs)
          if (!kindLines.length) kindKw = 'default'
        }
      }
    }
    if (kindKw !== 'auto') return kindKw
    // Clamped into the box, because the hit test has already decided the point
    // is ON this element: Chrome resolves hit tests in units of 1/64px and
    // answers with an element up to about a pixel outside the box it reports
    // through getBoundingClientRect, so a point can be "on" a paragraph and
    // still measure above every line in it. Sub-pixel noise, not a gap.
    const box = kindEl.getBoundingClientRect()
    const px = Math.min(Math.max(x - box.left, 0), box.width)
    const py = Math.min(Math.max(y - box.top, 0), box.height)
    for (const b of kindLines) if (px >= b[0] && px <= b[2] && py >= b[1] && py <= b[3]) return 'text'
    return 'default'
  }

  // --- UI anchoring -------------------------------------------------------
  // The recorded path is absolute client coordinates, which only mean what they
  // meant at the size it was recorded at. Each anchor says "the pointer was at
  // this fraction of THIS element's box" — so wherever the element sits now
  // (narrower viewport, reflowed layout, different scroll), the anchor resolves
  // to a live point and the path is shifted to pass through it. Between two
  // anchors the shift blends linearly, which moves the path onto the new layout
  // while keeping the shape of the movement. At the recorded size every shift
  // is zero and this changes nothing.
  const stateAt = (srcT) => {
    let want = 0
    for (let i = 0; i < states.length; i++) if (states[i].t <= srcT) want = i + 1
    return want
  }
  const uiAnchors = (TL.anchors || [])
    .map((a) => ({ i: clampIdx(Math.round((a.t * HZ) / 1000)), t: a.t, st: stateAt(a.t), h: a.h, x: a.x, y: a.y, fx: a.fx, fy: a.fy, bw: a.bw, bh: a.bh, up: a.up, c: a.c }))
    .sort((p, q) => p.i - q.i)
  // Grouped by the DOM state that was live when each was recorded. An anchor
  // says where the pointer sat relative to the layout OF ITS OWN STATE, so
  // measuring one against a different state reports that state's own layout
  // change as though it were a shift the cursor should follow — which threw the
  // cursor across the page (measured: 1150px in a single frame) every time a
  // panel opened.
  const anchorsByState = []
  for (const a of uiAnchors) (anchorsByState[a.st] = anchorsByState[a.st] || []).push(a)
  const anchorEls = {}
  const ZERO = { dx: 0, dy: 0 }
  const anchorEl = (h) => {
    let el = anchorEls[h]
    if (el === undefined) {
      el = document.querySelector('[data-h="' + h + '"]')
      if (el) anchorEls[h] = el // don't cache a miss
    }
    return el || null
  }
  // Where inside a box the pointer was aiming, given how much that box has
  // changed size since. A box that only MOVED still holds its contents the same
  // way, so the recorded fraction points at the same thing and is used as-is —
  // which is what keeps the shift exactly zero at the recorded size. A box that
  // SHRANK has re-laid its contents out: the wide desktop button whose label is
  // `hidden lg:inline` collapses to just its arrow, and 93% across is now its
  // right border rather than the arrow it was. So the target is pulled toward
  // the box's centre in proportion to the collapse — a quarter of the recorded
  // width aims almost dead centre, which is where a collapsed control's
  // remaining content actually is.
  const aimed = (f, now, then) => (then > 0 ? 0.5 + (f - 0.5) * Math.min(1, now / then) : f)
  const pointIn = (el, s) => {
    const r = el.getBoundingClientRect()
    if (!r.width || !r.height) return null // not laid out at this size
    return {
      el: el,
      x: r.x + aimed(s.fx, r.width, s.bw) * r.width,
      y: r.y + aimed(s.fy, r.height, s.bh) * r.height,
      r: r,
    }
  }
  // The live point an anchor names. The element it was recorded on comes first;
  // if this layout has no box for it — the breakpoint removed it — its recorded
  // ancestors stand in, nearest first, so the cursor still lands on the control
  // that contained it instead of falling back to raw desktop coordinates.
  const resolveAnchor = (a) => {
    const el = anchorEl(a.h)
    const p = el && pointIn(el, a)
    if (p) return p
    for (const u of a.up || []) {
      const ue = anchorEl(u.h)
      const q = ue && pointIn(ue, u)
      if (q) return q
    }
    return null
  }
  // Which recorded scrollers this anchor's element rides inside. Cached: an
  // element doesn't change scroll container. Keyed on the element, because a
  // resize can move the anchor between its own element and a fallback ancestor.
  const anchorScrollers = (a, el) => {
    if (a.sc && a.scEl === el) return a.sc
    a.scEl = el
    const out = []
    for (let k = 0; k < scrollTracks.length; k++) {
      if (scrollEls[k] && scrollEls[k].contains(el)) out.push(k)
    }
    return (a.sc = out)
  }
  // A recorded pointer was, by construction, over something the person could
  // see. So a correction that would put the cursor off screen is not describing
  // a reflow — it's an element this export has parked out of view (a drawer
  // that never slid in, a fixed header laid out unscrolled), and following it
  // sends the cursor lunging off canvas and back. Measured on one export: 47 of
  // 108 anchors resolved off screen, and the drawn path ran to 2.7× the length
  // of the movement actually recorded. Leaving the path alone is the better
  // wrong answer; the export's own layout is what needs fixing there.
  const onScreen = (x, y) =>
    x >= -8 && y >= -8 && x <= window.innerWidth + 8 && y <= window.innerHeight + 8
  // Within one state the layout is static and the scroll is cancelled out
  // below, so an anchor's shift is a CONSTANT — measure it once and hold it.
  // Beyond saving a rect read per frame, that stops the correction flickering
  // when the element is mid-transition: it can't change under the cursor
  // halfway through a movement, and the on-screen verdict can't flip either.
  let shiftGen = 0
  const anchorShift = (a, srcT) => {
    if (a.gen === shiftGen) return a.shift
    a.gen = shiftGen
    a.shift = null
    const p = resolveAnchor(a)
    if (!p) return null // neither it nor its ancestors are laid out here
    // The anchor's coordinates are client coordinates from ITS OWN moment, so
    // they carry the scroll offset the page had then. Comparing them against a
    // rect measured NOW counts everything scrolled in between as a layout
    // difference, and the cursor gets dragged toward where the element
    // currently is — long before the recorded scroll has brought it there
    // (measured: a 138px detour at the very size it was recorded at, where the
    // shift is meant to be exactly zero). Adding back the scroll travelled
    // since puts both sides in document coordinates, where they belong.
    let sx = 0
    let sy = 0
    for (const k of anchorScrollers(a, p.el)) {
      const now = scrollAt(scrollTracks[k], srcT)
      const then = scrollAt(scrollTracks[k], a.t)
      if (!now || !then) continue
      sy += now[0] - then[0]
      sx += now[1] - then[1]
    }
    const dx = p.x - a.x + sx
    const dy = p.y - a.y + sy
    // Tested on where the cursor would be SENT (the recorded point plus the
    // shift), which is scroll-invariant for the same reason the shift is — so
    // the verdict holds for the whole state and can be cached with it.
    if (!onScreen(a.x + dx, a.y + dy)) return null
    return (a.shift = { dx: dx, dy: dy })
  }
  // Only anchors from the state that is live now. One from another state
  // describes a layout that isn't on screen, and borrowing it applies that
  // state's own layout change to the cursor (measured: a constant 711px offset
  // held for a whole state). With none to go on, the recorded coordinates are
  // the best guess there is.
  const bracketAt = (fi) => {
    const list = anchorsByState[curState] || []
    let lo = 0
    let hi = list.length
    while (lo < hi) {
      const m = (lo + hi) >> 1
      if (list[m].i <= fi) lo = m + 1
      else hi = m
    }
    return [lo > 0 ? list[lo - 1] : null, lo < list.length ? list[lo] : null]
  }
  // Recorded scroll offsets are absolute pixels too, so at a shorter viewport
  // the element the cursor is heading for can end up outside its scroller —
  // and the cursor would faithfully follow it off screen. Nudge the scroller
  // by the smallest amount that brings it back into view; the warp then picks
  // up its new position on the same frame.
  // Only a container the page itself would let you scroll. The root is the
  // last resort and NOT usable when the page locks scrolling (overflow:hidden
  // on html/body — which is exactly what a site does while a modal/route panel
  // is open); scrolling it anyway made the page behind the panel drift up and
  // down during playback.
  const scrollerFor = (el) => {
    for (let n = el.parentElement; n; n = n.parentElement) {
      const cs = getComputedStyle(n)
      if (/auto|scroll/.test(cs.overflowY) && n.scrollHeight > n.clientHeight + 1) return n
    }
    const root = document.scrollingElement || document.documentElement
    if (!root) return null
    if (getComputedStyle(document.documentElement).overflowY === 'hidden') return null
    if (document.body && getComputedStyle(document.body).overflowY === 'hidden') return null
    return root.scrollHeight > root.clientHeight + 1 ? root : null
  }
  // How far the target's scroller must move for it to be on screen — measured
  // under the scroll state THE RECORDING WILL HAVE at the anchor's own moment,
  // not the current one. Asking at the current moment pre-empts the recorded
  // scroll: an element that the user was about to scroll into view looks
  // off-screen now, and the page would jump ahead of the movement.
  // Cached per anchor, and only recomputed when the viewport changes.
  let fix = null
  const fixFor = (a, srcT) => {
    if (fix && fix.i === a.i) return fix
    applyScroll(a.t) // pretend we're at the anchor…
    fix = { i: a.i, sc: null, d: 0 }
    const p = resolveAnchor(a)
    if (p) {
      const r = p.r
      const sc = scrollerFor(p.el)
      if (sc) {
        const isRoot = sc === document.scrollingElement || sc === document.documentElement
        const box = isRoot ? { top: 0, bottom: window.innerHeight } : sc.getBoundingClientRect()
        const pad = 12
        let d = 0
        if (r.top < box.top + pad) d = r.top - box.top - pad
        else if (r.bottom > box.bottom - pad) d = r.bottom - box.bottom + pad
        if (d) fix = { i: a.i, sc: sc, d: d }
      }
    }
    applyScroll(srcT) // …and back
    return fix
  }
  window.addEventListener('resize', () => { fix = null; shiftGen++ })
  const warpAt = (fi, srcT) => {
    if (!uiAnchors.length) return ZERO
    const br = bracketAt(fi)
    const a = br[0]
    const b = br[1]
    const da = a ? anchorShift(a, srcT) : null
    const db = b ? anchorShift(b, srcT) : null
    if (!da) return db || ZERO
    if (!db) return da
    const span = b.i - a.i || 1
    const u = Math.min(1, Math.max(0, (fi - a.i) / span))
    return { dx: lerp(da.dx, db.dx, u), dy: lerp(da.dy, db.dy, u) }
  }
  // A state really does relocate the elements the anchors point at, so the
  // correction really does step when one lands. Ease onto the new value rather
  // than teleporting — while a seek or scrub snaps, there being no motion to
  // stay continuous with.
  let warpShown = null
  let warpSnap = true
  const easedWarp = (w) => {
    if (!warpShown || warpSnap) {
      warpSnap = false
      return (warpShown = { dx: w.dx, dy: w.dy })
    }
    warpShown.dx += (w.dx - warpShown.dx) * 0.3
    warpShown.dy += (w.dy - warpShown.dy) * 0.3
    return warpShown
  }

  const sampleCursor = (srcT) => {
    if (!hasPath) return null
    const p = pathFor(OPT.path === 'raw' ? 'raw' : OPT.path)
    const fi = Math.min(N - 1, Math.max(0, (srcT * HZ) / 1000))
    const i = Math.floor(fi)
    const j = Math.min(N - 1, i + 1)
    const f = fi - i
    let w = ZERO
    if (OPT.anchorToUi === false) warpShown = null
    else w = easedWarp(warpAt(fi, srcT))
    const x = lerp(p.x[i], p.x[j], f) + w.dx
    const y = lerp(p.y[i], p.y[j], f) + w.dy
    cursor.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0)'
    if (!cursorHidden) cursor.style.opacity = '1'
    return { x: x, y: y }
  }

  // ---------------------------------------------------------------------
  // 7. Clock
  // ---------------------------------------------------------------------
  let time = 0 // playback ms
  let playing = false
  let rafId = 0
  let last = 0
  let clickCursor = 0 // index of the next click to fire
  let pressUntil = 0
  let cursorHidden = false
  const listeners = {}
  const emit = (name, arg) => {
    for (const fn of listeners[name] || []) {
      try {
        fn(arg)
      } catch (e) {}
    }
  }

  function render() {
    const srcT = toSource(time)
    // Order matters: states and inline styles change the layout, scrolling
    // depends on that layout, and the hover hit test below depends on both.
    applyState(srcT)
    applyStyles(srcT)
    applyInputs(srcT)
    applyScroll(srcT)
    if (OPT.anchorToUi !== false && uiAnchors.length) {
      // Keep the element we're about to CLICK on screen — and only that one.
      // Correcting for every anchor the pointer merely crosses would shove the
      // page around constantly; correcting long in advance would scroll it
      // before the movement that explains it.
      // Either side: bracketAt gives the anchor strictly after fi, so at the
      // click frame itself the click is the one BEHIND us. Hold the correction
      // for a moment after it too, or it would snap back mid-click.
      const fi = Math.min(N - 1, Math.max(0, (srcT * HZ) / 1000))
      const br = bracketAt(fi)
      let near = null
      for (const a of br) {
        if (!a || !a.c) continue
        const dt = (Math.abs(a.i - fi) * 1000) / HZ
        if (dt <= 500 && (!near || dt < near.dt)) near = { a: a, dt: dt }
      }
      if (near) {
        const f = fixFor(near.a, srcT)
        if (f.sc && f.d) f.sc.scrollTop += f.d
      }
    }
    const at = sampleCursor(srcT)
    applyHover(at ? at.x : null, at ? at.y : null)
    while (clickCursor < clicks.length && clicks[clickCursor].t <= srcT) {
      const c = clicks[clickCursor++]
      // Ripple where the cursor actually IS — the anchored position, not the
      // recorded coordinate, or it would land away from the button.
      ripple(at ? at.x : c.x, at ? at.y : c.y)
      pressUntil = time + 130
      cursor.classList.add('__down')
    }
    if (pressUntil && time > pressUntil) {
      pressUntil = 0
      cursor.classList.remove('__down')
    }
  }

  function frame(now) {
    if (!playing) return
    const dt = Math.min(100, now - last) * (OPT.speed || 1)
    last = now
    time += dt
    const dur = playDuration()
    if (time >= dur) {
      if (OPT.loop) {
        seek(0)
        time = 0
      } else {
        time = dur
        render()
        pause()
        emit('end')
        return
      }
    }
    render()
    emit('time', time)
    rafId = requestAnimationFrame(frame)
  }

  function play() {
    if (playing) return api
    playing = true
    last = performance.now()
    rafId = requestAnimationFrame(frame)
    emit('play')
    return api
  }
  function pause() {
    if (!playing) return api
    playing = false
    cancelAnimationFrame(rafId)
    emit('pause')
    return api
  }
  function seek(t) {
    time = Math.max(0, Math.min(playDuration(), t || 0))
    // Re-arm the click channel so a rewind replays them and a scrub forward
    // doesn't dump every missed ripple at once.
    const srcT = toSource(time)
    clickCursor = 0
    while (clickCursor < clicks.length && clicks[clickCursor].t <= srcT) clickCursor++
    cursor.classList.remove('__down')
    pressUntil = 0
    warpSnap = true
    render()
    emit('time', time)
    return api
  }
  function reset() {
    pause()
    seek(0)
    return api
  }

  function setPath(mode) {
    OPT.path = mode === 'raw' || mode === 'smooth' ? mode : 'normalised'
    remap = buildRemap(OPT.path === 'raw' ? 0 : OPT.compressPausesMs)
    seek(Math.min(time, playDuration()))
    emit('remap') // the duration, and where the click marks land, both moved
    return api
  }

  const api = {
    play: play,
    pause: pause,
    toggle: () => (playing ? pause() : play()),
    reset: reset,
    seek: seek,
    // Seek by SOURCE time — the timeline's own clock, which is what clicks,
    // states and style samples are stamped with. Differs from playback time
    // whenever pauses are compressed; this inverts that remap.
    seekSource: (t) => {
      for (let i = 1; i < remap.length; i++) {
        if (t <= remap[i][1]) {
          const span = remap[i][1] - remap[i - 1][1] || 1
          return seek(lerp(remap[i - 1][0], remap[i][0], (t - remap[i - 1][1]) / span))
        }
      }
      return seek(playDuration())
    },
    setSpeed: (v) => {
      OPT.speed = Number(v) || 1
      return api
    },
    setPath: setPath,
    setCompressPauses: (ms) => {
      OPT.compressPausesMs = Math.max(0, Number(ms) || 0)
      return setPath(OPT.path)
    },
    setLoop: (v) => {
      OPT.loop = !!v
      return api
    },
    // Off = replay the raw coordinates, which only line up at the size the
    // recording was made at.
    setAnchorToUi: (v) => {
      OPT.anchorToUi = v !== false
      return seek(time)
    },
    cursor: {
      show: () => ((cursorHidden = false), (cursor.style.opacity = '1'), api),
      hide: () => ((cursorHidden = true), (cursor.style.opacity = '0'), api),
      element: cursor,
      // Take the artwork over with your own markup — playback stops swapping it
      // per element until set(null) hands it back.
      set: (svg) => {
        kindLocked = svg != null
        if (svg != null) cursor.innerHTML = svg
        else {
          kind = null
          applyHover(hoverPt ? hoverPt.x : null, hoverPt ? hoverPt.y : null)
        }
        return api
      },
      // Which of the theme's cursors is being drawn — a CSS keyword.
      get kind() {
        return kind
      },
    },
    on: (name, fn) => {
      ;(listeners[name] = listeners[name] || []).push(fn)
      return () => api.off(name, fn)
    },
    off: (name, fn) => {
      listeners[name] = (listeners[name] || []).filter((f) => f !== fn)
      return api
    },
    get playing() {
      return playing
    },
    get time() {
      return time
    },
    get sourceTime() {
      return toSource(time)
    },
    get duration() {
      return playDuration()
    },
    get options() {
      return OPT
    },
    get state() {
      return curState
    },
    get states() {
      return states.length
    },
    timeline: TL,
  }
  window.recording = api

  // ---------------------------------------------------------------------
  // 8. Toolbar
  // ---------------------------------------------------------------------
  // Transport plus the settings that are live switches rather than export
  // decisions (path mode, speed, pause trimming, loop, cursor, UI anchoring) —
  // everything window.recording exposes, without a console. It sits BELOW the
  // synthetic cursor in z-order so the cursor still draws over it, and its own
  // nodes are skipped by the hover hit test (see hitTest).
  //
  // The export's flattened styles are per-element, so nothing here inherits a
  // layout from the page, but inherited properties (font, colour, letter
  // spacing) would leak in — hence the scoped reset.
  const buildUi = () => {
    // Every component rule is scoped under the id as well: the reset needs
    // `#__shot_ui *` to reach the whole subtree, and an id in the selector would
    // otherwise out-specify a bare class no matter what order they came in.
    const U = '#__shot_ui '
    const css =
      '#__shot_ui,#__shot_ui *{box-sizing:border-box;margin:0;padding:0;border:0;background:none;' +
      'font:inherit;color:inherit;letter-spacing:normal;text-transform:none;line-height:1;' +
      'text-align:left;text-shadow:none;text-decoration:none;-webkit-font-smoothing:antialiased}' +
      '#__shot_ui{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:2147483644;' +
      'font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:12px;' +
      'color:#fff;display:flex;flex-direction:column;align-items:stretch;gap:8px;' +
      'opacity:0;transition:opacity .2s;pointer-events:none}' +
      '#__shot_ui[data-show]{opacity:1;pointer-events:auto}' +
      '#__shot_ui button{cursor:pointer;-webkit-appearance:none;appearance:none}' +
      U + '.__shot_bar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:999px;' +
      'background:rgba(18,18,20,.82);backdrop-filter:blur(12px) saturate(1.4);' +
      '-webkit-backdrop-filter:blur(12px) saturate(1.4);border:1px solid rgba(255,255,255,.14);' +
      'box-shadow:0 6px 24px rgba(0,0,0,.32)}' +
      U + '.__shot_ico{width:28px;height:28px;flex:0 0 auto;display:flex;align-items:center;' +
      'justify-content:center;border-radius:50%;color:rgba(255,255,255,.92);transition:background .12s}' +
      U + '.__shot_ico:hover{background:rgba(255,255,255,.14)}' +
      U + '.__shot_ico[data-on]{background:rgba(255,255,255,.18)}' +
      U + '.__shot_ico svg{display:block;width:14px;height:14px;fill:currentColor}' +
      U + '.__shot_track{position:relative;width:min(46vw,320px);height:16px;flex:0 0 auto;' +
      'display:flex;align-items:center;cursor:pointer;touch-action:none}' +
      U + '.__shot_rail{position:relative;width:100%;height:4px;border-radius:2px;' +
      'background:rgba(255,255,255,.24)}' +
      U + '.__shot_fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:2px;background:#fff}' +
      U + '.__shot_knob{position:absolute;top:50%;left:0;width:11px;height:11px;border-radius:50%;' +
      'background:#fff;transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.4);' +
      'transition:width .12s,height .12s}' +
      U + '.__shot_track:hover .__shot_knob,' + U + '.__shot_track[data-drag] .__shot_knob{width:15px;height:15px}' +
      U + '.__shot_mark{position:absolute;top:50%;width:3px;height:3px;border-radius:50%;' +
      'background:rgba(0,0,0,.5);transform:translate(-50%,-50%);pointer-events:none}' +
      U + '.__shot_time{flex:0 0 auto;font-variant-numeric:tabular-nums;font-size:11px;' +
      'color:rgba(255,255,255,.72);white-space:nowrap}' +
      U + '.__shot_panel{align-self:flex-end;padding:12px 14px;border-radius:14px;display:none;' +
      'flex-direction:column;gap:12px;min-width:250px;background:rgba(18,18,20,.9);' +
      'backdrop-filter:blur(12px) saturate(1.4);-webkit-backdrop-filter:blur(12px) saturate(1.4);' +
      'border:1px solid rgba(255,255,255,.14);box-shadow:0 8px 32px rgba(0,0,0,.36)}' +
      '#__shot_ui[data-panel] .__shot_panel{display:flex}' +
      U + '.__shot_row{display:flex;align-items:center;justify-content:space-between;gap:14px}' +
      U + '.__shot_lbl{color:rgba(255,255,255,.6);font-size:11px;flex:0 0 auto}' +
      U + '.__shot_seg{display:flex;gap:2px;padding:2px;border-radius:8px;background:rgba(255,255,255,.09)}' +
      U + '.__shot_seg button{padding:4px 8px;border-radius:6px;font-size:11px;' +
      'color:rgba(255,255,255,.66);white-space:nowrap;transition:background .12s,color .12s}' +
      U + '.__shot_seg button:hover{color:#fff}' +
      U + '.__shot_seg button[data-on]{background:rgba(255,255,255,.9);color:#141416}' +
      '@media (prefers-reduced-motion:reduce){#__shot_ui,#__shot_ui *{transition:none !important}}'
    const st = document.createElement('style')
    st.textContent = css
    document.head.appendChild(st)

    const el = (tag, cls, parent) => {
      const n = document.createElement(tag)
      if (cls) n.className = cls
      if (parent) parent.appendChild(n)
      return n
    }
    const icon = (d) =>
      '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + d + '"/></svg>'
    const PLAY = 'M8 5.1v13.8a1 1 0 0 0 1.5.87l11.2-6.9a1 1 0 0 0 0-1.74L9.5 4.23A1 1 0 0 0 8 5.1z'
    const PAUSE = 'M6 4h4v16H6zM14 4h4v16h-4z'
    const GEAR =
      'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9.4 4a7.5 7.5 0 0 1-.08 1.05l2.02 1.58-2 3.46-2.4-.96a7.6 7.6 0 0 1-1.82 1.05L16.75 22h-4l-.37-2.82a7.6 7.6 0 0 1-1.82-1.05l-2.4.96-2-3.46 2.02-1.58a7.6 7.6 0 0 1 0-2.1L4.16 10.37l2-3.46 2.4.96A7.6 7.6 0 0 1 10.38 6.8L12.75 4h4l.37 2.82c.65.26 1.26.61 1.82 1.05l2.4-.96 2 3.46-2.02 1.58c.05.34.08.7.08 1.05z'

    ui = el('div', null, null)
    ui.id = '__shot_ui'
    const panel = el('div', '__shot_panel', ui)
    const bar = el('div', '__shot_bar', ui)

    // A pointer click leaves focus on the button, and Space would then re-press
    // it instead of reaching the global shortcut. Keyboard activation (detail 0)
    // keeps focus, so tabbing through still works.
    const onPress = (b, fn) =>
      b.addEventListener('click', (e) => {
        if (e.detail) b.blur()
        fn()
      })

    const playBtn = el('button', '__shot_ico', bar)
    playBtn.type = 'button'
    playBtn.title = 'Play / pause (space)'
    playBtn.innerHTML = icon(PLAY)
    const playPath = playBtn.querySelector('path') // swapped in place, so a
    onPress(playBtn, () => api.toggle()) // rebuild can't drop focus mid-press

    const track = el('div', '__shot_track', bar)
    track.setAttribute('role', 'slider')
    track.setAttribute('aria-label', 'Playback position')
    track.tabIndex = 0
    const rail = el('div', '__shot_rail', track)
    const fill = el('div', '__shot_fill', rail)
    const knob = el('div', '__shot_knob', rail)
    // Where the recorded clicks fall — the landmarks of the take, so a scrub
    // can be aimed at one instead of hunted for.
    for (const c of clicks) {
      const m = el('div', '__shot_mark', rail)
      m.__t = c.t
    }

    const time = el('span', '__shot_time', bar)

    const gear = el('button', '__shot_ico', bar)
    gear.type = 'button'
    gear.title = 'Settings'
    gear.innerHTML = icon(GEAR)
    onPress(gear, () => {
      const open = ui.hasAttribute('data-panel')
      if (open) ui.removeAttribute('data-panel')
      else ui.setAttribute('data-panel', '')
      gear.toggleAttribute('data-on', !open)
      if (!open) syncPanel() // console changes since it was last open
      show()
    })

    // --- settings rows ---
    // Each is a segmented control bound to one live setter; `read` says which
    // option is current, so the panel reflects changes made from the console.
    const segs = []
    const addSeg = (label, options, read, write) => {
      const row = el('div', '__shot_row', panel)
      const l = el('span', '__shot_lbl', row)
      l.textContent = label
      const seg = el('div', '__shot_seg', row)
      const btns = options.map((o) => {
        const b = el('button', null, seg)
        b.type = 'button'
        b.textContent = o[0]
        onPress(b, () => {
          write(o[1])
          syncPanel()
          show()
        })
        return b
      })
      segs.push(() => {
        const now = read()
        for (let i = 0; i < btns.length; i++) btns[i].toggleAttribute('data-on', options[i][1] === now)
      })
    }
    const syncPanel = () => {
      for (const f of segs) f()
    }

    addSeg('Cursor path', [['Raw', 'raw'], ['Smooth', 'smooth'], ['Natural', 'normalised']],
      () => OPT.path, (v) => api.setPath(v))
    addSeg('Trim pauses', [['Off', 0], ['0.2s', 200], ['0.4s', 400], ['0.8s', 800]],
      () => OPT.compressPausesMs, (v) => api.setCompressPauses(v))
    addSeg('Speed', [['0.5×', 0.5], ['1×', 1], ['1.5×', 1.5], ['2×', 2]],
      () => OPT.speed, (v) => api.setSpeed(v))
    addSeg('Loop', [['Off', false], ['On', true]],
      () => OPT.loop !== false, (v) => api.setLoop(v))
    addSeg('Cursor', [['Hide', false], ['Show', true]],
      () => !cursorHidden, (v) => (v ? api.cursor.show() : api.cursor.hide()))
    addSeg('Follow UI', [['Off', false], ['On', true]],
      () => OPT.anchorToUi !== false, (v) => api.setAnchorToUi(v))

    ;(document.body || document.documentElement).appendChild(ui)

    // --- transport wiring ---
    const fmt = (ms) => {
      const s = Math.max(0, Math.round(ms / 1000))
      return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0')
    }
    let lastLabel = ''
    const paint = () => {
      const dur = api.duration || 1
      const u = Math.min(1, Math.max(0, api.time / dur))
      fill.style.width = u * 100 + '%'
      knob.style.left = u * 100 + '%'
      const label = fmt(api.time) + ' / ' + fmt(dur)
      if (label !== lastLabel) time.textContent = (lastLabel = label)
    }
    // Click marks live on the SOURCE clock; pause trimming moves where they
    // land on the bar, so they are re-placed whenever the mapping changes.
    const paintMarks = () => {
      const dur = api.duration || 1
      for (const m of rail.querySelectorAll('.__shot_mark')) {
        // sourceTime → playback time, the same inversion seekSource does.
        let t = 0
        for (let i = 1; i < remap.length; i++) {
          if (m.__t <= remap[i][1]) {
            const span = remap[i][1] - remap[i - 1][1] || 1
            t = lerp(remap[i - 1][0], remap[i][0], (m.__t - remap[i - 1][1]) / span)
            break
          }
          t = remap[i][0]
        }
        m.style.left = Math.min(1, Math.max(0, t / dur)) * 100 + '%'
      }
    }
    const paintPlay = () => {
      playPath.setAttribute('d', api.playing ? PAUSE : PLAY)
      playBtn.setAttribute('aria-label', api.playing ? 'Pause' : 'Play')
    }

    // --- scrubbing ---
    const atX = (clientX) => {
      const r = rail.getBoundingClientRect()
      return Math.min(1, Math.max(0, (clientX - r.left) / (r.width || 1))) * api.duration
    }
    let resume = false
    track.addEventListener('pointerdown', (e) => {
      e.preventDefault()
      track.setPointerCapture(e.pointerId)
      track.setAttribute('data-drag', '')
      resume = api.playing
      api.pause()
      api.seek(atX(e.clientX))
    })
    track.addEventListener('pointermove', (e) => {
      if (track.hasAttribute('data-drag')) api.seek(atX(e.clientX))
    })
    const endDrag = () => {
      if (!track.hasAttribute('data-drag')) return
      track.removeAttribute('data-drag')
      if (resume) api.play()
    }
    track.addEventListener('pointerup', endDrag)
    track.addEventListener('pointercancel', endDrag)
    track.addEventListener('keydown', (e) => {
      const step = e.shiftKey ? 1000 : 5000
      if (e.key === 'ArrowLeft') api.seek(api.time - step)
      else if (e.key === 'ArrowRight') api.seek(api.time + step)
      else return
      e.preventDefault()
    })

    // --- auto-hide ---
    // Out of the way while it plays, back the moment the viewer reaches for it.
    // Never hidden while paused, mid-scrub, or with the panel open — those are
    // all states the viewer put it in deliberately.
    let hideTimer = 0
    const show = () => {
      ui.setAttribute('data-show', '')
      clearTimeout(hideTimer)
      hideTimer = setTimeout(() => {
        if (!api.playing || ui.matches(':hover') || ui.hasAttribute('data-panel') || track.hasAttribute('data-drag')) return
        ui.removeAttribute('data-show')
      }, 2200)
    }
    for (const ev of ['pointermove', 'pointerdown', 'keydown', 'wheel']) {
      window.addEventListener(ev, show, { passive: true })
    }
    ui.addEventListener('pointerenter', show)

    // Space is the universal play/pause; leave it alone if the viewer is typing
    // somewhere (an export can contain a real input).
    document.addEventListener('keydown', (e) => {
      const t = e.target
      if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return
      if (t && ui.contains(t)) return // the focused control owns its own keys
      if (e.code === 'Space' || e.key === ' ') {
        e.preventDefault()
        api.toggle()
      } else if (e.key === 'ArrowLeft') api.seek(api.time - (e.shiftKey ? 1000 : 5000))
      else if (e.key === 'ArrowRight') api.seek(api.time + (e.shiftKey ? 1000 : 5000))
      else return
      show()
    })

    api.on('time', paint)
    api.on('play', () => { paintPlay(); show() })
    api.on('pause', () => { paintPlay(); show() })
    api.on('remap', () => { paint(); paintMarks(); syncPanel() })
    paintPlay()
    paint()
    paintMarks()
    syncPanel()
    show()
  }

  // ---------------------------------------------------------------------
  // 9. Autostart
  // ---------------------------------------------------------------------
  setPath(OPT.path)
  seek(0)
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches
  const start = () => {
    if (reduced || !OPT.autoplay) return
    if (OPT.playOnVisible && 'IntersectionObserver' in window) {
      // threshold 0, not a fraction: on a page taller than the viewport the
      // visible RATIO of <body> can never reach a fraction, and playback would
      // never start.
      const io = new IntersectionObserver((entries) => {
        for (const e of entries) (e.isIntersecting ? play : pause)()
      }, { threshold: 0 })
      io.observe(document.body)
    } else {
      play()
    }
  }
  const boot = () => {
    // A broken toolbar must not take the playback down with it.
    if (OPT.controls !== false) {
      try { buildUi() } catch (e) { console.error('[shot] toolbar failed', e) }
    }
    start()
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot)
  else boot()
  document.dispatchEvent(new CustomEvent('shot:ready', { detail: api }))
})()
</script></body></html>
