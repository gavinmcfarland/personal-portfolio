          <button class="navicon js-menu" aria-label="Open navigation menu"
                  aria-expanded="${drawn}">${s24(NAV.menu)}</button>
          <button class="titlebtn js-cal" aria-expanded="${calOpen}"
                  aria-label="${title} — choose a day">
            <span>${title}</span>${s24(NAV.chev)}
          </button>
          <span class="grow"></span>
          <button class="navicon js-filter${filtering() ? " on" : ""}"
                  aria-haspopup="dialog" aria-expanded="${picking}"
                  aria-label="Choose what to show">${s24(NAV.filter)}</button>
          <button class="navicon js-now" aria-label="Back to now">${s24(NAV.today)}</button>
          <button class="navicon" aria-label="More options">${s24(NAV.more)}</button>
        </header>
        ${filtering() ? filterNote() : ``}
        ${calOpen ? calendar() : ``}
        ${view === "timeline" ? timelineView() : dayView()}
      </div>
      ${detail ? `` : `<button class="fab js-sheet" aria-label="Record something">${s24(NAV.plus)}</button>`}
      ${logSheet()}
      ${kindsSheet()}
      ${drawer()}`;
  }

  const wall = document.getElementById("wall");
  /* typing the name does not redraw — a redraw would take the caret with it */
  wall.addEventListener("input", ev => {
    const nameEl = ev.target.closest && ev.target.closest(".js-dname");
    if (nameEl){ editName = nameEl.value; return; }

    /* The field sheet's foot, for the same reason the routines page writes as it is
       typed: there is no Save on the sheet to hold it back, and a redraw would take the
       caret out of the box. What has to keep up is repainted where it stands. */
    const custEl = ev.target.closest && ev.target.closest(
      ".js-cust-a, .js-cust-b, .js-cust-n, .js-cust-h, .js-cust-m");
    if (custEl){ writeCustom(); return; }

    /* A distance between two hours is written by moving the later one, which is the
       other direction through the same fact — see writeGap. */
    const gapEl = ev.target.closest && ev.target.closest(".js-cust-gap");
    if (gapEl){ writeGap(gapEl); return; }

    /* The routines page has no Save, so each keystroke writes straight into the
       register — which is also why none of these redraw: the band being typed into is
       the band on screen, and rebuilding it would take the caret with it. */
    const rtName = ev.target.closest && ev.target.closest(".js-rt-name");
    if (rtName){
      const r = routineById(rtName.dataset.rt);
      /* an unnamed occasion is still an occasion, so an empty field is allowed to
         stand while it is being retyped — it is read back as blank, not as nothing */
      if (r) r.name = rtName.value;
      return;
    }
    const rtH = ev.target.closest && ev.target.closest(".js-rt-h");
    if (rtH){
      const r = routineById(rtH.dataset.rt), h = parseInt(rtH.value, 10);
      if (r && !isNaN(h) && h >= 0 && h <= 23){ r.at = h*60 + (r.at % 60); paintMark(r); }
      return;
    }
    const rtM = ev.target.closest && ev.target.closest(".js-rt-m");
    if (rtM){
      const r = routineById(rtM.dataset.rt), m = parseInt(rtM.value, 10);
      if (r && !isNaN(m) && m >= 0 && m <= 59){ r.at = Math.floor(r.at/60)*60 + m; paintMark(r); }
      return;
    }

    /* The pad writes into what is held back rather than into the register, and repaints
       only the line that reads the figures — the band and the comparison have to keep up
       with what is being typed, and a redraw would take the caret out of the field. */
    const padField = ev.target.closest && ev.target.closest(
      ".js-pad-n, .js-pad-s, .js-pad-d, .js-pad-p, .js-pad-note");
    if (padField){
      const key = padField.classList.contains("js-pad-n") ? "n"
        : padField.classList.contains("js-pad-s") ? "s"
        : padField.classList.contains("js-pad-d") ? "d"
        : padField.classList.contains("js-pad-p") ? "p" : "note";
      padVals[key] = padField.value;
      if (key !== "note") paintPad();
      return;
    }

    /* the two halves of the clock are edited separately, so each writes its own part */
    const hEl = ev.target.closest && ev.target.closest(".js-h");
    if (hEl){
      const h = parseInt(hEl.value, 10);
      if (!isNaN(h) && h >= 0 && h <= 23) logAt = h * 60 + (logAt % 60);
      return;
    }
    const mEl = ev.target.closest && ev.target.closest(".js-m");
    if (mEl){
      const m = parseInt(mEl.value, 10);
      if (!isNaN(m) && m >= 0 && m <= 59) logAt = Math.floor(logAt / 60) * 60 + m;
    }
  });
  /* Which page is on screen, as opposed to which destination it belongs to. A moment and
     the record page both keep the view they were opened from in the address, so the view
     alone cannot tell a long ledger from the short page raised over it — and the scroll
     the ledger was left at is not a position that means anything on either. */
  const pageKey = () =>
    view + (pad ? "/record" : dosing ? "/dose" : detail ? "/detail" : "");
  let drawnView = null;
  /* Rendering replaces the scroller, so its position has to be carried across by hand.
     Without this, anything that redraws — opening the drawer, ticking a dose, changing a
     setting — silently returns the ledger to the top, and the day spy then reports
     whatever is up there rather than the day the user was actually on.

     Kept per page rather than in a single slot, so walking into a reading and backing
     out of it returns the ledger to where it was rather than to the top of the week. */
  const scrollMem = {};

  /* ── the two things that move ──
     The drawer and the sheets are brought over the page rather than laid into it, and
     the open position of both is a class on the phone. Which of the two ways that class
     arrives is the whole of the animation, and the redraw divides them.

     One that is already up is written into the markup, the way dark mode is. It is up
     before it is in the document and there is no instant at which it is not, so nothing
     that happens afterwards can make it travel. That matters more than it looks: the
     redraw is followed by sizeTail, which measures, and a measurement makes the browser
     settle the layout it is being asked about — including the closed position of a sheet
     whose class had not gone on yet. Add the class after that and the sheet drops to the
     bottom of the screen and climbs back up, every time a kind is ticked in the filter.

     One that is arriving is the opposite case and wants exactly that settling, done on
     purpose: built closed, made to be closed, then opened. */
  const RAISED = () => sheet || picking || rtOpen != null || fieldOpen != null || lookOpen;
  const still = matchMedia("(prefers-reduced-motion: reduce)");

  const draw = () => {
    const old = document.querySelector(".body");
    if (old && drawnView) scrollMem[drawnView] = old.scrollTop;
    const key = pageKey();
    /* read off the outgoing phone, so "was it up a moment ago" is answered by what is on
       screen rather than by a flag kept beside the state and liable to disagree with it */
    const was = wall.firstElementChild;
    const held = c => was && was.classList.contains(c);
    const up = [];
    if (drawn) up.push("drawn");
    if (RAISED()) up.push("raised");
    const standing = up.filter(held), coming = up.filter(c => !held(c));

    wall.innerHTML = `<div class="phone${darkMode ? " dark" : ""}${
      boxSide === "right" ? " right-box" : ""}${filtering() ? " noted" : ""}${
      standing.map(c => " " + c).join("")}">${shell()}</div>`;
    drawnView = key;

    sizeTail();
    /* Whether the filter note can say its kinds in words is a question about pixels, and
       pixels are not knowable until the thing is on the screen — it turns on the length of
       the particular names chosen, the frame, and the type. So it is drawn in words, asked
       whether they fit, and dropped to the marks if they do not. Once per draw and in one
       direction: the words are what overflows, and taking them off the screen is what
       stops it, so there is nothing here that can settle into a loop. */
    const ft = document.querySelector(".ftext");
    if (ft && ft.scrollWidth > ft.clientWidth) ft.classList.add("tight");

    const body = document.querySelector(".body");
    if (body && scrollMem[key]) body.scrollTop = scrollMem[key];
    watchTimeline();

    if (coming.length){
      const ph = wall.firstElementChild;
      /* the closed position has to be something the browser has actually worked out
         before the open class lands on top of it, or it folds the two into one and there
         is no distance left to cover */
      void ph.offsetWidth;
      coming.forEach(c => ph.classList.add(c));
    }
  };

  /* Going the other way the trouble is the reverse: by the time the state says closed,
     a redraw has already thrown away the element that should be sliding out. So the class
     comes off what is still standing, and whatever was going to happen next — a redraw, a
     page — waits until it has gone. Called with the class the phone wears while the thing
     is up and the element that does the travelling. */
  const LEAVE = 340;              /* has to outlast the slowest of the two transitions */
  function leave(cls, sel, then){
    const ph = wall.firstElementChild;
    const el = ph && ph.querySelector(sel);
    /* nothing on screen to play out, or nobody who wants to watch it */
    if (!ph || !el || !ph.classList.contains(cls) || still.matches) return then();
    if (ph.classList.contains("leaving")) return;   /* already on its way; one tap is enough */
    ph.classList.add("leaving");
    ph.classList.remove(cls);
    let armed = true;
    const done = ev => {
      if (ev && ev.target !== el) return;           /* not the sheet, something inside it */
      if (!armed) return;
      armed = false;
      then();
    };
    el.addEventListener("transitionend", done);
    setTimeout(done, LEAVE);                        /* in case the move never runs at all */
  }
  const shutDrawer = then => leave("drawn", ".drawer", then);
  const shutSheet = then => leave("raised", ".logsheet", then);

  wall.addEventListener("click", e => {
    const openEvt = e.target.closest("[data-open]");
    if (openEvt){
      const [d, i] = openEvt.dataset.open.split(":").map(Number);
      return go(pathOf(view, { d, i }));
    }
    if (e.target.closest(".js-back")){
      /* backing out of edit mode abandons it; backing out of the page closes it */
      return up(editing ? pathOf(view, detail) : view);
    }

    /* the cabinet names a medicine rather than one of its doses */
    const med = e.target.closest("[data-med]");
    if (med) return go(pathOf(view, { name:med.dataset.med }));

    if (e.target.closest(".js-newmed")){
      /* A new medicine opens straight into the page that changes an existing one. The
         chips there already set every field there is, so there is no second form to
         build and nothing new to learn — only the name is waiting to be typed, so the
         caret is put in it and the stand-in name selected for typing over. */
      let n = "New medicine", k = 2;
      while (DRUGS[n]) n = `New medicine ${k++}`;
      /* no `when`: the hour is the one direction a stand-in cannot guess, so it is left
         for the user to state and the chip offers to take it */
      DRUGS[n] = { qty:"1", dose:"500 mg", form:"tablet", freq:"once a day",
                   every:EVERY_DAY, supply:"28 left" };
      SHAPE_OF[n] = "grey";
      go(pathOf(view, { name:n }, true));
      const input = document.querySelector(".js-dname");
      if (input){ input.focus(); input.select(); }
      return;
    }

    if (e.target.closest(".js-newrt")){
      /* A new occasion opens straight into the sheet that edits one, with the stand-in
         name selected for typing over — the same move the cabinet makes for a new
         medicine. Midday because that is the one gap the four it joins leave. */
      let n = 1, id;
      do { id = "rt" + n++; } while (routineById(id));
      ROUTINES.push({ id, name:"New routine", at:12*60 });
      rtOpen = id;
      draw();
      /* Without preventScroll the caret is put in a field that is at this instant still
         below the bottom of the screen, and the browser goes after it — dragging the
         whole frame up by however far the sheet has left to travel, and dropping it back
         when the sheet lands. The field is coming to the caret; the caret should wait. */
      const input = document.querySelector(".js-rt-name");
      if (input){ input.focus({ preventScroll:true }); input.select(); }
      return;
    }

    /* a row does one thing: raise the sheet on what it names */
    const rtRow = e.target.closest("[data-rt-open]");
    if (rtRow){ rtOpen = rtRow.dataset.rtOpen; return draw(); }
    if (e.target.closest(".js-rt-shut")) return shutSheet(() => { rtOpen = null; draw(); });

    const rtDrop = e.target.closest(".js-rt-drop");
    if (rtDrop){
      const id = rtDrop.dataset.rt;
      /* The sheet goes first and the register is rewritten behind it, so the row leaving
         the list is not something that happens under a sheet nobody can see past. */
      return shutSheet(() => {
        /* The doses stay where they are. Losing the occasion should not lose what was
           being taken at it, so each one is left holding the hour the routine last gave
           it — frozen before the routine goes, or it would have nothing to be read from. */
        DAYS.forEach((d, di) => d.events.forEach(x => {
          if (x.rt !== id) return;
          x.at = atOf(di, x);
          delete x.rt;
        }));
        ROUTINES = ROUTINES.filter(r => r.id !== id);
        rtOpen = null;
        draw();
      });
    }

    if (e.target.closest(".js-stop")){
      /* Stopping clears what is still to come and keeps what already happened: the
         doses taken are a record rather than a plan, and dropping them would make the
         history lie about a week that did happen. */
      const name = detailEvent().name;
      DAYS.forEach(d => { d.events = d.events.filter(x => x.name !== name || x.logged); });
      delete DRUGS[name];
      /* the page it was on is gone, so it is replaced rather than left to go back to */
      return go("medicines", true);
    }

    if (e.target.closest(".js-edit")) return go(pathOf(view, detail, true));

    /* ── how it looks ── */
    if (e.target.closest(".js-look")){
      lookOpen = true; lookPiece = "cap";
      draw(); revealLook();
      return;
    }
    if (e.target.closest(".js-lshut")) return shutSheet(() => { lookOpen = false; draw(); });
    const lf = e.target.closest("[data-lform]");
    const li = e.target.closest("[data-link]");
    const lp = e.target.closest("[data-lpiece]");
    if (lf || li || lp){
      const name = detailEvent().name, L = lookOf(SHAPE_OF[name]);
      if (lf) L.form = lf.dataset.lform;
      if (lp) lookPiece = lp.dataset.lpiece;
      if (li){
        if (lookPiece === "body" && FORM[L.form].twoTone) L.ink2 = li.dataset.link;
        else L.ink = li.dataset.link;
      }
      /* a capsule always has a body, and it starts chalk; a form with one piece
         cannot be pointing at its second */
      if (FORM[L.form].twoTone){ if (!L.ink2) L.ink2 = "chalk"; }
      else lookPiece = "cap";
      return setLook(name, L);
    }

    if (e.target.closest(".js-save")){
      const e0 = detailEvent();
      const was = e0.name, now = editName.trim() || was;
      if (now !== was){
        /* the name lives on every event that uses it, so renaming has to reach them all */
        DAYS.forEach(d => d.events.forEach(x => { if (x.name === was) x.name = now; }));
        DRUGS[now] = DRUGS[was];
        delete DRUGS[was];
        /* the cabinet and the record sheet both look a shape up by name, so that has to
           follow the rename too or a renamed medicine loses its mark */
        SHAPE_OF[now] = SHAPE_OF[was];
        delete SHAPE_OF[was];
        /* opened from the cabinet, the page is held by name — which the rename has
           just made stale */
        if (detail.name) detail.name = now;
        /* and so has the address of the page under this one — the edit is swapped
           for the renamed page instead of going back to a name that no longer exists */
        editing = false;
        return go(pathOf(view, detail), true);
      }
      return up(pathOf(view, detail));
    }

    /* A chip raises the sheet on its field. It used to set the field itself, stepping one
       along the list of answers each time it was touched — which meant the only way to
       see what a field could say was to tap through it, the only way back past an answer
       was all the way round, and a field with four answers took three taps to undo one. */
    const field = e.target.closest("[data-field]");
    if (field){
      const f = fieldOpen = field.dataset.field;
      /* A written answer has no chip among the offered ones, so the state that shows it
         is the one the sheet opens in — otherwise a medicine on 750 mg raises a sheet
         with nothing on it that is true, and finding out what it is on costs a tap.
         Asked of each answer rather than of the whole field, since a field holding
         several holds them as one string and that string is never one of the offered
         ones — a medicine at breakfast and lunch would otherwise open on the clock.

         Asked of the group the way in belongs to, not of the field: a medicine on a
         written span should open its boxes, and the counts beside them have nothing to
         do with it. And `base` counts as offered, the same as it does when the chips
         are drawn — every day is what the way in is dashed over, not what it holds.

         Where there are two ways in it is also which: a medicine kept by occasions
         opens on the occasions, one kept by the clock opens on the clock. */
      const spec = EDIT_FIELDS[f], drug = DRUGS[detailEvent().name] || {};
      const groups = spec.groups || [{ ...spec, key:f }];
      const held = waysOf(f).find(w =>
        wayHolds(w, drug, groups.find(g => g.key === w.key) || groups[0]));
      custOpen = held ? held.id : null;
      return draw();
    }

    /* The chips on a sheet that are not answers. They turn the sheet into whatever is
       behind them — and where that is something already holding a value, taking the way
       in is also the choice of that value, because arriving at a filled-in box and
       leaving it filled in is an answer whether or not a key was pressed. */
    const intoWay = e.target.closest("[data-cust]");
    const toBoxes = !!intoWay;
    if (toBoxes || e.target.closest(".js-cust-back")){
      if (toBoxes && fieldOpen){
        const drug = DRUGS[detailEvent().name];
        const way = waysOf(fieldOpen).find(w => w.id === intoWay.dataset.cust);
        /* Reaching for Time on a medicine kept by its occasions is asking for hours,
           and the app knows what hours a twice-a-day medicine most likely wants. They
           are written rather than shown greyed: a placeholder is a suggestion the user
           then has to accept somehow, and these are the answer until somebody says
           otherwise. */
        if (drug && way && way.kind === "clock")
          spreadTimes(drug, timesWanted(drug));
        /* Reaching for a which-days answer is choosing to answer that way rather than
           by count, and the two are exclusive — so the count goes back to one, the way
           which-days goes back to every day when a count is taken. Which is what makes
           the boxes honest at the value they arrive holding: one day is every day, and
           a medicine on every day taken once is "once a day". Without this the chip
           went on saying "twice a day" while the sheet had plainly been asked for
           something else, and taking the way in and leaving it alone did nothing at
           all. The hours follow the count down, as they do wherever the count is set.

           Only on the way in from somewhere else. A medicine already answering this
           way reaches its boxes by the sheet opening on them, but it can also reach
           them a second time through Back and the lit chip — and that is a return, not
           a choice, so it must not throw the answer away and start the count over.
           Which is also why the two ways are told apart here: coming to the weekdays
           from a span is a change of kind and starts the week empty, where coming to
           them from the weekdays is just looking at them again. */
        const onWay = way && way.key === "every" &&
          (way.id === "custom" ? isInterval(drug && drug.every) : isDays(drug && drug.every));
        if (drug && way && way.key === "every" && !onWay){
          /* neither as-needed nor a set of days is a span, so the boxes could not read
             them — and a week nobody has ticked yet holds nothing at all */
          if (way.id === "custom") drug.every = EVERY_DAY; else delete drug.every;
          drug.asNeeded = false;
          drug.freq = TIMES_A_DAY[0];
          fitTimes(drug);
        }
      }
      custOpen = toBoxes ? intoWay.dataset.cust : null;
      draw();
      /* the caret waits for the box rather than the frame chasing the caret — the same
         reason the routines page asks for preventScroll */
      const box = toBoxes && document.querySelector(".js-cust-n, .js-cust-a, .js-cust-h");
      if (box){ box.focus({ preventScroll:true }); box.select(); }
      return;
    }

    /* ── the hours a medicine is kept at, added to and taken from ──
       Both of these write the frequency, because the frequency is the count of them.
       Both redraw rather than painting in place: the number of rules on the sheet has
       changed and so has a chip on the page behind it, and the caret has nowhere it
       needs to stay — it goes to the new rule when there is one. */
    if (e.target.closest("[data-add-time]")){
      const drug = DRUGS[detailEvent().name];
      drug.freq = TIMES_A_DAY[Math.min(timesWanted(drug), TIMES_A_DAY.length - 1)];
      drug.asNeeded = false;
      /* Hours that are still a spread re-spread to fit the new count, from wherever
         they started: adding a third to 08:00 and 20:00 gives 08:00, 14:00, 20:00, and
         adding a second to a lone 07:15 gives 07:15 and 19:15. Hours that disagree with
         a spread are a decision — they are left alone and the new rule comes up empty,
         because rearranging them would be overwriting an answer with a guess. */
      spreadTimes(drug, timesWanted(drug));
      draw();
      const added = [...document.querySelectorAll(".ocust .js-cust-h")].pop();
      if (added) added.focus({ preventScroll:true });
      return;
    }

    const dropTime = e.target.closest("[data-drop-time]");
    if (dropTime){
      const drug = DRUGS[detailEvent().name];
      /* Both read before the splice: whether these hours are a spread, and the hour
         that spread started from. Afterwards the first of them may be the one that was
         just removed. */
      const lay = spreadable(drug), from = anchorOf(drug);
      /* Read off the rules rather than out of the register, because the two do not
         index alike: an hour left blank is on the screen and not in the register, so
         the third rule down is not reliably the third time stored. */
      const hs = [...document.querySelectorAll(".ocust .js-cust-h")];
      const mn = [...document.querySelectorAll(".ocust .js-cust-m")];
      const times = hs.map((h, k) => joinClock(
        h.value.replace(/\D/g, ""), mn[k] ? mn[k].value.replace(/\D/g, "") : ""));
      times.splice(+dropTime.dataset.dropTime, 1);
      drug.when = joinTimes(times);
      /* Down to one hour is a once-a-day medicine, and down to no hours at all is a
         medicine with nowhere to be — so the when field goes with the last of them and
         the chip returns to offering to set one. */
      if (!drug.when) delete drug.when;
      drug.freq = TIMES_A_DAY[Math.max(0, timesWanted(drug) - 2)];
      /* A spread closes the gap rather than leaving one, and closes it from the hour it
         began at: which of three evenly spread doses was dropped cannot matter, since
         all three were the same answer, but where the day starts very much does. */
      if (lay && drug.when) drug.when = joinTimes(evenTimes(timesWanted(drug), from));
      return draw();
    }

    /* The unit belongs to the figure above it rather than being an answer of its own, so
       picking one does not put the sheet away the way picking an answer does — it is half
       of something still being written. Moved by hand for the reason the typing is: the
       box above it is holding a caret that a redraw would take. */
    const unit = e.target.closest("[data-unit]");
    if (unit && fieldOpen){
      document.querySelectorAll(".ounits .ochip").forEach(u => {
        const on = u === unit;
        u.classList.toggle("on", on);
        u.setAttribute("aria-pressed", String(on));
      });
      return writeCustom();
    }

    const opt = e.target.closest("[data-opt]");
    if (opt && fieldOpen){
      const drug = DRUGS[detailEvent().name], spec = EDIT_FIELDS[fieldOpen];
      /* Which register key the chip answers for, which is the field itself on a sheet
         asking one question and the band's own key on the sheet asking two. And which
         set of rules it answers under: a chip inside an opened way in belongs to that
         way, not to the band the way in was standing in. */
      const f = opt.dataset.key || fieldOpen;
      const inWay = waysOf(fieldOpen).find(w => w.id === custOpen);
      const group = inWay || (spec.groups || []).find(g => g.key === f) || spec;

      /* A field that can hold several answers ticks rather than sets, and the length of
         what is ticked is the frequency — the same rule the clock rules follow, because
         it is the same fact being counted. The sheet stays up; Done is the way out. */
      if (group.multi && opt.dataset.opt){
        const answers = optsOf(group);
        /* Only the answers of the same kind are carried over. Reaching for an occasion
           on a medicine kept by the clock is starting the list again, not adding a fifth
           thing to four hours. */
        const kept = listOf(drug[f]).filter(x => answers.includes(x));
        const at = kept.indexOf(opt.dataset.opt);
        if (at >= 0) kept.splice(at, 1); else kept.push(opt.dataset.opt);
        if (kept.length) drug[f] = kept.join(", "); else delete drug[f];
        if (f === "when")
          drug.freq = TIMES_A_DAY[Math.max(0, Math.min(kept.length, TIMES_A_DAY.length) - 1)];
        return draw();
      }

      /* the empty one is the chip that takes the instruction away, and an optional field
         with nothing set carries no key at all rather than a key holding nothing */
      if (opt.dataset.opt) drug[f] = opt.dataset.opt; else delete drug[f];

      /* "As needed" is a schedule in the directions and a flag everywhere else — the
         cabinet groups by it and the record sheet offers only what it marks. Setting
         the one has to set the other, or the two quietly disagree. And a thing taken
         when it is wanted is taken neither a set number of times nor at a set hour, so
         the count and the hours go with it rather than sitting in the register saying
         something about a medicine that no longer has anything to say about them. */
      if (f === "every"){
        drug.asNeeded = drug.every === AS_NEEDED;
        if (drug.asNeeded){ delete drug.when; delete drug.freq; }
      }
      /* A count is an answer about every day, so taking one puts the medicine back on
         every day — the span and the count are the two answers to this sheet's one
         question and only one of them can be in force. Which is also what makes the
         counts the way back from a span or from as-needed: they stay on the sheet in
         both cases, unlit, and tapping one is the whole of the return. Hiding them
         would have left that route buried in the boxes behind the way in.

         Only here. The when sheet writes the count too, by adding and dropping clock
         rules, and a medicine on a span that gains an hour is still on that span. */
      if (f === "freq"){
        drug.every = EVERY_DAY;
        drug.asNeeded = false;
      }
      /* Setting "three times a day" here and adding a third rule in the when sheet are
         the same act and have to land in the same place. */
      if (f === "freq") fitTimes(drug);

      /* Shut before the redraw, and the row repainted by hand in between — see
         paintChip. A field whose chips write more than one key repaints the whole row:
         the key that changed is not the chip that shows it, and the hours may have
         just left the row or come back to it. */
      fieldOpen = null; custOpen = null;
      if (spec.groups) paintDirections(drug); else paintChip(f, drug);
      return shutSheet(draw);
    }
    if (e.target.closest(".js-fshut"))
      return shutSheet(() => { fieldOpen = null; custOpen = null; draw(); });

    if (e.target.closest(".js-sheet")){
      /* Opened fresh, on now, and folded. The sheet no longer asks when — reaching for
         the record button means recording something that has just happened, and the one
         time in ten that it did not, the page it hands over to has the clock on it. So
         the hour is taken from the clock rather than from wherever it was last left:
         wound back a day to file something forgotten, or lifted off the entry a record
         page was filling in. */
      sheet = true;
      logDay = NOW.day; logAt = NOW.at;
      return draw();
    }
    if (e.target.closest(".js-shut")) return shutSheet(() => { sheet = false; draw(); });
    if (e.target.closest("[data-more-meds]")) return shutSheet(() => go(view + "/dose"));
    /* Out of a page raised over a view, the way the detail page goes out of edit:
       nothing on it was committed, so leaving abandons it. */
    if (e.target.closest(".js-leave")) return up(view);

    /* The dose page files in one tap, the way the sheet does — the dose is a standing
       fact, so naming the medicine is the whole of it. The page is spent once it has
       been used, so it is replaced rather than left for back to return to. */
    const pick = e.target.closest("[data-dose]");
    if (pick){
      const name = pick.dataset.dose, at = logMinutes();
      const ev = { name, at, shape:SHAPE_OF[name] || "grey", logged:fmt(at) };
      DAYS[logDay].events.push(ev);
      letThrough(ev);
      go(view, true);
      return reveal();
    }

    if (e.target.closest("[data-log-day]")){
      /* today, then backwards — recording something you forgot is the common case */
      logDay = logDay === 0 ? NOW.day : logDay - 1;
      return draw();
    }

    const item = e.target.closest("[data-log-item]");
    if (item){
      const name = item.dataset.logItem;
      /* A medicine is recorded by being named: the dose is a standing fact, so the tap
         is the whole of it. A reading is a figure, and there is nothing to file until
         the figure has been asked for — so the sheet hands over to the page that asks. */
      if (READINGS[name] || !DRUGS[name])
        return shutSheet(() => go(recordPath(view, name, null)));
      const at = logMinutes();
      const ev = { name, at, shape:SHAPE_OF[name] || "grey", logged:fmt(at) };
      DAYS[logDay].events.push(ev);
      letThrough(ev);
      /* filed at the tap, shown once the sheet is out of the way of it */
      return shutSheet(() => { sheet = false; draw(); reveal(); });
    }

    /* ── on the record page ── */
    /* Round the options and stop — these are what the test found, and there is no
       "none of them" to cycle back out to the way an optional field has. */
    if (pad && e.target.closest("[data-outcome-next]")){
      const opts = (READINGS[pad.name] || {}).outcomes || [];
      if (!opts.length) return;
      padVals.out = opts[(opts.indexOf(padVals.out) + 1) % opts.length];
      return draw();
    }

    if (pad && e.target.closest(".js-pad-save")){
      const value = padValue();
      if (!value) return;
      const name = pad.name, at = logMinutes(), note = (padVals.note || "").trim();
      /* Filling in an entry the day already holds writes into it rather than beside it —
         two blood pressures at seven in the evening, one of them blank, is not what was
         meant by recording the one that was taken. Moved to another day it has to leave
         the one it was on, since an entry cannot be in two places. */
      if (padFill && padFill.d === logDay){
        const ev = DAYS[logDay].events[padFill.i];
        ev.at = at; ev.value = value; ev.logged = fmt(at);
        letThrough(ev);
      } else {
        if (padFill) DAYS[padFill.d].events.splice(padFill.i, 1);
        const ev = { name, at, shape:SHAPE_OF[name] || "grey", value, logged:fmt(at) };
        DAYS[logDay].events.push(ev);
        letThrough(ev);
      }
      /* A note is its own kind of entry — the ledger already holds one, and the two land
         at the same minute, so the band reads as the reading with the remark beneath it
         rather than as a figure with a sentence crammed into it. And being its own kind,
         it is its own thing for the filter to be holding back, so it is let through on
         its own account rather than on the reading's. */
      if (note){
        const n = { name:note, at, shape:"note", kind:"note" };
        DAYS[logDay].events.push(n);
        letThrough(n);
      }
      /* The page it was filled in on is spent, so it is replaced rather than left behind
         for back to return a form to that has already been committed. */
      clearPad();
      go(view, true);
      return reveal();
    }

    if (e.target.closest(".js-menu")){ drawn = true; return draw(); }
    if (e.target.closest(".js-cal")){ calOpen = !calOpen; return draw(); }
    /* Raising the sheet changes nothing in the scroll under it, so it is a plain redraw
       — unlike a pick, which rewrites the ledger and has to put it back over its day. */
    if (e.target.closest(".js-filter")){
      if (picking) return shutSheet(() => { picking = false; draw(); });
      picking = true; return draw();
    }
    /* Done and the scrim are the same act — the sheet has nothing held back, so putting
       it away is the whole of what either of them does. */
    if (e.target.closest(".js-kshut")) return shutSheet(() => { picking = false; draw(); });

    /* The sheet stays up on a tap. Picking what to see is rarely one pick, and a sheet
       that put itself away after each one would have to be raised again to make the
       next — so it holds still and the ledger redraws behind it. */
    const kind = e.target.closest("[data-kind]");
    if (kind){
      const k = kind.dataset.kind;
      if (kindsOn.has(k)) kindsOn.delete(k); else kindsOn.add(k);
      return refilter();
    }
    /* Two controls, one act, one word for it: Clear in the sheet, and Clear on the note
       the page is left with. It leaves the sheet up — undoing a choice is the start of
       making a different one, not the end of being in here. */
    if (e.target.closest("[data-kind-all]")){ kindsOn.clear(); return refilter(); }
    if (e.target.closest("[data-open-future]")){ futureOpen = true; return draw(); }
    if (e.target.closest("[data-fold-future]")){ futureOpen = false; return draw(); }

    /* One tap means "take me to this day", which the two views answer differently:
       the day view opens it, the ledger scrolls to where it begins. */
    const jump = e.target.closest("[data-jump]");
    if (jump){
      const di = +jump.dataset.jump;
      /* asking for a day that is currently behind the boundary is asking to cross it */
      if (di > NOW.day && futureMode === "edge") futureOpen = true;
      open = di; calOpen = false; draw();
      if (view === "timeline") scrollTimelineTo(di, true);
      return;
    }

    /* "Now" means two different things: in the day view it is a day, and in the ledger
       it is a place on a long scroll. Same button, same intent, different mechanism. */
    if (e.target.closest(".js-now")){
      if (view === "day"){ open = NOW.day; return draw(); }
      /* through the same helper the calendar and the view switch use, so the title is
         renamed at once rather than waiting for the smooth scroll to fire its events */
      scrollTimelineTo(NOW.day, true);
      return;
    }
    if (e.target.closest(".js-close")) return shutDrawer(() => { drawn = false; draw(); });

    /* The drawer is seen out before the destination arrives. It has to be that way round
       — the page it is over is rebuilt wholesale, so the two cannot happen at once — and
       it reads as the tap being taken rather than as a wait. */
    const dest = e.target.closest("[data-view]");
    if (dest) return shutDrawer(() => go(dest.dataset.view));

    const day = e.target.closest("[data-day]");
    if (day){ open = +day.dataset.day; return draw(); }

    if (e.target.closest("[data-expand]")){ loggedOpen = true; return draw(); }
    if (e.target.closest("[data-collapse]")){ loggedOpen = false; return draw(); }

    const all = e.target.closest("[data-logall]");
    if (all){
      const [d, list] = all.dataset.logall.split(":");
      const idx = list.split(",").map(Number);
      /* A reading ticked off with no figure in it has recorded nothing: the row would
         say it happened and the history would carry a blank where the number goes. So a
         moment that is one reading on its own raises the pad instead, and the tick
         commits once there is something to commit. A moment of several is taken at its
         word — that is a round of doses, and the box means what it always meant. */
      if (idx.length === 1){
        const ev = DAYS[+d].events[idx[0]];
        if (needsFigure(ev)) return go(recordPath(view, ev.name, { d:+d, i:idx[0] }));
      }
      idx.forEach(i => DAYS[+d].events[i].logged = fmt(NOW.at));
      return draw();
    }
    const undoAll = e.target.closest("[data-unall]");
    if (undoAll){
      const [d, list] = undoAll.dataset.unall.split(":");
      list.split(",").forEach(i => DAYS[+d].events[+i].logged = null);
      return draw();
    }

    const log = e.target.closest("[data-log]");
    if (log){
      const [d,i] = log.dataset.log.split(":").map(Number);
      if (needsFigure(DAYS[d].events[i]))
        return go(recordPath(view, DAYS[d].events[i].name, { d, i }));
      DAYS[d].events[i].logged = fmt(NOW.at);
      return draw();
    }
    const un = e.target.closest("[data-un]");
    if (un){
      const [d,i] = un.dataset.un.split(":").map(Number);
      DAYS[d].events[i].logged = null;
      return draw();
    }
  });

  /* No prototype controls on this build — the settings keep the values they were left
     at, and the appearance follows the device instead of a picker.

     And it has to keep following it. Read once at load, a theme switch left the app
     half turned: the page behind it flipped, because that is a media query and the
     browser owns it, but nothing inside the phone did. Its palette hangs off a class
     the render puts on, and the time-of-day marks and the clock ink are mixed in
     script from darkMode — so bark would sit around cream paper with every sun and
     moon still painted for the other scheme. Redrawing is enough to correct all
     three, and draw() carries the scroll position across. */
  const sysDark = window.matchMedia
    ? window.matchMedia("(prefers-color-scheme: dark)")
    : null;
  if (sysDark){
    darkMode = sysDark.matches;
    const follow = () => { darkMode = sysDark.matches; draw(); };
    /* addListener is the superseded spelling, and still the only one some older
       WebKit builds have */
    if (sysDark.addEventListener) sysDark.addEventListener("change", follow);
    else if (sysDark.addListener) sysDark.addListener(follow);
  }

  route();

  /* Open on today rather than at the start of the week: the ledger holds several days,
     and the one that matters on load is the one you are in. Repeated once the fonts have
     settled, since the run-out and the position are both measured and the metrics shift
     when the real typeface arrives. */
  scrollTimelineTo(NOW.day, false);
  if (document.fonts && document.fonts.ready)
    document.fonts.ready.then(() => {
      sizeTail();
      scrollTimelineTo(NOW.day, false);
    });
})();
</script>
</body>
</html>
