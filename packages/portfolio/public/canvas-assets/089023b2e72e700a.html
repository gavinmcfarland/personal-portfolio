<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Health</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  /* ═══════════ Regimen ═══════════
     A second brand over the same product. Where the first is a clinical instrument —
     cool white, Material sans, rounded cards floating on grey — this one is an
     apothecary's ledger: warm paper, ink, a single botanical green, an editorial serif
     for anything that names a thing, and a monospace for anything that counts one.

     The structural idea is the rule rather than the card. Nothing floats. A moment is a
     band of paper separated from the next by a hairline, the way a ruled book separates
     entries, and the day is an editorial heading set in the margin above its entries.
     Corners are 2–3px, not 12px, and there are no shadows anywhere except the one sheet
     that genuinely sits above the page. */

  :root{
    --ui:"IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --display:"Spectral", Georgia, "Times New Roman", serif;
    --fig:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  /* ── the spacing scale ──
     Carried over from the first brand, because a scale is not a brand: every padding,
     margin, gap, offset and box size is a multiple of 4. 1px is a hairline, and 2px is
     an optical nudge used only where something has to sit on a baseline it would
     otherwise miss. Type is deliberately not on this scale. */

  /* ── motion ──
     Hover is feedback, not animation. It says "this is the thing under your pointer",
     and that has to be true the instant it is true — faded in over .15s it reads as lag
     on every row you sweep past. So nothing in here transitions on :hover.

     What still transitions does so because the movement is the point: a change of state
     the user asked for, which they should be able to watch happen. That is the drawer
     sliding in, the scrim coming up under it, and the title's chevron turning over when
     the month drops. Three, and no more. */
  *{box-sizing:border-box}
  /* A definite height all the way down, so the prototype can fill whatever it is given.
     The chain matters: .body inside the phone scrolls on height:100%, and a percentage
     height resolves to auto unless every ancestor has a real height to resolve against
     — min-height is not one. */
  html,body{margin:0; padding:0; height:100%}
  body{
    background:#DCD5C4; font-family:var(--ui); color:#241F17;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-color-scheme: dark){ body{background:#0B0906} }

  /* Fills its container, whatever that is: no frame, no fixed size, no cap. The page is
     the page — it has no edge of its own to show, so the hairline and the radius that
     used to sit it in a margin are gone. */
  .phone{
    position:relative; width:100%; height:100%;
    overflow:hidden;
    /* --card-past is a settled band: a shade off the live paper and no more. The distance
       is the whole of it, and it has a ceiling — far enough down and a run of finished days
       stops reading as bands and becomes a block, at which point every date heading between
       them shows through as a lighter strip. It sat well past that once. This is as deep as
       it goes while a week still reads as one page with some of it gone quiet. */
    --tl:#FAF6EC; --card-bg:#FFFCF4; --card-past:#F5F0E4;
    --edge:rgba(38,32,22,.20); --edge-soft:rgba(38,32,22,.10);
    --tx:#241F17; --tx2:#5E5648; --tx3:#8E8475;
    --bar:#FAF6EC; --bar-tx:#241F17; --bar-ic:#5E5648; --bar-edge:rgba(38,32,22,.16);
    --bar-hover:rgba(38,32,22,.06);
    --act:#2F5D43; --act-soft:rgba(47,93,67,.40); --act-hover:rgba(47,93,67,.08);
    --act-fill:rgba(47,93,67,.12);
    --done-bg:#DBE4D2; --done-fg:#3A6942;
    --warn:#9A4B1B; --warn-soft:rgba(154,75,27,.60); --warn-fill:rgba(154,75,27,.12);
    --mark:#2F5D43;
    --bad:#8C2F24;
    --ink-wash:rgba(38,32,22,.04);
    /* The record button floats over the foot of the screen, so no view may end flush
       with its own last row. This is what it takes to clear it: the button's height and
       its inset from the bottom, plus the same inset again as air above it. Every
       scrolling view leaves this much, and the ledger's run-out never falls below it. */
    --fab-clear:96px;
    color:var(--tx); background:var(--tl);
  }
  /* A warm dark, not a cool one — the paper goes to bark rather than to navy, which is
     the single clearest way the two brands differ after hours. */
  .phone.dark{
    /* The same move as the day theme, one step deeper than it was. After hours the whole
       range is so tight that a single unit per channel is the smallest step there is — so
       this theme cannot follow the day one by proportion, only by direction. */
    --tl:#15120C; --card-bg:#1C1812; --card-past:#191510;
    --edge:rgba(240,232,214,.20); --edge-soft:rgba(240,232,214,.09);
    --tx:#F0E8D6; --tx2:#B3A994; --tx3:#8A8171;
    --bar:#15120C; --bar-tx:#F0E8D6; --bar-ic:#B3A994; --bar-edge:rgba(240,232,214,.16);
    --bar-hover:rgba(240,232,214,.07);
    --act:#8FC49C; --act-soft:rgba(143,196,156,.42); --act-hover:rgba(143,196,156,.11);
    --act-fill:rgba(143,196,156,.15);
    --done-bg:rgba(143,196,156,.17); --done-fg:#A8D4B2;
    --warn:#DFA06A; --warn-soft:rgba(223,160,106,.62); --warn-fill:rgba(223,160,106,.13);
    --mark:#8FC49C;
    --bad:#E08B7E;
    --ink-wash:rgba(240,232,214,.03);
  }

  .body{height:100%; overflow-y:auto; overscroll-behavior:contain; scrollbar-width:none; width:100%}
  .body::-webkit-scrollbar{display:none}

  /* ── the masthead ──
     The bar names the thing in the serif, which is where this brand does all its
     talking. A rule under it rather than a shadow. */
  .appbar{
    position:sticky; top:0; z-index:6; height:64px; display:flex; align-items:center;
    padding:0 8px 0 4px; background:var(--bar); border-bottom:1px solid var(--bar-edge);
  }
  .appbar h1{
    flex:1; margin:0 0 0 8px; font-family:var(--display);
    font-size:25px; font-weight:500; letter-spacing:-.01em; color:var(--bar-tx);
  }
  .navicon{
    width:48px; height:48px; border-radius:2px; flex:none; padding:0; border:none;
    background:none; color:var(--bar-ic); cursor:pointer; display:grid; place-items:center;
  }
  .navicon:hover{background:var(--bar-hover)}
  .navicon svg{width:24px; height:24px; display:block}
  /* A masthead control that is currently doing something to the page says so, in the
     green — otherwise a filtered ledger and a whole one have the same bar over them. */
  .navicon.on{color:var(--act)}

  /* ── the drawer ──
     Not a Material drawer: no pill, no 16px corner. A squared sheet of the same paper,
     and the destination you are on is marked in the margin with a rule, the way a
     reader marks a page. */
  .scrim{
    position:absolute; inset:0; z-index:14; background:rgba(20,16,10,.46);
    opacity:0; pointer-events:none; transition:opacity .22s ease;
  }
  .phone.drawn .scrim{opacity:1; pointer-events:auto}
  /* A quarter of a second of sliding out is still a quarter of a second in which the page
     underneath is not what the user is pointing at, so the scrim goes on catching taps
     until the drawer has actually gone. */
  .phone.leaving .scrim{pointer-events:auto}
  .drawer{
    position:absolute; top:0; bottom:0; left:0; z-index:15; width:296px;
    background:var(--bar); border-right:1px solid var(--bar-edge);
    transform:translateX(-100%); transition:transform .26s cubic-bezier(.2,.7,.3,1);
    padding:24px 0; display:flex; flex-direction:column;
    border-radius:0;
  }
  .phone.drawn .drawer{transform:none}
  /* the wordmark, set as a wordmark: the serif at a size nothing else on the screen uses */
  .dtitle{
    margin:4px 20px 24px; font-family:var(--display); font-size:30px; font-weight:600;
    letter-spacing:-.02em; color:var(--tx);
  }
  .dsub{
    margin:0 20px 8px; font-family:var(--fig); font-size:10.5px; font-weight:500;
    letter-spacing:.14em; text-transform:uppercase; color:var(--tx3);
  }
  .ditem{
    display:flex; align-items:center; gap:16px; width:100%; text-align:left;
    font-family:var(--display); font-size:17px; font-weight:500; letter-spacing:-.005em;
    color:var(--tx2); background:none; border:none; border-radius:0;
    border-left:2px solid transparent;
    padding:12px 20px; cursor:pointer;
  }
  .ditem:hover{background:var(--ink-wash); color:var(--tx)}
  .ditem svg{width:22px; height:22px; display:block; flex:none}
  .ditem.on{background:var(--act-fill); color:var(--act); border-left-color:var(--act)}
  .ditem.off{opacity:.45; cursor:default}
  .ditem.off:hover{background:none; color:var(--tx2)}
  .dsplit{height:1px; background:var(--edge-soft); margin:16px 20px}

  /* ── the ledger band ──
     The card is gone. A moment is a band of paper the full width of the page, ruled off
     from the one before it. Nothing floats, nothing is rounded, and the run of bands
     reads as a continuous record rather than as a stack of objects. */
  .card{
    margin:0; padding:16px 20px;
    background:var(--card-bg); border:none; border-top:1px solid var(--edge-soft);
    border-radius:0;
  }
  .dayview .card{margin-bottom:0}
  /* A settled band is a shade deeper into the paper. One rule for the whole app: the same
     band means the same thing on the ledger, in the day, and in the fold a finished group
     collapses into, and none of them needs to know which page it is on.

     It is the distance that had to be settled rather than the arrangement. Twice this far
     down, a run of finished days in the ledger stopped reading as bands and started reading
     as a block — and then every date heading between them showed through it as a lighter
     strip, because the ground is a middle tone with the live paper above it and the settled
     paper below. Brought in close the same three tones stop competing: the band is still
     plainly behind, the heading no longer punches a hole in anything, and the week reads as
     one page with some of it gone quiet. See --card-past for the figure.

     The colour going out of the marks says the thing a second way. */
  .card.logged{background:var(--card-past)}
  .card.logged > *{filter:grayscale(1)}
  .rail.done, .whenrow.done{filter:grayscale(1)}
  .cardhead{display:flex; align-items:center; gap:8px; margin:0 0 12px}
  /* Missed, said in the sienna this brand uses for attention, in the figures face so it
     reads as a note in the margin rather than as a label on a button. */
  .latebar{
    display:flex; align-items:center; gap:8px; margin:0 0 12px;
    font-family:var(--fig); font-size:10.5px; font-weight:500;
    letter-spacing:.14em; text-transform:uppercase; color:var(--warn);
  }
  /* The clock gets a slot the size of the time-of-day mark on the line below it — 20px,
     with the same 8px gap after it — so MISSED starts on the same x as the clock
     reading in the card's heading. Without the slot the 14px icon pulled the label 6px
     to the left of everything it sits above, which read as a wobble in the margin.

     The icon keeps its own 14px and is centred in the slot rather than grown to fill
     it: the artwork is drawn for 14 and thickens visibly at 20. */
  .late-ic{
    display:flex; align-items:center; justify-content:center;
    width:20px; height:20px; flex:none;
  }
  .latebar svg{width:14px; height:14px; display:block; flex:none}
  .cardhead .grow{flex:1}
  /* the indent is the mark's own footprint: a 24px box and the 8px gap after it */
  .phone:not(.right-box) .cardhead ~ .entry{padding-left:32px}
  .phone.right-box .cardhead ~ .entry{padding-right:32px}
  .abovewrap .entry, .stack.wide > .card .entry{padding-left:0; padding-right:0}
  .cardhead .phase{width:20px; height:20px; display:block; flex:none}
  /* every figure in the app is monospaced — the clock, the readings, the counts. It is
     the other half of the brand: serif for what a thing is called, mono for what it
     measures. */
  .whentime{
    font-family:var(--fig); font-size:12.5px; font-weight:500;
    letter-spacing:.02em; flex:none;
  }
  .rail .whentime{text-align:center; line-height:1.3}
  .rail .routine{
    margin-left:0; text-align:center; white-space:normal; line-height:1.35;
    font-size:11.5px; flex:none;
  }
  /* The routine names the occasion, in the serif's italic — an aside, the way a printed
     page sets an aside, rather than another label competing with the rows. */
  .routine{
    font-family:var(--display); font-style:italic; font-size:14px; font-weight:500;
    letter-spacing:0; text-transform:none; color:var(--tx2);
    flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    margin-left:4px;
  }
  .cardhead.bare .routine{margin-left:0}
  .entry{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    font-family:inherit; background:none; border:none; padding:0; cursor:pointer;
    border-radius:2px;
  }
  .entry:hover{opacity:.66}
  .entry + .entry{margin-top:12px}
  /* what a thing is called, in the serif */
  .name{
    margin:0; font-family:var(--display); font-size:18px; font-weight:500;
    letter-spacing:-.005em; flex:1; min-width:0; color:var(--tx);
  }
  .val{
    font-family:var(--fig); font-size:13px; font-weight:400; color:var(--tx2);
    white-space:nowrap;
  }
  .gl{width:12px; height:12px; display:inline-block; vertical-align:-2px; margin-left:8px}
  /* A ruled box, not a ring. The ledger ticks a square. */
  .box{
    width:24px; height:24px; border-radius:2px; flex:none; padding:0;
    border:1.5px solid var(--act-soft); background:none; color:transparent;
    display:grid; place-items:center; cursor:pointer;
  }
  .box svg{width:12px; height:12px; display:block}
  .box:hover{background:var(--act-hover); border-color:var(--act); color:var(--act)}
  .box.late{border-color:var(--warn-soft)}
  .box.late:hover{border-color:var(--warn); color:var(--warn)}
  .box.plus{border-color:transparent; background:none; color:var(--act)}
  .box.plus svg{width:16px; height:16px}
  .box.plus:hover{background:var(--act-hover); border-color:transparent}
  .box.plus.late{color:var(--warn)}
  .box.plus.late:hover{background:var(--warn-fill); border-color:transparent}
  .box.on{background:var(--done-bg); border-color:transparent; color:var(--done-fg)}
  .box.mark{border-color:transparent; background:none; cursor:default}

  /* ── the day view ── */
  .titlebtn{
    display:flex; align-items:center; gap:4px; margin:0 0 0 4px; padding:4px 8px 4px 12px;
    font-family:var(--display); font-size:25px; font-weight:500; letter-spacing:-.01em;
    color:var(--bar-tx);
    background:none; border:none; border-radius:2px; cursor:pointer;
  }
  .titlebtn:hover{background:var(--bar-hover)}
  .titlebtn svg{width:20px; height:20px; display:block; color:var(--bar-ic); transition:transform .2s ease}
  .titlebtn[aria-expanded="true"] svg{transform:rotate(180deg)}
  .appbar .grow{flex:1}

  /* the month, as a printed calendar: figures in mono, no filled pills */
  .cal{
    position:sticky; top:64px; z-index:5;
    background:var(--bar); border-bottom:1px solid var(--bar-edge);
    padding:12px 16px 16px;
  }
  .calhead{display:flex; align-items:center; margin:0 0 8px}
  .calmonth{
    flex:1; font-family:var(--display); font-size:17px; font-weight:500;
    letter-spacing:-.005em; padding-left:8px;
  }
  .calnav{display:flex; gap:2px}
  .navicon.sm{width:36px; height:36px}
  .navicon.sm svg{width:20px; height:20px}
  .navicon.sm:first-child svg{transform:rotate(90deg)}
  .navicon.sm:last-child svg{transform:rotate(-90deg)}
  .navicon.sm:disabled{opacity:.3; cursor:default}
  .navicon.sm:disabled:hover{background:none}

  .calgrid{display:grid; grid-template-columns:repeat(7, 1fr); gap:2px}
  .calgrid .dow{
    text-align:center; font-family:var(--fig); font-size:10px; font-weight:500;
    letter-spacing:.1em; color:var(--tx3); padding:2px 0 4px;
  }
  .cell{
    position:relative; display:flex; flex-direction:column; align-items:center; gap:2px;
    font-family:var(--fig); font-size:13px; font-weight:400;
    color:var(--tx); background:none; border:none; border-radius:2px;
    padding:4px 0; cursor:pointer;
  }
  .cell i{width:4px; height:4px; border-radius:0; background:var(--warn); display:block}
  .cell .void{background:none}
  .cell:hover{background:var(--ink-wash)}
  .cell.off{color:var(--tx3); opacity:.4; cursor:default}
  .cell.off:hover{background:none}
  .cell.today{color:var(--act); font-weight:500}
  .cell.today::after{
    content:""; position:absolute; left:50%; bottom:0; width:16px; height:1.5px;
    background:var(--act); transform:translateX(-50%);
  }
  .cell.on{background:var(--tx); color:var(--tl)}
  .cell.on:hover{background:var(--tx)}
  .cell.on.today::after{background:var(--tl)}
  .cell.pad{pointer-events:none}

  /* ── the filter ──
     The kinds are picked in a sheet, raised the way the record button raises one — the
     same paper, the same handle, the same scrim — because the app has no reason to own
     two kinds of sheet. And it is the right object for the job: a sheet is the one thing
     in this brand that genuinely sits above the page, which is what choosing what the
     page shows is. It is brought up, worked, and put away.

     Each row carries its kind's mark, which for four of the five is the same mark that
     kind wears in the ledger — so the sheet reads as a key to the page behind it rather
     than as a list of words about it. The fifth was the thing that kept the marks off
     these rows for as long as it did: a reading has one mark and carries it happily, but
     the medicines are a dozen marks between them and no single one of them is honest for
     the lot. That is answered where it has to be answered, in the drawing — see `meds` up
     in SHAPE — rather than by leaving the column empty.

     The sheet's own rules live below; the note it leaves behind on the page is further
     down still, under .fbar. */
  /* The same 8px overhang the sheet's other list takes, so a row's hover runs wider than
     the text column rather than stopping dead on it, and the same air under the handle —
     this sheet opens straight onto its list the way that one does. */
  .kinds{display:flex; flex-direction:column; margin:8px -8px 0}
  /* A step down from the ledger's own rows, and deliberately. A row on the day is the
     thing itself and is reached for all day long; a row in a sheet is a line in a list
     you have come to read through, five or six at a time, and wants to be read as a
     list rather than as six more things the size of the page behind it. Forty pixels
     is where it still takes a thumb and stops shouting. */
  .krow{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    padding:10px 8px; cursor:pointer;
    background:none; border:none; border-radius:2px; font-family:inherit;
  }
  .krow:hover{background:var(--act-hover)}
  /* The ledger's box comes down with it. Only here: on a day the same square is the
     control you tick a dose with and has to stay the size a thumb expects, where in a
     sheet the whole row is the control and the box is only the mark on it. */
  .krow .box{width:20px; height:20px}
  .krow .box svg{width:11px; height:11px}
  /* The mark stands at the end of the row rather than against the name. The box rules a
     column down the left and the marks rule one down the right, with five names of
     different lengths left to run between them — where a mark set next to its word put a
     third ragged edge in the middle of a row that only has room for two.

     The 20px box is what makes it a column. The glyphs are all drawn at 16px but not all
     drawn to the same width, and centring each one in a box of fixed size lands them on
     the same line however much of their own they fill. The margin .gl carries elsewhere
     goes: it was nudging the mark clear of a word it no longer sits beside, and the box
     does the placing now. */
  .krow .kglyph{
    display:flex; align-items:center; justify-content:center;
    width:20px; height:20px; flex:none;
  }
  .krow .gl{width:16px; height:16px; flex:none; margin:0}
  .kname{
    flex:1; min-width:0; font-family:var(--display); font-size:17px; font-weight:500;
    letter-spacing:-.005em; color:var(--tx);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .kn{font-family:var(--fig); font-size:12.5px; font-weight:400; color:var(--tx2); flex:none}
  /* The checkbox is the one this brand already draws: the ruled square the ledger ticks.
     It is a mark on the row rather than a control of its own — the whole row is the
     control — so it takes its hover from the row and not from itself, and shows its tick
     on the way in, the way every other box here does. */
  .krow .box{pointer-events:none}
  .krow:hover .box{background:var(--act-hover); border-color:var(--act); color:var(--act)}
  /* Ticked, it fills with the green that means in force rather than the sage that means
     settled: a kind being shown is a thing in effect, not a thing done with. The tick
     goes to the paper colour, which is light on the green by day and dark on it after
     hours — one declaration, right in both. */
  .krow.on .box, .krow.on:hover .box{
    background:var(--act); border-color:var(--act); color:var(--tl);
  }
  /* The foot of the sheet: what to do with it, in the order a hand reaches for them.
     The rule runs to the sheet's edges because the foot governs the whole of it rather
     than sitting in the column the rows are in, and the air under the buttons is the
     sheet's own bottom padding rather than any of the foot's.

     Not pinned to the bottom of the scroll the way the record page pins its commit. Five
     kinds stand 400px tall in a sheet allowed 655, so there is no scroll for it to be
     pinned against — and sticky with the negative margin that makes the rule full width
     reads the margin as slack and hauls the foot up over the last row. */
  .kfoot{
    display:flex; align-items:stretch; gap:12px;
    margin:8px -20px 0; padding:12px 20px 0;
    border-top:1px solid var(--edge-soft);
  }
  /* Clear is the quiet one and Done is the stamp, which is the weight each has earned:
     one is the way out of a mistake, the other is the way out of the sheet. */
  /* The interface face rather than the serif, because these two are a pair and a pair
     reads as one when it is set as one: same family, same size, same tracking as the
     stamp beside it, and only the weight apart — 500 against Done's 600, which is the
     difference between dark type on paper and type reversed out of the green. */
  .kclear{
    flex:none; padding:0 16px; cursor:pointer;
    font-family:var(--ui); font-size:15px; font-weight:500; letter-spacing:.01em;
    color:var(--tx2); background:none; border:none; border-radius:2px;
  }
  .kclear:hover{background:var(--ink-wash); color:var(--tx)}
  /* Held rather than hidden when there is nothing to undo: a control that comes and goes
     moves the one beside it, and Done is a thing the thumb should be able to find in the
     same place every time the sheet is up. */
  .kclear:disabled{color:var(--tx3); opacity:.5; cursor:default}
  .kclear:disabled:hover{background:none; color:var(--tx3)}
  /* the record page's commit, in the brand's 2px rather than squared off flush, since
     this one stands in the sheet rather than running edge to edge along its bottom */
  .kdone{
    flex:1; padding:16px; cursor:pointer;
    font-family:var(--ui); font-size:15px; font-weight:600; letter-spacing:.01em;
    color:var(--tl); background:var(--act); border:none; border-radius:2px;
  }
  .kdone:active{transform:translateY(1px)}
  .phone.dark .kdone{color:#15120C}

  /* ── how it looks ──
     The pill follows the name input on the edit page, in a square tile with the live
     chips' tint, sitting on the same rule as the name so the two read as one heading.
     The rest is appearance.html's sheet, on prefixed names because .rail is already the
     ledger's. */
  .dnamerow{display:flex; align-items:center; gap:14px}
  .dnamerow .dnameinput{flex:1; min-width:0}
  .lookchip{
    flex:none; width:52px; height:52px; padding:0; cursor:pointer;
    display:grid; place-items:center;
    background:var(--act-fill); border:1px solid var(--act-soft); border-radius:2px;
  }
  .lookchip:hover{border-color:var(--act)}
  .lookchip .pill{display:block}
  .lsheet{max-height:94%; overflow-x:hidden}
  .lsheet .grab{margin-bottom:4px}
  .lstage{display:grid; place-items:center}
  .lstage .pill{display:block; animation:lsettle .19s cubic-bezier(.2,.7,.3,1)}
  @keyframes lsettle{ from{opacity:.35; transform:translateY(3px) scale(.985)} to{opacity:1; transform:none} }
  .lsaid{
    margin:4px 0; text-align:center; font-family:var(--ui);
    font-size:14.5px; color:var(--tx2);
  }
  .llab{
    display:flex; align-items:center; gap:12px; min-height:26px; margin:24px 0 0;
    font-family:var(--ui); font-size:13.5px; font-weight:600; letter-spacing:-.005em; color:var(--tx);
  }
  .llab .llabt{flex:1}
  .lwells{display:inline-flex; flex:none}
  .lwell{width:28px; height:26px; padding:0; cursor:pointer; border:1px solid var(--edge); background:none}
  .lwell:first-child{border-radius:2px 0 0 2px}
  .lwell:last-child{border-radius:0 2px 2px 0; margin-left:-1px}
  .lwell.on{
    border-color:var(--act); box-shadow:0 0 0 1.5px var(--act);
    border-radius:2px; position:relative; z-index:1;
  }
  .lrail{
    display:flex; gap:8px; margin:10px -20px 0; padding:0 20px;
    overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  .lrail::-webkit-scrollbar{display:none}
  .lswatch{
    flex:0 0 78px; height:78px; display:grid; place-items:center; padding:0; cursor:pointer;
    background:none; border:1px solid var(--edge); border-radius:2px;
  }
  .lswatch:hover{border-color:var(--act-soft); background:var(--act-hover)}
  .lswatch.on{background:var(--act-fill); border-color:var(--act); box-shadow:inset 0 0 0 1px var(--act)}
  .lsheet .kfoot{margin-top:24px}
  @media (prefers-reduced-motion: reduce){ .lstage .pill{animation:none} }

  /* The note, said the way this brand says an aside: the serif's italic, quietly, with
     its control beside it in the figures face — the same pairing a section heading makes. */
  .fbar{
    position:sticky; top:64px; z-index:5; height:fit-content;
    display:flex; align-items:baseline; gap:12px; padding:8px 20px 0;
    background:var(--bar); border-bottom:1px solid var(--bar-edge); padding-left:16px; padding-bottom:8px;
  }
  .ftext{
    flex:1; min-width:0; font-family:var(--display); font-style:italic; font-size:14px;
    font-weight:500; color:var(--tx2);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  /* A mark and the word it belongs to are one unit, so they are wrapped as one — which
     costs nothing today, since the note is already nowrap, and is the right thing the
     day it is not. It does not govern the ellipsis: that clips at the box edge wherever
     the edge falls, and can in principle cut between a mark and its word. Harmless when
     it does — what is left is a mark against an ellipsis, which is already saying the
     sentence is cut short, rather than a mark claiming to be a whole item.

     12px rather than the list's 16: beside 14px type the mark is an aside, and at the
     list's size it would outweigh the words it is set against. */
  .fkind{white-space:nowrap}
  .fbar .gl{width:12px; height:12px; margin:0 4px 0 0; vertical-align:-1.5px}

  /* The note holds the same sentence twice and wears whichever fits — see filterNote, and
     draw() for the measuring. Spoken in words by default, so a note that is never measured
     is a note that reads correctly. */
  .fmarks{display:none; white-space:nowrap}
  /* Taken off the screen rather than hidden: display:none or visibility would take it from
     a reader too, and being the thing still said when the words come off the screen is the
     whole of what it is for. */
  .ftext.tight .fsay{
    position:absolute; width:1px; height:1px; margin:-1px; padding:0;
    overflow:hidden; clip-path:inset(50%); white-space:nowrap; border:0;
  }
  /* Standing in for the words the marks are the sentence rather than an aside in it, so
     they come up to the size they are in the sheet and stand apart from one another
     rather than leaning on the word each no longer has. */
  .ftext.tight .fmarks{display:inline}
  .ftext.tight .gl{width:15px; height:15px; margin-right:5px; vertical-align:-2.5px}
  .fclear{
    flex:none; font-family:var(--fig); font-size:10px; font-weight:500;
    letter-spacing:.12em; text-transform:uppercase; color:var(--act);
    background:none; border:none; padding:0; cursor:pointer;
  }
  .fclear:hover{text-decoration:underline}
  /* Both are sticky, and the one that is about the page comes first — so with the note
     in the slot, the month drops below it rather than landing on top of it. */
  .phone.noted .cal{top:100px}

  /* ── the section heading ──
     Set as a printed subhead: the serif in italic, lower case, with the count in mono
     beside it. The first brand shouts these in letterspaced capitals; this one says
     them quietly. */
  .ghead{
    display:flex; align-items:baseline; gap:8px; margin:24px 20px 8px;
    font-family:var(--display); font-style:italic; font-size:17px; font-weight:500;
    letter-spacing:0; text-transform:none; color:var(--tx2);
  }
  .ghead .n{
    font-family:var(--fig); font-style:normal; font-size:11px; font-weight:400;
    color:var(--tx3);
  }
  .ghead.late{color:var(--warn)}
  .ghead.late .n{color:var(--warn)}
  .ghead .hide{
    margin-left:auto; font-family:var(--fig); font-size:10px; font-weight:500;
    letter-spacing:.12em; text-transform:uppercase; color:var(--act);
    background:none; border:none; padding:0; cursor:pointer;
  }
  .ghead .hide:hover{text-decoration:underline}

  .folded{
    display:flex; align-items:center; gap:12px; text-align:left;
    margin:0; width:100%; padding:16px 20px;
    font-family:inherit; background:var(--card-past);
    border:none; border-top:1px solid var(--edge-soft); border-radius:0;
  }
  .fold-t{
    font-family:var(--display); font-size:17px; font-weight:500; letter-spacing:-.005em;
    color:var(--tx2); flex:none;
  }
  .fold-s{display:flex; align-items:center; gap:8px; flex:1; filter:grayscale(1)}
  .fold-s .gl{margin-left:0}
  .chev{display:grid; place-items:center; color:var(--tx3); flex:none}
  .chev svg{width:16px; height:16px; display:block}

  /* ── the ledger view ── */
  .period{display:grid; grid-template-columns:24% 1fr}
  .rail{display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 4px 0}
  .rail .phase{width:32px; height:32px; display:block}
  .rail .whentime{font-size:12px}

  .period.slim{grid-template-columns:16% 1fr}
  .period.slim .rail{padding-left:2px; padding-right:2px}
  .period.slim .rail .phase{width:28px; height:28px}
  .period.slim .rail .whentime{font-size:11px}
  .card.marked{display:grid; grid-template-columns:auto 1fr; gap:12px; align-items:start}
  .phone.right-box .card.marked{grid-template-columns:1fr auto}
  .phone.right-box .card.marked .ringcol{order:2}
  .card.marked .latebar{grid-column:1 / -1}
  .cardbody{min-width:0}
  .routineline{margin:0 0 8px; display:flex}
  .routineline .routine{margin-left:0}

  .period.split{grid-template-columns:20% 1fr}
  .period.split .rail{padding-top:8px}
  .period.split .rail .phase{width:28px; height:28px}
  .period.solo{grid-template-columns:1fr}
  .whenrow{display:flex; align-items:center; gap:8px; margin:0 20px 8px}
  .stack.wide .whenrow{margin:0 20px 8px}
  .whenrow .phase{width:20px; height:20px; display:block; flex:none}
  .whenrow .grow{flex:1}
  .abovewrap + .abovewrap{margin-top:16px}
  /* the bands run to the edge of the page, so the stack adds no gutter of its own */
  .stack.wide .card{margin:0}
  .stack{padding:0}
  .stack .card{margin:0}
  .stack .card:last-child{margin-bottom:0}
  .cardhead.tag{margin:0 0 12px}
  .whentag{
    display:inline-flex; align-items:center; gap:8px; padding:4px 8px 4px 4px;
    border-radius:2px; background:var(--ink-wash);
  }
  .whentag .phase{width:16px; height:16px; display:block; flex:none}

  /* ── the date heading ──
     The first brand centres the day in a dark pill. Here it is an editorial heading in
     the margin: the serif, left aligned, with a rule under it — which is what makes the
     ledger read as a book of days rather than a feed. */
  .daychip{
    display:flex; justify-content:flex-start; align-items:baseline;
    padding:32px 20px 8px; background:var(--tl);
  }
  /* The date stands on the ground, not on the paper the entries are laid on — which is
     what makes it a heading in the margin rather than another band in the run. */
  .daychip span{
    background:none; color:var(--tx); border-radius:0; padding:0 0 6px;
    font-family:var(--display); font-size:21px; font-weight:600; letter-spacing:-.015em;
    border-bottom:1.5px solid var(--edge);
    flex:1;
  }
  .phone.dark .daychip span{background:none; color:var(--tx)}

  /* Now: a ruled line with a filled square at the margin. Same 24px row as the first
     brand, so the measured scroll positions still hold — an 8px bar centred in it puts
     8px either side.

     On the bands' own paper rather than the page's, so the line reads as a mark ruled
     across the ledger at this hour rather than a gap between two entries. The token and
     not its light-mode value: after hours --card-bg goes to bark, and a literal #FFFCF4
     would leave a cream stripe lying across a dark page. */
  .nowedge{position:relative; height:24px; z-index:3; background:var(--card-bg)}
  .tail{height:0}
  .nowedge .bar{
    position:absolute; left:16px; right:20px; top:8px; height:8px;
    display:flex; align-items:center; gap:8px;
  }
  .nowedge .dot{width:8px; height:8px; border-radius:0; background:var(--mark); flex:none}
  .nowedge .line{flex:1; height:2px; background:var(--mark); border-radius:0}

  /* The boundary onto the days ahead, as a ruled footer rather than an outlined button. */
  .coming{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; margin:0 0 32px; padding:20px;
    cursor:pointer; font-family:inherit;
    background:none; border:none;
    border-top:1px solid var(--edge-soft); border-bottom:1px solid var(--edge-soft);
    border-radius:0;
    color:var(--act);
  }
  .coming:hover{background:var(--act-hover)}
  .coming-t{
    font-family:var(--display); font-style:italic; font-size:17px; font-weight:500;
    letter-spacing:0;
  }
  .coming svg{width:16px; height:16px; display:block; flex:none}

  /* ── the detail page ── */
  .bartitle{
    flex:1; margin:0 0 0 8px; font-family:var(--fig); font-size:11px; font-weight:500;
    letter-spacing:.14em; text-transform:capitalize; color:var(--tx3);
  }
  .dhead{padding:28px 20px 24px}
  .dnameinput{
    width:100%; border:none; background:none; font-family:var(--display); color:var(--tx);
    font-size:32px; font-weight:600; letter-spacing:-.02em; padding:0 0 8px;
    border-bottom:1.5px solid var(--act-soft);
  }
  .dnameinput:focus{outline:none; border-bottom-color:var(--act)}
  .save{
    font-family:var(--ui); font-size:13.5px; font-weight:600; border:none; cursor:pointer;
    border-radius:2px; padding:8px 16px; background:var(--act); color:var(--tl);
    margin-right:4px; letter-spacing:.01em;
  }
  .dname{
    margin:0; font-family:var(--display); font-size:32px; font-weight:600;
    letter-spacing:-.02em; display:flex; align-items:center; gap:12px; color:var(--tx);
  }
  .dname .gl{width:20px; height:20px; margin-left:0}
  .dsubt{
    margin:8px 0 0; font-family:var(--display); font-style:italic; font-size:16px;
    color:var(--tx2);
  }
  .none{margin:0; font-family:var(--display); font-style:italic; font-size:16px; color:var(--tx3)}
  .nextrow{display:flex; align-items:center; gap:12px}
  .nextrow .phase{width:24px; height:24px; display:block; flex:none}
  .next-when{
    font-family:var(--display); font-size:17px; font-weight:500; letter-spacing:-.005em;
    color:var(--tx);
  }
  .next-rt{font-family:var(--display); font-style:italic; font-size:14px; color:var(--tx2)}
  .log-row{
    display:flex; align-items:center; gap:12px; padding:8px 0;
    border-top:1px solid var(--edge-soft); font-size:14px;
  }
  .log-row:first-of-type{border-top:none; padding-top:2px}
  .log-when{flex:1; font-family:var(--display); font-size:16px; color:var(--tx)}
  .log-val{font-family:var(--fig); font-size:12.5px; color:var(--tx2)}
  .log-mark{
    width:20px; height:20px; border-radius:2px; flex:none; display:grid; place-items:center;
    background:var(--done-bg); color:var(--done-fg);
  }
  .log-mark svg{width:12px; height:12px}
  .log-mark.late{background:var(--warn-fill); color:var(--warn)}
  .log-val.late{color:var(--warn); font-weight:500}

  /* The panels are ruled bands too, not bordered boxes — same idea as the ledger, so the
     detail page and the day read as the same publication. */
  .panel{
    margin:0; padding:20px;
    background:var(--card-bg); border:none; border-top:1px solid var(--edge-soft);
    border-radius:0;
  }
  .panel > h3{
    font-family:var(--fig); font-size:10.5px; font-weight:500; letter-spacing:.14em;
    text-transform:uppercase; color:var(--tx3); margin:0 0 12px;
  }
  .panel .chips{display:flex; flex-wrap:wrap; gap:8px}
  /* squared tags with a hairline, not filled pills */
  .panel .chip{
    margin:0; font-family:var(--ui); font-size:14px; font-weight:500; letter-spacing:0;
    color:var(--tx);
    background:none; border:1px solid var(--edge); border-radius:2px; padding:8px 12px;
    display:inline-flex; align-items:center;
  }
  .chip.live{
    cursor:pointer; font-family:var(--ui); border:1px solid var(--act-soft);
    background:var(--act-fill); color:var(--tx);
  }
  .chip.live:hover{background:var(--act-hover)}
  .chip.add{
    cursor:pointer; font-family:var(--ui); background:none; color:var(--tx2);
    border:1px dashed var(--edge); font-weight:400;
  }
  .chip.add:hover{border-color:var(--act-soft); color:var(--tx)}
  /* ── the one chip that holds an hour ──
     The directions are a row of answers in one voice, and all but one of them are
     words: a dose, a form, how often. When is the odd one — it is not another property
     of the medicine so much as the inside of the chip before it, the hours that "twice
     a day" leaves unsaid. So it is set apart, and the way to set it apart was already
     in the app rather than waiting to be invented.

     Every hour written anywhere here is tinted by the hour it names — slate at night,
     ochre through the morning, gold at noon, sienna by evening. The ledger does it, the
     routines list does it, and this chip holds exactly the thing that colouring is
     about. So it takes the ink of the hour it leads with: a breakfast medicine comes up
     gold, a bedtime one goes slate, and the row carries a second colour that is never
     arbitrary, because it is the same colour that hour wears everywhere else.

     The ink arrives per chip as a custom property, since it is a different colour for
     every medicine — see timedInk. A quiet build: hairline and text in the ink, the
     faintest wash of it behind, where the green chips beside it are filled. It is a
     detail of the answer to its left, not a louder answer of its own. */
  .chip.timed{
    border-color:var(--ink); color:var(--ink); background:var(--ink-fill);
  }
  .chip.live.timed:hover{background:var(--ink-wash-2, var(--ink-fill)); filter:brightness(.97)}
  .phone.dark .chip.live.timed:hover{filter:brightness(1.12)}

  .day .empty{margin-bottom:24px}
  /* ── recording ──
     A squared block, not a circle. The first brand's FAB is a Material corner button;
     this one is a stamp. */
  .fab{
    position:absolute; right:20px; bottom:20px; z-index:8;
    width:56px; height:56px; border-radius:2px; border:none; cursor:pointer;
    background:var(--act); color:var(--tl); display:grid; place-items:center;
    box-shadow:0px 6px 7px 0px rgba(38, 32, 22, 0.22);
  }
  .fab:active{transform:translateY(1px); box-shadow:0 1px 0 rgba(38,32,22,.22)}
  .fab svg{width:24px; height:24px; display:block}
  .phone.dark .fab{color:#15120C; box-shadow:0 2px 0 rgba(0,0,0,.4)}

  .sheetscrim{
    position:absolute; inset:0; z-index:12; background:rgba(20,16,10,.46);
    opacity:0; transition:opacity .2s ease;
  }
  .phone.raised .sheetscrim{opacity:1}
  /* the one thing that genuinely sits above the page, so the one thing with a shadow */
  .logsheet{
    position:absolute; left:0; right:0; bottom:0; z-index:13;
    background:var(--card-bg); border-top:1.5px solid var(--edge);
    border-radius:4px 4px 0 0; padding:12px 20px 24px;
    box-shadow:0 -12px 32px -18px rgba(20,16,10,.45);
    max-height:80%; overflow-y:auto; scrollbar-width:none; border-top-left-radius:20px; border-top-style:none; border-top-right-radius:20px;
    transform:translateY(calc(100% + 40px));
    transition:transform .28s cubic-bezier(.2,.7,.3,1);
  }
  /* The sheet is the one thing brought over the page rather than laid into it, so it is
     seen to arrive and seen to leave — the paper comes up off the bottom edge and the
     scrim takes the page back a stop while it is up. The open position hangs off the
     phone rather than off the sheet so these two rules cover all three sheets, and so a
     redraw can settle the closed position before opening it. The 40px is the shadow:
     parked at a flat 100% the sheet is gone but the smudge it throws upwards is not. */
  .phone.raised .logsheet{transform:none}
  .logsheet::-webkit-scrollbar{display:none}
  .grab{display:block; width:32px; height:4px; border-radius:0; background:var(--edge); margin:0 auto 16px}
  .field.narrow{width:64px; flex:none}
  .tgroup{display:flex; align-items:center; gap:8px}
  .tsep{font-family:var(--fig); font-size:22px; font-weight:400; color:var(--tx3); margin-top:-2px}
  .field{
    position:relative; display:block; border:1px solid var(--edge); border-radius:2px;
  }
  .field:hover{border-color:var(--tx3)}
  .field:focus-within{border-color:var(--act); box-shadow:inset 0 0 0 1px var(--act)}
  .field > label{
    position:absolute; top:-8px; left:12px; padding:0 8px; background:var(--card-bg);
    font-family:var(--fig); font-size:10.5px; font-weight:500; letter-spacing:.08em;
    text-transform:uppercase; color:var(--tx2);
  }
  .field:focus-within > label{color:var(--act)}
  .fval{
    width:100%; font-family:var(--fig); font-size:20px; font-weight:500;
    letter-spacing:.02em; color:var(--tx);
    background:none; border:none; padding:16px 8px; text-align:center; cursor:pointer;
  }
  .fval:focus{outline:none}
  .fval::-webkit-calendar-picker-indicator{display:none; -webkit-appearance:none}
  .fval::-webkit-inner-spin-button, .fval::-webkit-clear-button{display:none}

  .logitems{display:flex; flex-direction:column; margin:8px -8px 0}
  .logitem{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    font-family:inherit; background:none; border:none; border-radius:2px;
    padding:12px 8px; cursor:pointer;
  }
  .logitem:hover{background:var(--act-hover)}
  .logitem .gl{margin-left:0; width:16px; height:16px}
  .li-n{
    flex:1; font-family:var(--display); font-size:18px; font-weight:500;
    letter-spacing:-.005em; color:var(--tx);
  }
  .li-d{font-family:var(--fig); font-size:12.5px; color:var(--tx2)}

  /* The way in to the rest of the cabinet, at the foot of the medicines. Its own
     element rather than part of the row, since a row is already a button and the two
     do different things: the row files what it names, this one opens the page where the
     rest are named. The negative margin is the list's own overhang — it runs 8px wider
     than the sheet's text column — taken back off, so the glyph sits in the column
     rather than past it. */
  .logrow{display:flex; align-items:center}
  .logrow .logitem{flex:1; min-width:0}
  .logmore{
    width:44px; height:44px; flex:none; margin-right:-6px; padding:0;
    border:none; background:none; color:var(--tx3); border-radius:2px; cursor:pointer;
    display:grid; place-items:center;
  }
  .logmore:hover{background:var(--act-hover); color:var(--act)}
  .logmore[aria-expanded="true"]{color:var(--act)}
  .logmore svg{width:20px; height:20px; display:block}

  /* ── the record page ──
     A medicine is recorded by being named — the dose is a standing fact, so the tap is
     the whole of it, and the sheet files it where it stands. A reading is a figure, and
     there is no recording one without asking for the figure. So it gets a page, the way
     adding a medicine does: the sheet names the thing and hands over.

     Built from the detail page's own furniture — the same heading, the same ruled
     panels, the same figures face over each one — because it is the same publication,
     and there is nothing to set here that page has not already had to set.

     ── one row, everywhere ──
     The three readings used to be three forms. A weight was a wide box with a step
     either side of it; a blood pressure was two boxes with floating labels and a slash
     between them; an eye test was three tags of three different widths. Four field
     sizes, two ways of labelling a field, three places to put a unit, and nothing on any
     one page sharing an edge with anything on the others.

     Now there is one row and every value on all three pages is written in it: a name,
     the value sitting on a rule, and what it is measured in. The rules begin and end on
     the same two x's the whole way down, so the figures stack into a column the way a
     ledger's do — which is what this brand's pages are, and what six outlined boxes of
     four different sizes were stopping these three from being.

     A rule rather than a box, because a rule is already what this brand does wherever
     something is typed: the day heading, the medicine name on the detail page, the
     routine name in its sheet. The box was the import.

     The panel heading names what the panel holds. A row carries its own name only when
     there is more than one of them to tell apart — a single value takes the whole column
     and is named by the heading above it. Which is why the weight page and the eye test
     page come out the same shape, and the blood pressure page is that shape three
     times. */
  .frow{display:flex; align-items:baseline; gap:12px}
  .frow + .frow{margin-top:20px}
  /* the name, in the serif — this brand's face for what a thing is called */
  .flabel{
    width:92px; flex:none;
    font-family:var(--display); font-size:15px; font-weight:500; color:var(--tx2);
  }
  /* The rule belongs to the value rather than to a box around it. Figures are set
     against its right end so they stack into a column; prose runs from the left, since
     that is the end a sentence starts at. */
  .fline{
    flex:1; min-width:0; display:flex; align-items:baseline; justify-content:flex-end;
    gap:4px; margin:0; padding:2px 2px 6px;
    background:none; border:none; border-bottom:1.5px solid var(--act-soft);
    border-radius:0; text-align:right;
  }
  .fline:focus-within{border-bottom-color:var(--act)}
  /* Prose runs from the left, since that is the end a sentence starts at — the one row
     on the page that is read rather than counted, which is also why it is the one set in
     the serif. It keeps the column all the same: a note that began where the figures
     begin and a rule that began 104px to the left of them would be two alignments on a
     page whose whole point is one. */
  .fline.prose{justify-content:flex-start; text-align:left}
  /* The note is the one row with neither a name nor a unit, so it has no sibling cells
     to hold its rule in the column. It takes the column itself — the name cell's width
     and the gap on one side, the unit cell's and the gap on the other — so its rule
     begins and ends exactly where every other rule on the page does. Guarded on being
     alone in the row, so that if it is ever given those cells the flex layout does the
     work instead and the two do not both apply. */
  .frow > .fline.prose:only-child{margin-left:104px; margin-right:60px}

  /* ── when it happened ──
     Two rows for a day and an hour was two rules, two labels and two headings' worth of
     height to say "now" — and each of them answered at the far right of a column with
     nothing in the middle of it. They are one fact, so they are one row, set to the two
     ends of the one rule: the day where a name goes and the hour where a figure goes,
     which is the same way round every other row on the page reads.

     And a step smaller than the reading below them. They were the same size, so the
     clock competed with the figure the page exists to collect — when it happened was
     settled before you arrived here and is on the page to be corrected, not entered. */
  .fwhen{justify-content:space-between}
  .fwhen .fnum, .fwhen .fsep{font-size:19px}
  .fclock{display:flex; align-items:baseline; gap:4px; flex:none}
  /* every figure in the app is monospaced, and these are the largest it sets */
  .fnum{
    width:100%; min-width:0; font-family:var(--fig); font-size:24px; font-weight:500;
    letter-spacing:.02em; color:var(--tx);
    background:none; border:none; border-radius:0; padding:0; text-align:right;
  }
  .fnum:focus{outline:none}
  .fnum::placeholder{color:var(--tx3)}
  .fnum::-webkit-inner-spin-button, .fnum::-webkit-clear-button{display:none}
  /* the two halves of the clock share one rule, so the hour and the minute read as one
     value rather than as two fields that happen to be adjacent */
  .fnum.clock{width:auto; field-sizing:content; min-width:2ch; text-align:center}
  .fsep{font-family:var(--fig); font-size:24px; font-weight:400; color:var(--tx3)}
  /* A value chosen rather than typed, cycled by tapping — the same control the medicine
     page sets a dose and a frequency with, and the same one the day was always wound
     back by. */
  .fpick{
    flex:none; font-family:var(--display); font-size:19px; font-weight:500;
    letter-spacing:-.005em; color:var(--act);
    background:none; border:none; border-radius:2px; cursor:pointer;
    /* the wash on hover wants a little room, which the negative margin gives back so the
       word still sits on the end of its rule */
    padding:0 4px; margin:0 -4px;
  }
  .fpick:hover{background:var(--act-hover)}
  .fpick.unset{color:var(--tx3); font-style:italic}
  /* Prose, so the serif — the one thing typed on this page that is not a measurement. */
  .fnote{
    width:100%; font-family:var(--display); font-style:italic; font-size:17px;
    font-weight:500; color:var(--tx);
    background:none; border:none; padding:0; text-align:left;
  }
  .fnote:focus{outline:none}
  .fnote::placeholder{color:var(--tx3)}
  /* A column of its own, so kg, mmHg and bpm all begin at the same x — and the rows
     with no unit still reserve it, so every rule on every page ends where the others
     do. */
  .funit{
    width:48px; flex:none;
    font-family:var(--fig); font-size:13px; font-weight:400; letter-spacing:.04em;
    color:var(--tx3);
  }

  /* What the figures mean and what they were last time — the two things a number on its
     own cannot say. One type treatment for the whole line now: the band used to be set
     in letterspaced capitals beside plain mono, which was a second voice in a line
     eleven pixels tall. Colour carries it instead.

     Indented to the column it is about, so it reads as a note under the figures rather
     than as a second heading under the first. */
  .padfoot{
    margin:18px 0 0 104px; display:flex; align-items:baseline; gap:4px 12px; flex-wrap:wrap;
    font-family:var(--fig); font-size:11.5px; font-weight:400; letter-spacing:.04em;
    color:var(--tx3);
  }
  .padfoot .band{font-weight:500; color:var(--tx2)}
  .padfoot .band.ok{color:var(--act)}
  .padfoot .band.warn{color:var(--warn)}
  .padfoot .delta{color:var(--tx2); font-weight:500}

  /* The page's conclusion rather than a control in its corner. The edit page keeps Save
     up in the bar because nothing there is the one thing you came to do — you may change
     a chip and leave. Here there is exactly one, so it is where you arrive: a band across
     the foot, full bleed like the rules above it, and dead until there is something to
     record.

     It holds the foot of the screen whatever the page does, which takes both halves of
     this. The growing gap puts it on the bottom edge when the fields do not fill the
     screen — flex alone would leave it sitting under the last panel with paper below it.
     Sticky holds it there when they more than fill it, which is the case the gap cannot
     help with: a blood pressure on a short screen scrolls, and a button that scrolls off
     the bottom is a button you have to go looking for to finish what you came to do.
     Scrolled all the way down the two agree — its sticky position is its own position —
     so it never doubles up or jumps.

     It is opaque, so the fields pass behind it rather than through it. The appbar above
     is the same device with the same reason, which is why it takes that one's z-index
     minus the room the drawer and its scrim need above both. */
  .body.recpage{display:flex; flex-direction:column}
  .recpage > *{flex:none}
  .recpage .recfill{flex:1 1 auto; min-height:32px}
  .commit{
    position:sticky; bottom:0; z-index:4;
    display:block; width:100%; margin:0; padding:20px;
    font-family:var(--ui); font-size:15px; font-weight:600; letter-spacing:.01em;
    color:var(--tl); background:var(--act); border:none; border-radius:0; cursor:pointer;
  }
  .commit:active{transform:translateY(1px)}
  .commit:disabled{background:var(--edge-soft); color:var(--tx3); cursor:default}
  .commit:disabled:active{transform:none}
  .phone.dark .commit{color:#15120C}
  .phone.dark .commit:disabled{color:var(--tx3)}

  /* An empty day, set as a printed note between two rules rather than in a dashed box. */
  .empty{
    margin:0; padding:32px 20px; text-align:center;
    border:none; border-top:1px solid var(--edge-soft);
    border-bottom:1px solid var(--edge-soft); border-radius:0;
  }
  .empty p{
    margin:0; font-family:var(--display); font-style:italic; font-size:16px;
    font-weight:500; color:var(--tx3);
  }

  /* ── the cabinet ──
     The register of what is being taken. Ruled bands, like everything else, with the
     count of what is left set in the figures face. */
  .med{
    display:flex; align-items:flex-start; gap:12px; text-align:left;
    width:100%; margin:0; padding:20px;
    font-family:inherit; cursor:pointer;
    background:var(--card-bg); border:none; border-top:1px solid var(--edge-soft);
    border-radius:0;
  }
  .med:hover{background:var(--act-hover)}
  /* the nudge sits the glyph on the first line of a 20px serif name */
  .med .gl{width:16px; height:16px; margin:4px 0 0; flex:none; margin-top:8px}
  .medbody{flex:1; min-width:0}
  .med-n{
    display:block; font-family:var(--display); font-size:20px; font-weight:500;
    letter-spacing:-.01em; color:var(--tx);
  }
  .med-d{
    display:block; margin-top:0px; font-family:var(--display); font-style:italic;
    font-size:14.5px; color:var(--tx2);
  }
  /* Sienna when it will not see out a repeat — the same sienna a missed dose uses,
     because both mean "this one needs you". */
  .med-s{
    display:inline-flex; align-items:center; gap:8px; margin-top:12px;
    font-family:var(--fig); font-size:11px; font-weight:400; letter-spacing:.04em;
    color:var(--tx3);
  }
  .med-s.low{color:var(--warn); font-weight:500}
  .med-s svg{width:12px; height:12px; display:block; flex:none}
  .med .chev{margin-top:4px}
  .med .chev svg{transform:rotate(-90deg)}

  /* Stopping a medicine is the one thing on the edit page that cannot be undone by
     pressing cancel, so it is set apart from the fields and says what it does. */
  .danger{
    display:block; width:100%; margin:24px 0 0; padding:20px;
    font-family:var(--display); font-size:17px; font-weight:500; color:var(--bad);
    background:none; border:none;
    border-top:1px solid var(--edge-soft); border-bottom:1px solid var(--edge-soft);
    border-radius:0; cursor:pointer;
    text-align:center;
  }
  .danger:hover{background:rgba(140,47,36,.07)}
  .phone.dark .danger:hover{background:rgba(224,139,126,.10)}

  /* ── the routines page ──
     A register that is only read, and a sheet that does the writing. Editing in place
     had the name pretending to be two things at once — a heading to read and a field to
     type in — and it could not look like both. So the row is a row: the cabinet's, with
     the hour in the mono column where a medicine keeps its supply count, and a chevron
     to say it opens. Nothing on it has to advertise being editable, because nothing on
     it is; it only has to look tappable.

     Reading down the page is then the point of the page — a column of hours with the
     day's own marks shading beside them, gold at breakfast to slate at bedtime. */
  /* The dose page takes the same row, for the same reason it exists: a line to pick
     from rather than a record to read. One name, one figure, and the whole row is the
     act — which is why neither of them carries a mark saying what tapping does. */
  .rtrow, .doserow{
    display:flex; align-items:center; gap:12px; text-align:left;
    width:100%; margin:0; padding:20px;
    font-family:inherit; cursor:pointer;
    background:var(--card-bg); border:none; border-top:1px solid var(--edge-soft);
    border-radius:0;
  }
  .rtrow:hover, .doserow:hover{background:var(--act-hover)}
  .doserow .gl{width:16px; height:16px; margin-left:0; flex:none}
  /* upright, not the routines' italic: this brand sets an occasion in italic and a
     thing in roman, and a medicine is a thing */
  .dose-n{
    flex:1; min-width:0; font-family:var(--display); font-size:20px; font-weight:500;
    letter-spacing:-.01em; color:var(--tx);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .dose-d{
    font-family:var(--fig); font-size:12.5px; font-weight:400; color:var(--tx2);
    flex:none;
  }
  .rtrow .phase{width:32px; height:32px; display:block; flex:none}
  /* italic, because that is how this app names an occasion everywhere else */
  .rtname{
    flex:1; min-width:0; font-family:var(--display); font-style:italic; font-size:20px;
    font-weight:500; letter-spacing:-.005em; color:var(--tx);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .rttime{
    font-family:var(--fig); font-size:14px; font-weight:500; letter-spacing:.02em;
    flex:none;
  }
  .rtrow .chev svg{transform:rotate(-90deg)}

  /* ── the routine sheet ──
     The log sheet's furniture, because it is the log sheet's kind of task: something
     short raised over the page you were on and dismissed by tapping away from it. And
     no Save, for the log sheet's reason — what is typed is already in the register, so
     there is nothing held back to commit. */
  .rtsheet .danger{margin:24px -20px 0; border-bottom:none; margin-left:0px; margin-right:0px}

  /* The rule belongs to the words rather than to the sheet, so the field shrinks to
     what is in it. field-sizing does that as you type where it is supported; where it
     is not, the size attribute the render works out gets the width right when the sheet
     opens and holds it. Either way the line around it does the centring, and a min
     width keeps a rule under a name that has been emptied out. */
  .rt-nameline{margin:0 0 24px; text-align:center}
  .rt-name{
    display:inline-block; field-sizing:content; min-width:5ch; max-width:100%;
    margin:0; padding:0 2px 10px;
    font-family:var(--display); font-style:italic; font-size:22px; font-weight:500;
    letter-spacing:-.005em; color:var(--tx); text-align:center;
    background:none; border:none; border-bottom:1.5px solid var(--act-soft);
  }
  .rt-name:focus{outline:none; border-bottom-color:var(--act)}
  /* centred as a group, the way the log sheet centres its own clock */
  .rt-when{display:flex; align-items:center; justify-content:center; gap:16px}
  .rt-mark{display:block; flex:none}
  .rt-when .phase{width:32px; height:32px; display:block}
  .rt-when .field.narrow{width:60px}
  .rt-when .fval{font-size:19px; padding:12px 6px}
  .rt-when .tsep{font-size:20px; margin-top:-2px}

  /* ── the field sheet ──
     The third thing that uses the log sheet's paper, and the third for the same reason.

     Its answers are the page's own chips, brought up onto the sheet. They were a column
     of 18px serif rows with a tick down one side, which is the filter's build and was the
     wrong one to borrow: the filter's rows are five sentences you say yes or no to one at
     a time, and these are one short answer out of several. Set as rows, four counts took
     four full widths of paper to say 1, 2, 3, 4, and a tick column stood beside them to
     carry a state the chips on the page behind already carry by being filled in. Set as
     chips they are the thing they will become — the same tags, in the same order, in
     roughly the same places — so the sheet reads as the row of directions opened up
     rather than as a different kind of list about it.

     Which is also what lets the way in to a typed answer be one more chip. It is a
     doorway rather than a value, so it is dashed while it is only that, and solid once
     what is behind it is the answer in force. */
  .fsheet .sheeth{
    margin:0; font-family:var(--fig); font-size:10.5px; font-weight:500;
    letter-spacing:.14em; text-transform:uppercase; color:var(--tx3);
  }
  .ochips{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 0}
  /* ── a register, ticked ──
     The occasions behind the Routine chip are the filter's rows and nothing new: the
     same ruled square going green, the same hover running past the text column. Only
     two things are said differently. The name is the serif's italic, because that is
     how this app names an occasion wherever it appears and a chip in roman would have
     been the one place it did not. And it comes down to the size the filter sets its
     own rows at — the routines page runs them at 20px because there the name is the
     page, where here it is one answer among four. */
  /* ── the week, along a line ──
     The month picker's grid with one row in it: seven columns, the same gap, the same
     figures face. Which is where this app already draws a week, so the letters land in
     a column the picker has taught and the row needs no heading to be read as one.

     Round, where everything else in this brand is squared to 2px. The exception is
     earned rather than borrowed: a square is what this app ticks — the ledger's boxes,
     the filter's, the occasions' — and these are not ticked, they are a week with some
     of its days in it. Round says a different kind of thing is being chosen, and it is
     the one shape a seven-across row can take without reading as a strip of buttons.

     Filled with the act green when a day is in force, which is what filled means
     everywhere in these sheets; hairlined when it is not, because a bare letter reads
     as a label and these are something to press. */
  .oweek{display:grid; grid-template-columns:repeat(7, 1fr); gap:6px; margin:18px 0 0}
  .oday{
    display:grid; place-items:center; aspect-ratio:1; padding:0; cursor:pointer;
    font-family:var(--fig); font-size:15px; font-weight:500; letter-spacing:.02em;
    color:var(--tx); background:none;
    border:1px solid var(--edge); border-radius:50%;
  }
  .oday:hover{border-color:var(--act-soft); background:var(--act-hover)}
  .oday.on, .oday.on:hover{background:var(--act); border-color:var(--act); color:var(--tl)}

  .fsheet .kinds{margin-top:14px}
  .fsheet .krow .rtname{font-size:17px}
  /* The hour sits where the filter puts its mark, in the ink that hour wears
     everywhere else — so a column of occasions reads as a morning, a midday and two
     evenings before any of the words have been. */
  .fsheet .krow .rttime{font-size:12.5px}
  /* the page's chip, built again here rather than shared: that one is scoped inside
     .panel, and a sheet is not a panel */
  .ochip{
    display:inline-flex; align-items:center; justify-content:center;
    font-family:var(--ui); font-size:14px; font-weight:500; letter-spacing:0;
    color:var(--tx); background:none; border:1px solid var(--edge); border-radius:2px;
    padding:9px 13px; cursor:pointer;
  }
  .ochip:hover{border-color:var(--act-soft); background:var(--act-hover)}
  /* The answer in force, filled the way the live chip on the page behind is filled —
     one appearance for the idea wherever it is being said. A full border rather than the
     page's soft one, because here it has five unchosen siblings to be told apart from. */
  .ochip.on{background:var(--act-fill); border-color:var(--act); color:var(--tx)}
  /* Having no instruction is not another instruction, so it is set as this brand sets an
     aside — the serif's italic, quietly — and left at the end of the row. */
  .ochip.none{font-family:var(--display); font-style:italic; font-weight:400; color:var(--tx2)}
  .ochip.none.on{color:var(--tx)}
  .ochip.own{border-style:dashed}
  .ochip.own.on{border-style:solid}
  /* Counts are figures, and a row of them reads as amounts rather than as four more
     words. Squared off to a common width so 1 and 4 are the same target and the row is a
     rank rather than a ragged edge — only the answers, not the doorway standing with
     them, which is a word and would be odd set in the figures face. */
  .fsheet.counts .ochip[data-opt]{
    font-family:var(--fig); font-size:15px; letter-spacing:.02em; min-width:30px;
  }

  /* ── writing one that is not offered ──
     The sheet's other state, not a second half of this one: the answers go, the boxes
     come, and the heading above both does not move because it is the same field being
     answered either way. What says you are a step in is the foot — the filter's foot,
     because this is the filter's situation, a sheet with something to leave rather than
     something to pick. Back to the answers on the left, Done on the right.

     The figure is the record page's — a value on a rule, in the largest figures the app
     sets — because there is one way of typing a number in this brand and this is it.
     Given the room the answers were taking, since it is now the only thing being asked. */
  .ocust{margin:28px 0 0}
  .ocust .fnum{font-size:22px}
  /* A range is a pair and sits centred on its rule, where a dose is one figure answering
     the units beneath it and sits against the end of its own — the same difference the
     record page makes between a blood pressure and a weight. */
  .fline.orange{justify-content:center; gap:10px}
  /* A medicine taken more than once has a rule for each hour, stacked and read down.
     Set further apart than the record page sets its rows, because these carry no names
     to tell them apart — the gap is the only thing saying they are separate hours and
     not one value that has wrapped. */
  .otime{display:flex; align-items:center; gap:12px}
  .otime + .otime{margin-top:22px}
  /* ── how far apart the hours are ──
     One line under the column, saying the thing the column is actually about, and
     quiet with it: the hours are the answer and this is the arithmetic on them. The
     figures face at the size this app says an aside in, which is the size the cabinet
     gives "28 left — 14 days".

     Under rather than between. It was a figure in every space for a while, each one
     moving the hours below it; this is one statement about all of them, so it belongs
     to the stack rather than to any pair in it, and the foot of the stack is where a
     summary goes. Centred on the rules rather than on the sheet — the padding is the
     width of the minus column the rules carry, taken back off this line so the number
     sits under the clock faces and not under the block as a whole.

     A box, not a caption, because the number is there to be changed. It is ruled under
     rather than boxed in, the way every typed figure in this app is — the hairline goes
     to the act colour on focus, so what is being edited is what has a live rule under
     it. It shrinks to its content, so "6" and "7.5" both sit centred on the column
     rather than one of them floating in a field sized for the other. */
  .ogap{
    display:flex; align-items:baseline; justify-content:center; gap:1px;
    margin:20px 0 0; padding-right:40px;
    font-family:var(--fig); font-size:12.5px; font-weight:500; letter-spacing:.04em;
    color:var(--tx3);
  }
  .ogap > span{margin-left:3px}
  .ogap input{
    field-sizing:content; width:auto; min-width:1.5ch; text-align:right;
    font:inherit; color:var(--tx2); background:none; padding:0 1px 2px;
    border:none; border-bottom:1px solid var(--edge);
  }
  .ogap input:focus{outline:none; color:var(--act); border-bottom-color:var(--act)}
  .ogap input::placeholder{color:var(--tx3)}
  .otime .fline{flex:1; min-width:0}
  /* Held open whether or not it holds anything, the way the record page reserves its
     unit cell: the first hour cannot be removed, and a slot that came and went would
     shift every rule sideways the moment a second hour arrived. */
  .odrop{width:28px; height:28px; flex:none; display:grid; place-items:center}
  .odropb{
    width:28px; height:28px; padding:0; cursor:pointer;
    display:grid; place-items:center; border-radius:2px;
    background:none; border:none; color:var(--tx3);
  }
  /* The quiet control's wash, not the danger red. Taking one hour off a medicine that
     has three is an edit, not a thing to be warned about — stopping the medicine is the
     destructive act on this page and it has the red. */
  .odropb:hover{background:var(--ink-wash); color:var(--tx)}
  .odropb svg{width:16px; height:16px; display:block}
  /* A thing to add, in the dashed outline this app gives a thing to add, and centred
     under the column of rules it extends rather than ranged against either end. */
  .oadd{
    display:flex; align-items:center; justify-content:center; gap:8px;
    margin:24px auto 0; padding:9px 14px; cursor:pointer;
    font-family:var(--ui); font-size:14px; font-weight:500; color:var(--act);
    background:none; border:1px dashed var(--edge); border-radius:2px;
  }
  .oadd:hover{border-color:var(--act-soft); background:var(--act-hover)}

    return labToHex(...a.lab.map((v,k) => v + (b.lab[k] - v) * u));
  }
  function liftForDark(hex){
    const [L,a,b] = hexToLab(hex);
    const lift = Math.max(0, Math.min(0.34, 0.80 - L));
    const k = 1 - 0.28 * (lift / 0.34);
    return labToHex(Math.min(1, L + lift), a*k, b*k);
  }
  function timeInk(min){
    const [ ,a,b] = hexToLab(bodyColour(min));
    return labToHex(darkMode ? 0.72 : 0.42, a*0.9, b*0.9);
  }
  /* the same ink, laid on thin — for the one place an hour is a filled shape rather
     than a line of type, and needs a ground as well as a colour to write in */
  const inkWash = (hex, a) => {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
  };

  /* ═════════ the time-of-day mark ═════════ */
  const smooth = x => x*x*(3-2*x);
  const clamp01 = x => Math.max(0, Math.min(1, x));
  const DAWN = 350, DUSK = 1195, HANDOVER = 110, THIN = 0.40 + 0.58*0.58;
  let uid = 0;
  const pt = (cx, cy, r, deg) => {
    const a = deg * Math.PI/180;
    return [cx + r*Math.sin(a), cy - r*Math.cos(a)];
  };
  function capPath(cx, cy, R, dir){
    const [x0,y0] = pt(cx, cy, R, dir - 90), [x1,y1] = pt(cx, cy, R, dir + 90);
    return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${R} ${R} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}Z`;
  }
  function phasePath(R, k){
    const kk = Math.max(-0.985, Math.min(0.985, k));
    const rx = Math.abs(kk) * R, sweep = kk >= 0 ? 0 : 1;
    return `M0 ${(-R).toFixed(2)}A${R} ${R} 0 0 1 0 ${R.toFixed(2)}`
         + `A${rx.toFixed(2)} ${R} 0 0 ${sweep} 0 ${(-R).toFixed(2)}Z`;
  }
  function dayness(min){
    const t = ((min % 1440) + 1440) % 1440, h = HANDOVER/2;
    if (t >= DAWN - h && t <= DAWN + h) return smooth((t - (DAWN - h)) / (2*h));
    if (t >= DUSK - h && t <= DUSK + h) return 1 - smooth((t - (DUSK - h)) / (2*h));
    return (t > DAWN && t < DUSK) ? 1 : 0;
  }
  function riseHeight(min){
    const t = ((min % 1440) + 1440) % 1440;
    const dayLen = DUSK - DAWN, nightLen = 1440 - dayLen;
    const u = (t >= DAWN && t < DUSK) ? (t - DAWN)/dayLen
            : ((t < DAWN ? t + 1440 : t) - DUSK)/nightLen;
    return smooth(clamp01(Math.sin(Math.PI * u) * 1.85));
  }
  function sunmoon(min, cls){
    const S = 32, c = S/2, R = 11, id = "p" + (++uid);
    const body = darkMode ? liftForDark(bodyColour(min)) : bodyColour(min);
    const theta = (((min/1440)*360 - 180) % 360 + 360) % 360;
    let inner;
    if (iconDesign === "terminator"){
      inner = `<path d="${capPath(c,c,R,theta+180)}" fill="${body}" opacity="0.22"/>
        <path d="${capPath(c,c,R,theta)}" fill="${body}"/>`;
    } else if (iconDesign === "horizon"){
      const r = R*0.46, y = c - R*(0.98*riseHeight(min) - 0.22);
      const biteAmt = (1 - dayness(min)) * 0.62, biteR = r*0.88;
      const off = r * (1.30 - 0.62*biteAmt);
      const bites = biteAmt > 0.01 && off < (r + biteR - 0.4);
      const a = 46*Math.PI/180;
      const bx = c + off*Math.sin(a), by = y - off*Math.cos(a);
      inner = `<defs><clipPath id="${id}c"><rect x="0" y="0" width="${S}" height="${c}"/></clipPath>
        ${bites ? `<mask id="${id}m" maskUnits="userSpaceOnUse" x="0" y="0" width="${S}" height="${S}">
          <circle cx="${c}" cy="${y.toFixed(2)}" r="${r.toFixed(2)}" fill="#fff"/>
          <circle cx="${bx.toFixed(2)}" cy="${by.toFixed(2)}" r="${biteR.toFixed(2)}" fill="#000"/></mask>` : ``}
        </defs>
        <g clip-path="url(#${id}c)"><g ${bites ? `mask="url(#${id}m)"` : ``}>
          <circle cx="${c}" cy="${y.toFixed(2)}" r="${r.toFixed(2)}" fill="${body}"/></g></g>
        <path d="M${c-R} ${c}A${R} ${R} 0 0 0 ${c+R} ${c}Z" fill="${body}" opacity="0.36"/>`;
    } else {
      const elev = Math.cos(theta*Math.PI/180);
      const k = elev >= 0 ? elev : elev*THIN;
      inner = `<circle cx="${c}" cy="${c}" r="${R}" fill="${body}" opacity="0.22"/>
        <path d="${phasePath(R,k)}" fill="${body}"
              transform="translate(${c} ${c}) rotate(${(theta-90).toFixed(1)})"/>`;
    }
    return `<svg class="phase ${cls||""}" viewBox="0 0 ${S} ${S}" aria-hidden="true">${inner}</svg>`;
  }

  /* ═════════ glyphs ═════════ */
  const TICK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.6 8.4 6.5 11.3 12.4 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const PLUS = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.6v8.8M3.6 8h8.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  const CHEV = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 6.5 8 9.5l3-3" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const CLOCK = '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 4.5V8.2l2.5 1.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  /* what is in the cabinet — a box, drawn in the same outlined stroke the devices use */
  const PACK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.6 5.1 8 2.4l5.4 2.7v5.8L8 13.6l-5.4-2.7z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M2.6 5.1 8 7.8l5.4-2.7M8 7.8v5.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>';
  const NAV = {
    menu:'<path d="M3 6.5h18M3 12h18M3 17.5h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
    more:'<circle cx="12" cy="5.4" r="1.9" fill="currentColor"/><circle cx="12" cy="12" r="1.9" fill="currentColor"/><circle cx="12" cy="18.6" r="1.9" fill="currentColor"/>',
    edit:'<path d="M4 20h4l10.5-10.5a2.1 2.1 0 0 0-3-3L5 17v3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M13.6 6.4 17.6 10.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
    plus:'<path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>',
    back:'<path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
    chev:'<path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
    today:'<rect x="3.5" y="4.8" width="17" height="15.7" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/>'
        + '<path d="M3.5 9.4h17M8 2.8v3.6M16 2.8v3.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'
        + '<rect x="10.2" y="12.8" width="3.6" height="3.6" fill="currentColor"/>',
    /* the filter: rules narrowing to a point. Centred and three of them, where the
       ledger's own mark is four left-aligned — close enough to be the same family of
       drawing, far enough apart that the two never read as each other in the bar. */
    filter:'<path d="M3.4 6.5h17.2M6.6 12h10.8M9.8 17.5h4.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
    /* the ledger: ruled lines, which is what this brand calls its timeline */
    line:'<path d="M3 6h18M3 10.5h18M3 15h12M3 19.5h15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
    grid:'<rect x="3.5" y="4.5" width="17" height="16" rx="1" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3.5 9.5h17M8.5 2.8v3.4M15.5 2.8v3.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>',
    /* the cabinet: a cupboard of two doors, not a pill */
    pill:'<rect x="3.5" y="3.5" width="17" height="17" rx="1" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 3.5v17M7.6 10.2v3.6M16.4 10.2v3.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>',
    chart:'<path d="M4 20V9M10 20V4M16 20v-7M22 20H2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>',
    /* the occasions: a clock, because what is set on that page is an hour */
    clock:'<circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 7V12l3.4 2.1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>',
