           <div class="ghead">${title}<span class="n">${list.length}</span></div>
           ${list.map(card).join("")}
         </section>`
      : ``;

    return `<div style="padding:8px 0 24px">
        ${group("Taken daily", names.filter(n => !DRUGS[n].asNeeded))}
        ${group("When needed", names.filter(n => DRUGS[n].asNeeded))}
        ${names.length ? `` : `<div class="empty"><p>Nothing in the cabinet</p></div>`}
      </div>`;
  }

  /* ═════════ view four: the routines ═════════
     The register of occasions, read here and written in the sheet below. */
  function routinesView(){
    /* In the order they happen, since that is the order a day is read in. Nothing on
       this page holds a caret now, so a routine moved to a new hour can sort straight
       into its new place the moment the sheet closes. */
    const list = ROUTINES.slice().sort((a,b) => a.at - b.at);

    const row = r => {
      /* the name is typed by hand, so it cannot be trusted in an attribute unescaped */
      const q = r.id.replace(/"/g, "&quot;");
      const nm = r.name.trim() || "Unnamed routine";
      const said = nm.replace(/"/g, "&quot;");
      return `<button class="rtrow" data-rt-open="${q}"
                      aria-label="${said}, ${fmt(r.at)} — edit">
        ${sunmoon(r.at)}
        <span class="rtname">${nm}</span>
        <span class="rttime" style="color:${timeInk(r.at)}">${fmt(r.at)}</span>
        <span class="chev">${CHEV}</span>
      </button>`;
    };

    /* The air at the top is doing the work a heading would: the list has none, so it
       needs to start somewhere other than hard against the masthead. */
    return `<div style="margin-top:40px; padding:0 0 24px">
        ${list.map(row).join("")}
        ${list.length ? `` : `<div class="empty"><p>No routines</p></div>`}
      </div>`;
  }

  /* The sheet that writes one of them. Reached only from a row, so it is state rather
     than an address — the same call the log sheet makes. */
  function routineSheet(){
    const r = rtOpen && routineById(rtOpen);
    if (!r) return "";
    const q = r.id.replace(/"/g, "&quot;");
    const nm = r.name.replace(/"/g, "&quot;");
    /* a half-retyped name can be blank, which would leave the clock announcing itself
       as "hour of" nothing — so the labels fall back to the word for it */
    const said = nm.trim() || "this routine";
    return `<div class="sheetscrim js-rt-shut"></div>
      <div class="logsheet rtsheet" role="dialog" aria-modal="true" aria-label="Edit ${said}">
        <span class="grab"></span>
        <div class="rt-nameline">
          <input class="rt-name js-rt-name" data-rt="${q}" value="${nm}"
                 size="${Math.max(5, r.name.length)}"
                 aria-label="What this routine is called" autocomplete="off">
        </div>
        <div class="rt-when">
          <span class="rt-mark" data-mark="${q}">${sunmoon(r.at)}</span>
          <span class="tgroup">
            <span class="field narrow">
              <input class="fval js-rt-h" data-rt="${q}" inputmode="numeric" maxlength="2"
                     value="${fmt(r.at).slice(0, 2)}" aria-label="Hour ${said} happens">
            </span>
            <span class="tsep">:</span>
            <span class="field narrow">
              <input class="fval js-rt-m" data-rt="${q}" inputmode="numeric" maxlength="2"
                     value="${fmt(r.at).slice(3)}" aria-label="Minute ${said} happens">
            </span>
          </span>
        </div>
        <button class="danger js-rt-drop" data-rt="${q}">Remove this routine</button>
      </div>`;
  }

  /* The mark has to keep up with the clock beside it, and a redraw would take the caret
     with it — so it is repainted where it stands. */
  function paintMark(r){
    const host = document.querySelector(`.rt-mark[data-mark="${r.id}"]`);
    if (host) host.innerHTML = sunmoon(r.at);
  }

  /* Folded, the taken group is one line: how many, what they were, and a way in. What
     is done is the least urgent thing on the screen, so it can be the smallest. */
  function foldedLogged(list){
    const shapes = [...new Set(list.map(x => x.e.shape))].slice(0, 5).map(k => glyph(k)).join("");
    /* The way back in is the same word in the same place as the way out — the link in
       the heading turns over rather than going away, so the control holds still. */
    return `<section class="group">
      <div class="ghead">Taken<span class="n">${list.length}</span>
        <button class="hide" data-expand aria-expanded="false">Unfold</button></div>
      <div class="folded">
        <span class="fold-t">${list.length} taken</span>
        <span class="fold-s">${shapes}</span>
      </div>
    </section>`;
  }

  /* the days after today that actually hold anything the filter is letting through —
     a boundary offering "the days ahead" has to open onto something */
  function ahead(){
    return DAYS.map((d, di) => ({ d, di }))
      .filter(x => x.di > NOW.day && x.d.events.some(shown));
  }

  const MINUS = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.6 8h8.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

  function comingBar(){
    const rest = ahead();
    if (futureMode !== "edge" || !rest.length) return "";
    /* Both labels are noun phrases naming what you get, so the two states read as one
       control rather than a section heading on one side and a command on the other. */
    return futureOpen
      ? `<button class="coming" data-fold-future aria-expanded="true">
          <span class="coming-t">Fewer days</span>${MINUS}</button>`
      : `<button class="coming" data-open-future aria-expanded="false">
          <span class="coming-t">The days ahead</span>${PLUS}</button>`;
  }

  /* ═════════ the filter ═════════ */

  /* How many entries of each kind the page holds: the open day in the day view, and
     whatever run of days the ledger is currently showing in the ledger. Counted over
     everything the page holds rather than over what is on screen, since the figure is
     there to say what adding a kind to the choice would bring — a row reading 0 is a row
     not worth the tap, and one reading 14 is the whole of what is being set aside. */
  function kindCounts(){
    const n = {};
    KINDS.forEach(k => { n[k.key] = 0; });
    DAYS.forEach((d, di) => {
      const inScope = view === "day" ? di === open : showFuture() || di <= NOW.day;
      if (!inScope) return;
      d.events.forEach(e => { n[kindOf(e)] = (n[kindOf(e)] || 0) + 1; });
    });
    return n;
  }

  function kindsSheet(){
    if (!picking) return "";
    const n = kindCounts();
    const row = k => {
      const on = kindsOn.has(k.key);
      /* The state is carried by aria-pressed, which is what a reader announces for a
         control that stays down, so the box is hidden from it and the label is left to
         be the thing itself and its figure rather than a sentence restating the mark. */
      /* The box leads, and does not follow boxSide the way the day's rows do. That knob
         settles where the mark sits on an entry, where the box is something done to a
         thing the row is mostly about — so it goes to the end, out of the name's way. A
         row here is not about its kind, it is about whether the kind is wanted, and the
         box is the whole of that. Leading, the five of them rule a column down the left
         that can be read at a glance. The marks take the other end and rule one there —
         a column, not a ragged edge, because the name is given the row's slack, so the
         row ends where the sheet does and not where the longest word stops. */
      return `<button class="krow${on ? " on" : ""}" data-kind="${k.key}"
                aria-pressed="${on}" aria-label="${k.label}, ${n[k.key]}">
        <span class="box${on ? " on" : ""}" aria-hidden="true">${TICK}</span>
        <span class="kname">${k.label}</span>
        <span class="kn">${n[k.key]}</span>
        <span class="kglyph">${glyph(k.mark)}</span>
      </button>`;
    };
    /* Done only puts the sheet away. Every tick has already told the ledger, which is
       redrawing behind the sheet as they are made — so there is nothing held back here
       for Done to commit, and nothing for the scrim to abandon by closing the same
       thing a different way. */
    /* The sheet is five words and five boxes, and what it is for is named on the control
       that raised it — so it carries no heading of its own, the same as the sheet the
       record button raises. What it is called is said to a reader and left off the paper. */
    return `<div class="sheetscrim js-kshut"></div>
      <div class="logsheet" role="dialog" aria-modal="true" aria-label="What to show">
        <span class="grab"></span>
        <div class="kinds">${KINDS.map(row).join("")}</div>
        <div class="kfoot">
          <button class="kclear" data-kind-all${kindsOn.size ? `` : ` disabled`}
                  aria-label="Clear — show everything">Clear</button>
          <button class="kdone js-kshut">Done</button>
        </div>
      </div>`;
  }

  /* Said the way a list is said. The joining word is asked for rather than assumed,
     because a list of things you have and a list of things you have not are joined by
     different ones: blood pressure and notes, but no blood pressure or notes. */
  const andList = (xs, join) => xs.length < 2 ? (xs[0] || "")
    : xs.slice(0, -1).join(", ") + ` ${join || "and"} ` + xs[xs.length - 1];

  /* A label set mid-sentence loses the capital it only has for standing at the front of
     a row. One with a capital inside it is spelled that way on purpose — an HbA1c is an
     HbA1c wherever it is said — so that one is left alone. */
  const lower = s => /[A-Z]/.test(s.slice(1)) ? s : s.toLowerCase();

  /* What a day with nothing on it says, which is two different facts wearing one face.
     A day that is genuinely empty is nothing due. A day the choice has emptied is not
     empty at all — it is holding things that were not asked for, and saying "nothing
     due" of a Monday with three doses on it would be the filter telling a lie about the
     record.

     The second used to read "Nothing of these kinds", which pointed at a word only the
     sheet uses — and the sheet is shut by the time anyone reads this. So it names the
     choice instead: "No blood pressure" says what is missing in three words, in the same
     words the note under the masthead is using, and needs nothing on screen to be
     understood. Reachable only with a choice standing, since with none every entry is
     shown and a day holding entries cannot come up empty. */
  function nothingHere(d){
    if (!d.events.length) return "Nothing due";
    return `No ${andList(KINDS.filter(k => kindsOn.has(k.key)).map(k => lower(k.label)), "or")}`;
  }

  /* A part of the ledger that looks like the whole of it is a trap: entries are missing
     and nothing on the page says why. The sheet is put away the moment it has been used,
     so it cannot be what says so — a note stands under the masthead for as long as the
     choice does, saying what was asked for, with the way back to everything beside it.

     It names what is being shown, always, and never what is being left out. The note used
     to say whichever of those was the shorter sentence — four kinds on came out as
     "Everything but notes" — which was fewer words and the wrong ones. A filter is a thing
     you asked for, and the answer to "what am I looking at" is the list you asked for, not
     a list of what you did not. Said the other way round it has to be turned back round in
     the head before it means anything, every time it is read.

     The cost is length: naming what is shown can run to four kinds where naming what is
     not never ran past two. So it is not a sentence any more, it is a list — commas, no
     "and", no "only". Those three words cost about fifty pixels between them and bought
     nothing the bar was not already saying: it is only on screen while a choice is in
     force, and Clear is sitting next to it. Dropped, the note holds its kinds in words
     across 28 of the 30 choices that can be made instead of 24 — every choice of three,
     which the longer phrasing could not manage, and three of the five of four.

     For the two that still will not fit, it carries the same list twice — once in words
     with each kind's mark leading it, once as the marks alone — and shows whichever fits.
     Which one that is cannot be decided here. It depends on the words, the frame and the
     type, so it is measured on the element after it is drawn; see draw(). Counting the
     kinds was the obvious rule and the wrong one — three short names fit the bar where
     three long ones do not.

     The marks can stand in for the words because they are not decoration: they are the
     same marks the entries below are carrying, so the row is read off the ledger rather
     than learned. What they cannot do is be heard — glyph() hides them from a reader —
     so the words are never removed, only taken off the screen, and the note says the
     same sentence out loud whichever way it is being shown.

     The way out is the word the sheet uses for the same act, so one thing is called one
     thing wherever it is reached from — the note says what the choice is, and Clear is
     what is done to it. */
  function filterNote(){
    const on = KINDS.filter(k => kindsOn.has(k.key));
    const words = on.map(k => `<span class="fkind">${glyph(k.mark)}${k.label}</span>`).join(", ");
    const marks = on.map(k => glyph(k.mark)).join("");
    return `<div class="fbar">
      <span class="ftext"><span class="fsay">${words}</span
        ><span class="fmarks" aria-hidden="true">${marks}</span></span>
      <button class="fclear" data-kind-all
              aria-label="Clear — show everything">Clear</button>
    </div>`;
  }

  function calendar(){
    const cells = [];
    for (let i = 0; i < MONTH.firstDow; i++) cells.push(`<span class="cell pad"></span>`);
    for (let date = 1; date <= MONTH.days; date++){
      const di = dayIndexFor(date);
      const has = di >= 0 && (showFuture() || futureMode === "edge" || di <= NOW.day);
      /* Through the same filter the ledger reads, or the month marks a day for something
         missed that the page it jumps to is not showing. */
      const late = has && DAYS[di].events.some(e => shown(e) && state(di, e) === "late");
      const isToday = has && di === NOW.day;
      const isOpen = has && di === open && view === "day";
      cells.push(has
        ? `<button class="cell${isOpen ? " on" : ""}${isToday ? " today" : ""}" data-jump="${di}"
             aria-label="${DAYS[di].label}${late ? ", has something missed" : ""}">
             ${date}<i class="${late ? "" : "void"}"></i></button>`
        : `<span class="cell off">${date}<i class="void"></i></span>`);
    }
    return `<section class="cal" aria-label="Choose a day">
      <header class="calhead">
        <span class="calmonth">${MONTH.label}</span>
        <span class="calnav">
          <button class="navicon sm" aria-label="Previous month" disabled>${s24(NAV.chev)}</button>
          <button class="navicon sm" aria-label="Next month" disabled>${s24(NAV.chev)}</button>
        </span>
      </header>
      <div class="calgrid dows">${DOW.map(d => `<span class="dow">${d}</span>`).join("")}</div>
      <div class="calgrid">${cells.join("")}</div>
    </section>`;
  }

  /* ═════════ the shell ═════════ */
  /* The destinations, named in this brand's vocabulary: the run of days is a Ledger
     rather than a Timeline, and the register of medicines is the Cabinet. */
  /* Routines sits with the Cabinet rather than down in Settings, because it is the same
     kind of thing: a standing register the two day views are drawn from, not a
     preference about how they look. The Cabinet says what is being taken, Routines says
     when — between them they are the whole of the plan.
     Both sit below the divider: above it are the two views of the days themselves, which
     is what the app is opened to look at; below are the registers behind them and the
     rest. `split` marks where that line falls, so the order and the grouping are stated
     in one place. */
  const DEST = [
    { key:"timeline",  label:"Ledger",   icon:"line" },
    { key:"day",       label:"Day",      icon:"grid" },
    { key:"medicines", label:"Cabinet",  icon:"pill",   split:true },
    { key:"routines",  label:"Routines", icon:"clock" }
  ];
  const REST = [
    { label:"History",  icon:"chart" },
    { label:"Settings", icon:"cog" }
  ];

  /* ── routing ──
     The hash holds everything that counts as a page, so each one has an address:
       #/timeline  #/day  #/medicines  #/routines  the destinations
       #/day/event/2/3                             a moment, opened from a view
       #/medicines/Metformin                       a medicine, opened from the cabinet
       …/edit                                      either of those, being changed
       #/timeline/record/Weight                    a reading being written
       #/timeline/record/Blood pressure/2/6        …into an entry the day already holds
       #/timeline/dose                             the cabinet, as something to take from
     Routines has no address below itself: it is edited in place, so there is no second
     page for a single routine to be at.
     A hash rather than a path, so it works opened from disk or any static server, and
     each prototype file keeps its own set. Anything unknown falls back to the ledger,
     and a page that no longer exists to the view it was opened from. */
  const known = name =>
    !!DRUGS[name] || !!READINGS[name] || DAYS.some(d => d.events.some(x => x.name === name));

  function parse(hash){
    const [v, ...rest] = hash.replace(/^#\/?/, "").split("/").map(decodeURIComponent);
    const to = DEST.some(x => x.key === v) ? v : "timeline";
    let page = null, rec = null, dose = false, used = 0;
    if (rest[0] === "dose"){
      dose = true;
    } else if (rest[0] === "record"){
      /* The day and index are optional, and only honoured when they still name an
         entry: a bookmarked address outlives the ledger it was taken from, and filling
         in something that is no longer there should record a new one rather than fail. */
      const name = rest[1], d = +rest[2], i = +rest[3];
      if (name && known(name))
        rec = DAYS[d] && DAYS[d].events[i] ? { name, d, i } : { name };
    } else if (rest[0] === "event"){
      const d = +rest[1], i = +rest[2];
      if (DAYS[d] && DAYS[d].events[i]) page = { d, i };
      used = 3;
    } else if (rest[0] && known(rest[0])){
      page = { name:rest[0] };
      used = 1;
    }
    return { view:to, detail:page, record:rec, dose, editing:!!page && rest[used] === "edit" };
  }

  function pathOf(to, page, edit){
    let p = to;
    if (page) p += page.d != null ? `/event/${page.d}/${page.i}` : `/${encodeURIComponent(page.name)}`;
    if (page && edit) p += "/edit";
    return p;
  }

  const recordPath = (to, name, fill) =>
    `${to}/record/${encodeURIComponent(name)}` + (fill ? `/${fill.d}/${fill.i}` : ``);

  /* Something has just been filed; put the view where it landed, so the entry is not
     recorded somewhere the user is then left having to go and find. */
  function reveal(){
    open = logDay;
    if (view === "timeline") scrollTimelineTo(logDay, false);
  }

  /* The day survives the switch. Going to the ledger it has to be scrolled to,
     since the ledger holds every day at once and would otherwise open at the top
     — and the spy would then rename the title to whatever that first day is. */
  function show(to){
    const keep = open;
    view = to;
    draw();
    if (view === "timeline") scrollTimelineTo(keep, false);
    else { open = keep; draw(); }
  }

  /* The same move the view switch makes, for the same reason. Changing what is shown
     rewrites the ledger under the scroll, so the offset it was left at stops meaning
     anything: the same number of pixels down a shorter run of days is a different place,
     and asking for one kind of four can put it past the end of the scroll altogether, which
     is how a filter ends up showing a screen of blank paper. The day is what the user
     was actually looking at, so the day is what is kept. */
  function refilter(){
    const keep = open;
    draw();
    if (view === "timeline") scrollTimelineTo(keep, false);
  }

  /* Read the address into the state and draw it. Entering edit takes up the current
     name, the same as the edit button always did. */
  function route(){
    const r = parse(location.hash);
    const wasEditing = editing;
    detail = r.detail;
    editing = r.editing;
    if (editing && !wasEditing) editName = detailEvent().name;
    drawn = false;
    /* a sheet belongs to the page it was raised from, so walking off the page closes it
       rather than leaving it to reappear when you come back. The choice itself survives:
       it is what the ledger is showing, not a sheet, and walking into an entry and back
       out should not quietly return the whole week. */
    rtOpen = null;
    sheet = false;
    picking = false;
    /* leaving edit is the same move — the sheet sets a field on a page that has gone */
    fieldOpen = null;
    custOpen = null;
    lookOpen = false;
    dosing = r.dose;
    /* The record page takes up its figures when you arrive at it and holds them while
       you are on it, the same way entering edit takes up the name. Keyed on the address
       rather than on the name, so landing on the same reading twice starts over rather
       than resuming an attempt that was walked away from. */
    const rp = r.record ? recordPath(r.view, r.record.name, r.record.d != null ? r.record : null) : null;
    if (rp !== padPath){ padPath = rp; rp ? seedPad(r.record) : clearPad(); }
    if (r.view !== view) show(r.view);
    else draw();
  }

  /* Every page change goes through here. Each entry remembers where it came from, so
     going back up can be the browser's own back when that is where it leads — the
     history then reads the way the user walked it, with no doubled entries. */
  /* the page the address actually shows, so a bare or stale address compares as the
     page it falls back to */
  const here = () => { const r = parse(location.hash); return pathOf(r.view, r.detail, r.editing); };

  function go(path, replace){
    /* a replaced entry still came from wherever the one it replaces came from */
    const from = replace ? history.state && history.state.from : here();
    if (location.hash !== "#/" + path)
      history[replace ? "replaceState" : "pushState"]({ from }, "", "#/" + path);
    route();
  }

  function up(parent){
    if (history.state && history.state.from === parent) history.back();
    else go(parent, true);
  }

  /* back, forward, and an address typed by hand */
  addEventListener("popstate", route);

  function drawer(){
    return `<div class="scrim js-close"></div>
      <nav class="drawer" aria-label="Main navigation" ${drawn ? "" : `aria-hidden="true"`}>
        <p class="dtitle">Health</p>
        ${DEST.map(x => `${x.split ? `<div class="dsplit"></div>` : ``}
          <button class="ditem${view === x.key ? " on" : ""}" data-view="${x.key}"
            ${view === x.key ? `aria-current="page"` : ``}>${s24(NAV[x.icon])}${x.label}</button>`).join("")}
        ${REST.map(x => `<button class="ditem off" disabled>${s24(NAV[x.icon])}${x.label}</button>`).join("")}
      </nav>`;
  }

  /* Both views name the day they are showing. The day view knows it outright; the
     ledger has to work it out from where it has been scrolled to. */
  const titleFor = () => open === NOW.day ? "Today" : DAYS[open].label;

  /* Which day the ledger is currently over — the last one whose heading has passed
     under the masthead. Updated in place rather than by redrawing, since redrawing
     mid-scroll would fight the scroll it is reacting to. */
  /* What is pinned at the top of the ledger: the masthead, the note the filter leaves
     under it, and the month when it has dropped. Everything that parks something at "the
     top" measures from here, because the top of the scroll is not the top of what can be
     seen — measured off the bar alone, a day scrolled to the top with the note in place
     parks 36px up, behind it. The kinds sheet is not in this list and does not belong in
     it: it floats over the page rather than standing in the scroll, so it displaces
     nothing and nothing is parked under it. */
  const PINNED = [".appbar", ".fbar", ".cal"];
  const topInset = () => {
    const h = PINNED.reduce((n, sel) => {
      const el = document.querySelector(sel);
      return n + (el ? el.offsetHeight : 0);
    }, 0);
    return h || 64;
  };

  function spyTimeline(){
    const body = document.querySelector(".body");
    if (!body) return;
    const line = topInset() + 8;
    const top = body.getBoundingClientRect().top;
    let cur = null;
    document.querySelectorAll("[data-daymark]").forEach(el => {
      if (el.getBoundingClientRect().top - top <= line) cur = +el.dataset.daymark;
    });
    if (cur === null) return;
    open = cur;
    const label = document.querySelector(".titlebtn span");
    if (label) label.textContent = titleFor();
  }

  /* The air left above the now line when the ledger parks on it. Measuring it and
     scrolling to it are two different functions, and the figure has to be the same in
     both or the line parks somewhere the run-out was not sized for. */
  const NOW_INSET = 16;

  /* The clearance the record button needs, read back from the stylesheet that sets it
     beside the button itself — so the run-out computed here cannot drift from the
     padding the other views take from the same figure. */
  function fabClear(){
    const ph = document.querySelector(".phone");
    const v = ph && parseFloat(getComputedStyle(ph).getPropertyValue("--fab-clear"));
    return v || 96;
  }

  /* Size the run-out so the now line can reach its parked position: whatever the screen
     has left once the content below the line is accounted for. */
  function sizeTail(){
    if (view !== "timeline") return;
    const body = document.querySelector(".body");
    const mark = document.querySelector(".nowedge");
    const tail = document.querySelector(".tail");
    if (!body || !mark || !tail) return;
    tail.style.height = "0px";
    const barH = topInset();
    const top = body.getBoundingClientRect().top;
    const offsetOf = el => el.getBoundingClientRect().top - top + body.scrollTop;
    /* Where the content ends, which is not body.scrollHeight: a scroller reports at
       least its own client height, so a ledger shorter than the screen measures as a
       full screen and the run-out comes out exactly that much short — the now line then
       cannot be scrolled up to the place this function just sized the paper for. An
       unfiltered week is always taller than the screen, which is why that never showed;
       a filtered one often is not. The run-out is the last thing in the scroll, so with
       it flattened its own top is where the content ends, whatever the scroller says. */
    const H = offsetOf(tail);

    /* Two things have to be able to reach the top of the screen: the now line, where the
       ledger parks, and the last day, which the calendar can jump to. Sizing only for
       the now line left the final day unable to scroll up far enough — so it never
       crossed the line the title watches, and the bar kept naming the day before it. */
    let need = body.clientHeight - (barH + NOW_INSET) - (H - offsetOf(mark));
    const marks = document.querySelectorAll("[data-daymark]");
    const last = marks[marks.length - 1];
    if (last) need = Math.max(need, body.clientHeight - barH - (H - offsetOf(last)));

    /* A long ledger needs no run-out to park on, but it still needs to get its last row
       out from under the button — so the floor is the clearance, not zero. */
    tail.style.height = Math.max(fabClear(), need) + "px";
  }

  /* Put a day at the top of the ledger. Today is special: its meaningful position is
     the now line rather than the start of the day, which is where it parks on load. */
  function scrollTimelineTo(di, animate){
    const body = document.querySelector(".body");
    if (!body) return;
    const barH = topInset();
    const anchor = di === NOW.day
      ? document.querySelector(".nowedge")
      : document.querySelector(`[data-daymark="${di}"]`);
    if (!anchor) return;
    const inset = di === NOW.day ? barH + NOW_INSET : barH;
    const y = anchor.getBoundingClientRect().top - body.getBoundingClientRect().top
            + body.scrollTop - inset;
    if (animate && body.scrollTo) body.scrollTo({ top:Math.max(0, y), behavior:"smooth" });
    else body.scrollTop = Math.max(0, y);
    open = di;
    const label = document.querySelector(".titlebtn span");
    if (label) label.textContent = titleFor();
  }

  function watchTimeline(){
    if (view !== "timeline") return;
    const body = document.querySelector(".body");
    if (!body || !body.addEventListener) return;
    let queued = false;
    body.addEventListener("scroll", () => {
      if (queued) return;
      queued = true;
      requestAnimationFrame(() => { queued = false; spyTimeline(); });
    }, { passive:true });
    spyTimeline();
  }

  /* ═════════ the detail page ═════════
     Everything on it is derived from the same DAYS the two views read, so the history is
     the real history — the days this medicine was taken, and the days it was missed. */
  function historyOf(name){
    const out = [];
    /* A dose that has not come due yet is not history — it would read as a gap in the
       record when nothing has gone wrong. Walk back from today taking only what has
       actually happened or has actually been missed. */
    for (let di = NOW.day; di >= 0 && out.length < 5; di--){
      DAYS[di].events.forEach(e => {
        if (e.name !== name || e.kind === "note") return;
        const past = di < NOW.day || atOf(di, e) < NOW.at;
        if (!e.logged && !past) return;
        out.push({
          day: di === NOW.day ? "Today" : DAYS[di].label,
          at: e.logged || `missed · ${fmt(atOf(di, e))}`,
          value: e.value || "",
          done: !!e.logged
        });
      });
    }
    return out.slice(0, 5);
  }

  /* the soonest occurrence still ahead — missed ones are behind you and already
     accounted for in the history */
  function nextOf(name){
    for (let di = NOW.day; di < DAYS.length; di++){
      const found = DAYS[di].events
        .filter(x => x.name === name && !x.logged && (di > NOW.day || atOf(di, x) >= NOW.at))
        .sort((a, b) => atOf(di, a) - atOf(di, b))[0];
      if (found) return { di, e:found };
    }
    return null;
  }

  /* what this thing is called when it happens */
  function occurrenceWord(name, drug){
    if (drug) return "dose";
    /* the register knows, now that there is one — the guess below is only for something
       that turned up in the data without being registered */
    if (READINGS[name]) return READINGS[name].kind === "test" ? "test" : "reading";
    const records = DAYS.some(d => d.events.some(x => x.name === name && x.value));
    return records ? "reading" : "test";
  }

  /* The page is reached two ways. A moment on a day names an actual occurrence, and
     that is what should be shown. The cabinet names only the medicine — so the nearest
     occurrence stands in for it, and a medicine with none at all gets a stand-in, which
     is what lets something just added have a page before it has a schedule. */
  function detailEvent(){
    if (detail.d != null) return DAYS[detail.d].events[detail.i];
    const nx = nextOf(detail.name);
    if (nx) return nx.e;
    for (let di = DAYS.length - 1; di >= 0; di--){
      const found = DAYS[di].events.find(x => x.name === detail.name);
      if (found) return found;
    }
    return { name:detail.name, shape:SHAPE_OF[detail.name] || "grey", at:NOW.at, logged:null };
  }

  /* One of the directions, while the page is being changed. Set, it is the value; unset,
     it is the field's own name behind a plus. The two read differently on purpose — one
     is a thing to change and one is a thing to add — but both are the same control and
     both open the same sheet.

     No mark saying so. A chevron was tried and taken off: six chips in a 347px column
     are already two rows, and a glyph repeated on every one of them is paid for six
     times over to say a thing the page has said once at the top. What is left to say it
     is the tint the live chip carries — the only filled chip in the app — and the page
     it is on, which is wearing Editing in the masthead, a rule under the name, and a
     Save. A chip in that company does not need its own badge. */
  function chipFor(f, drug){
    const spec = EDIT_FIELDS[f], q = f.replace(/"/g, "&quot;");
    const said = spec.label.toLowerCase();
    const up = ` aria-haspopup="dialog" aria-expanded="${fieldOpen === f}"`;
    /* The chip says the value and the label is said only to a reader, because the value
       on its own is what the page needs to read as a line of directions — "1, 500 mg,
       tablet, twice a day" and not a form with six captions down the side of it. Which
       is also what the reader's label is for: met one at a time rather than as a row,
       the bare count is the one that would not survive losing the ones either side. */
    const shown = says(f, valueOf(f, drug));
    /* the hour's own ink, for the one chip that holds one — see timedInk */
    const ink = timedInk(f, drug);
    return shown
      ? `<button class="chip live${ink ? " timed" : ""}" data-field="${q}"${up}${
                 ink ? ` style="${ink}"` : ``}
                 aria-label="${said} — ${shown}">${shown}</button>`
      : `<button class="chip add" data-field="${q}"${up}
                 aria-label="Set ${said}">+ ${spec.add}</button>`;
  }

  /* The chip has to carry its new answer while the sheet is still on its way down. A
     redraw cannot run until the sheet has finished leaving — it would throw away the
     element that is doing the leaving — so waiting for one means the page sits showing
     the answer you just replaced for the length of the slide and then snaps to the new
     one as the sheet lands. The one chip that changed is rewritten where it stands
     instead: the same move the routine sheet makes for the clock face beside the hour
     being typed into it, and for the same reason. */
  function paintChip(f, drug){
    const el = document.querySelector(`.chip[data-field="${f}"]`);
    if (el) el.outerHTML = chipFor(f, drug);
  }

  /* The whole row, for the one answer that changes which chips there are. Putting a
     medicine on "as needed" takes the When chip away with it, and that has to happen
     now rather than when the sheet has finished leaving — otherwise a chip offering to
     set an hour sits on the page for the length of the slide, on a medicine that has
     just been told it has no hour. */
  function paintDirections(drug){
    const host = document.querySelector(".js-dirs");
    if (host) host.innerHTML = DIRECTIONS.filter(f => shows(f, drug))
      .map(f => chipFor(f, drug)).join("");
  }

  /* What the chip marked Custom or Range turns the sheet into. The answers it was
     standing among do not come with it: a sheet showing six strengths above a box for a
     seventh is asking two questions at once, and the box is the one that was asked for.
     So the sheet changes what it is about rather than growing a second half, and the way
     back to the answers is a control at the foot, the way the filter's Done is.

     Typed answers are written as they are typed, the same as the routine sheet's clock
     and for the same reason — there is no Save on this sheet to hold them back, and the
     page's own Save is what commits the lot. Which also means no redraw can run while
     the caret is in a box, so the chip on the page behind is moved by hand. */
  function customEntry(cust, now, drug){
    if (cust.kind === "range"){
      const { a, b } = splitRange(now);
      /* The second box is allowed to be empty, and is whenever the way in was taken for
         a count rather than a span. Empty, the dash is still drawn — it is what says the
         box to its right is for the other end of something. */
      return `<div class="ocust">
        <span class="fline orange">
          <input class="fnum clock js-cust-a" inputmode="numeric" maxlength="2"
                 value="${a}" placeholder="—" aria-label="How many, or the fewest">
          <span class="fsep" aria-hidden="true">–</span>
          <input class="fnum clock js-cust-b" inputmode="numeric" maxlength="2"
                 value="${b}" placeholder="—" aria-label="The most, if it is a range">
        </span>
      </div>`;
    }

    if (cust.kind === "clock"){
      /* The same two boxes on the same rule as the range, with a colon instead of a
         dash — which is the whole of the difference between a span and an hour, and
         exactly the difference the record page and the routine sheet already draw.

         One rule per time, and the rules are where the count is set. Adding one is how
         a medicine becomes a twice-a-day medicine: the frequency chip two to the left
         says so a moment later, because it is reading the same number. That is the
         right way round. How many times a day you take something is a thing you know by
         listing them — a frequency is a summary of the hours, not a quota they have to
         be fitted into — and asking for the count first and the hours afterwards was
         asking for the summary before the thing it summarises.

         No numbering on the rules. They are an ordered list of hours read top to bottom,
         and a column of them says so without being told; the minus at the end of each is
         what says they can be taken apart. The first cannot be removed, because a
         medicine kept by the clock is kept by at least one hour — but its slot is held
         open all the same, so the rules do not shift sideways when a second arrives.

         ── how far apart they are ──
         What a column of hours is actually about is the distance between them. "Six
         hours apart" is the instruction a pharmacist gives and the thing a body cares
         about; 08:00, 14:00 and 20:00 is that instruction worked out, and reading it
         back the other way means doing the arithmetic. So the arithmetic is printed,
         small, under the column it describes.

         One of them, for the whole stack. There was a figure in every space for a
         while, each moving the hours below it — which could say more, and the more it
         could say was a day with uneven gaps in it, which is not a thing anybody sets
         out to ask for. One number is the question actually being asked, and setting
         it lays the hours out at that distance from the first: the day keeps the hour
         it starts at and opens out or closes up beneath.

         It stands empty when the hours are not evenly spaced, because then there is no
         one number that is true of them — and typing one is how you make them even. */
      const n = timesWanted(drug);
      const ord = i => n === 1 ? "" : ` of time ${i + 1}`;
      const times = splitTimes(now, n);
      /* Hours, because that is the unit the instruction comes in. Trimmed rather than
         padded — six hours is "6h" and not "6.00h" — and allowed a decimal for the
         distances that hand-typed hours leave behind, which are the only ones that are
         not whole: every spread this app lays out divides the day into round hours. */
      const apart = commonGap(times.map(t => t.h === "" ? null : toMin(`${t.h}:${t.m}`)));
      return `<div class="ocust">
        ${times.map((t, i) => `<div class="otime">
          <span class="fline orange">
            <input class="fnum clock js-cust-h" inputmode="numeric" maxlength="2"
                   value="${t.h}" placeholder="—" aria-label="Hour${ord(i)}">
            <span class="fsep" aria-hidden="true">:</span>
            <input class="fnum clock js-cust-m" inputmode="numeric" maxlength="2"
                   value="${t.m}" placeholder="—" aria-label="Minute${ord(i)}">
          </span>
          <span class="odrop">${n > 1
            ? `<button class="odropb" data-drop-time="${i}"
                 aria-label="Remove the ${ORDINALS[i] || `${i + 1}th`} time">${MINUS}</button>`
            : ``}</span>
        </div>`).join("")}
        ${n > 1 ? `<div class="ogap">
          <input class="js-cust-gap" inputmode="decimal" maxlength="4" placeholder="—"
                 value="${apart == null ? `` : +(apart / 60).toFixed(2)}"
                 aria-label="Hours between each time">
          <span aria-hidden="true">h apart</span>
        </div>` : ``}
        ${n < TIMES_A_DAY.length
          ? `<button class="oadd" data-add-time>${PLUS}Add a time</button>`
          : ``}
      </div>`;
    }

    /* A span and a strength are written the same way — a figure on a rule with what it
       is counted in beneath — because they are the same act. The word in front of the
       figure is all that differs, and a span wants one: "3 days" is a length of time
       and "every 3 days" is a schedule, and the sheet is asking for the second. */
    const span = cust.kind === "interval";
    const { n, u } = span ? splitEvery(now) : splitAmount(now);
    /* A unit already in use stands in the row even if it is not one of the offered ones,
       for the reason an unlisted answer is prepended to a list that has no way in: the
       sheet has to be able to show what is true before it offers to change it. */
    const units = u && !cust.units.includes(u) ? [u, ...cust.units] : cust.units;
    return `<div class="ocust">
      <span class="fline">
        ${span ? `<span class="oevery" aria-hidden="true">every</span>` : ``}
        <input class="fnum js-cust-n" inputmode="${span ? "numeric" : "decimal"}"
               maxlength="${span ? 2 : 7}"
               value="${n}" placeholder="—" aria-label="${span ? "How many" : "How much"}">
      </span>
      <div class="ounits">${units.map(x => `<button class="ochip${x === u ? " on" : ""}"
        data-unit="${x.replace(/"/g, "&quot;")}" aria-pressed="${x === u}">${x}</button>`).join("")}</div>
    </div>`;
  }

  /* ── the sheet that sets one ──
     The log sheet's furniture again, for the log sheet's reason: the app has one kind of
     paper that comes up over a page, and choosing what a field says is exactly the thing
     that comes up, is worked, and is put away.

     Picking is a single choice, so a tap both sets the value and closes the sheet — the
     way a medicine is filed by being named in the record sheet.

     A way in is the sheet's other state rather than more of this one, and what says you
     are a step in is the foot, which the outer state does not have: Back to the answers,
     Done to put the sheet away. Neither commits anything; both are only ways out, the
     same as the filter's Done. Typing has nothing to close on, and ticking several
     occasions is not finished by any one of them — those are the two states that need
     a Done, and they are both inside a way in. */
  function fieldSheet(){
    if (!fieldOpen || !editing) return "";
    const drug = DRUGS[detailEvent().name];
    const spec = drug && EDIT_FIELDS[fieldOpen];
    if (!spec) return "";
    const groups = spec.groups || [{ ...spec, key:fieldOpen }];
    const paper = body => `<div class="sheetscrim js-fshut"></div>
      <div class="logsheet fsheet${spec.counts ? " counts" : ""}"
           role="dialog" aria-modal="true" aria-label="${spec.label}">
        <span class="grab"></span>
        <h2 class="sheeth">${spec.label}</h2>
        ${body}
      </div>`;

    /* The answers a band offers, as chips. One band holds them all however many groups
       contribute — a sheet asking how often is asking one question, and ruling a line
       through it to separate the counts from the way past them would be turning an
       answer into a form. Which key each chip writes is carried on the chip, since the
       band is no longer necessarily about the field whose chip raised the sheet. */
    const chipsOf = (g, answers, held) => {
      /* The answer itself is the whole chip. A reader meeting a bare "1" gets the field
         from the dialog it is in, which is labelled with the heading above it. */
      const chip = (val, said, extra) => {
        const on = val == null ? !held.length : held.includes(val);
        const q = (val == null ? "" : String(val)).replace(/"/g, "&quot;");
        return `<button class="ochip${on ? " on" : ""}${extra || ""}"
                  data-opt="${q}" data-key="${g.key}"
                  aria-pressed="${on}">${said || says(g.key, val)}</button>`;
      };
      return { chip, html:answers.map(v => chip(v)).join("") };
    };

    /* The week, along a line. Seven initials in the order the week runs, which is an
       order nobody has to be told — and that order is what carries the two letters
       that repeat, since position is the only thing telling Tuesday from Thursday and
       Saturday from Sunday. The full name goes to a reader, where there is no row to
       count along. Set as a whole, it is the shape of the thing being chosen: a week
       read at a glance rather than a list read down. */
    const weekOf = (w, held) => `<div class="oweek" role="group" aria-label="Which days">${
      optsOf(w).map(v => {
        const d = WEEKDAYS.find(x => "d:" + x.k === v) || {};
        const on = held.includes(v);
        return `<button class="oday${on ? " on" : ""}" data-opt="${v}" data-key="${w.key}"
                  aria-pressed="${on}" aria-label="${d.name || v}">${d.letter || "?"}</button>`;
      }).join("")
    }</div>`;

    /* A register, ticked down a column. The filter's rows exactly — same ruled square,
       same tick arriving on hover, same hover running wider than the text — with the
       hour where the filter puts its mark, in the ink that hour wears everywhere. The
       whole row is the control, so the box takes no events of its own.

       The hour is what an occasion has and a weekday has not: Monday is not a time of
       day and the column it would stand in is left empty rather than filled with
       something to make the two lists match. */
    const rowsOf = (w, held) => `<div class="kinds">${optsOf(w).map(v => {
      const { name, at } = w.row(v);
      const on = held.includes(v);
      const q = v.replace(/"/g, "&quot;"), said = name.replace(/"/g, "&quot;");
      return `<button class="krow${on ? " on" : ""}" data-opt="${q}" data-key="${w.key}"
                aria-pressed="${on}" aria-label="${said}${at == null ? `` : `, ${fmt(at)}`}">
        <span class="box${on ? " on" : ""}" aria-hidden="true">${TICK}</span>
        <span class="rtname">${name}</span>
        ${at == null ? `` :
          `<span class="rttime" style="color:${timeInk(at)}">${fmt(at)}</span>`}
      </button>`;
    }).join("")}</div>`;

    /* A way in, opened. A list to tick, a week to tick, or boxes to type in — the only
       difference the sheet makes between its kinds. */
    const open = waysOf(fieldOpen).find(w => w.id === custOpen);
    if (open)
      return paper(`${
          open.kind === "rows" ? rowsOf(open, listOf(drug[open.key]))
        : open.kind === "week" ? weekOf(open, listOf(drug[open.key]))
        : customEntry(open, drug[open.key] || null, drug)}
        <div class="kfoot">
          <button class="kclear js-cust-back"
                  aria-label="Back to the answers">Back</button>
          <button class="kdone js-fshut">Done</button>
        </div>`);

    /* The outer state: the answers that are answers, then a dashed chip for every way
       in, then the way back to nothing. */
    const ways = waysOf(fieldOpen);
    const band = groups.filter(g => !g.shown || g.shown(drug)).map(g => {
      const now = (g.now ? g.now(drug) : drug[g.key]) || null;
      const answers = optsOf(g);
      /* Several answers are all offered or none of them are: a list holding occasions
         is a listed answer and a list holding hours is a written one, and there is no
         third case because the two kinds are never mixed. */
      const held = g.multi ? listOf(now) : (now == null ? [] : [now]);
      /* `base` is an answer that is held without being offered — every day, which is
         what a medicine does when nobody has said otherwise. Listed, so the way in
         stays a dashed doorway rather than lighting up for the absence of a span. */
      const listed = !held.length || held.every(x => x === g.base || answers.includes(x));
      /* An answer the sheet does not offer has to show somewhere, or the sheet is lying
         about the page behind it. Where depends on whether there is a way in: with one,
         the lit way in says it is a written answer and what is behind it says which, so
         putting it among the answers too would be the same thing said twice. Without
         one, standing it at the head of the band is the only place there is. */
      const mine = ways.filter(w => w.key === g.key);
      const shownOpts = listed || mine.length ? answers : [now, ...answers];
      const { chip, html } = chipsOf(g, shownOpts, held);
      return html
        + mine.map(w => {
            const on = wayHolds(w, drug, g);
            return `<button class="ochip own${on ? " on" : ""}" data-cust="${w.id}"
                      aria-pressed="${on}" aria-expanded="false">${w.label}</button>`;
          }).join("")
        + (g.clear ? chip(null, g.clear, " none") : ``);
    }).join("");
    return paper(`<div class="ochips">${band}</div>`);
  }

  /* The hours as the rules currently stand, in rule order, with the unfilled ones left
     as holes rather than dropped — the distance is measured between neighbouring rules
     and a hole has to stay a hole or the rule after it would be measured from the wrong
     place. Read off the screen rather than out of the register for the same reason the
     dropping does: an hour half typed is on one and not the other. */
  function ruleMins(){
    const hs = [...document.querySelectorAll(".ocust .js-cust-h")];
    const ms = [...document.querySelectorAll(".ocust .js-cust-m")];
    return hs.map((h, i) => {
      const v = joinClock(h.value.replace(/\D/g, ""),
                          ms[i] ? ms[i].value.replace(/\D/g, "") : "");
      return v ? toMin(v) : null;
    });
  }

  /* The one distance that is true of a whole column of hours, or nothing where there
     is none: a hole in the column has no distance to anything, and hours that are not
     evenly spaced have several. */
  function commonGap(mins){
    if (mins.length < 2 || mins.some(m => m == null)) return null;
    const g = (mins[1] - mins[0] + 1440) % 1440;
    for (let i = 2; i < mins.length; i++)
      if ((mins[i] - mins[i - 1] + 1440) % 1440 !== g) return null;
    return g;
  }

  /* The distance, rewritten from the hours as they stand. Typing an hour can make a
     column even or stop it being even, and neither can wait for a redraw that will not
     come until the caret has left the box. Safe to write: the box being typed into is
     the distance itself, and that does not come through here. */
  function paintGaps(){
    const el = document.querySelector(".ocust .js-cust-gap");
    if (!el) return;
    const g = commonGap(ruleMins());
    el.value = g == null ? "" : +(g / 60).toFixed(2);
  }

  /* Setting the distance lays the whole column out at it, counting from the first hour
     — which is the only one that cannot move, since it is what the rest are measured
     from. The day keeps the hour it starts at and opens out or closes up beneath.

     It fills the holes as it goes. A rule left empty has no hour of its own to keep,
     and saying every dose is five hours after the last is an answer for all of them.

     Written where they stand rather than redrawn, because the caret is in the box being
     typed into and a redraw would take it. The distance box itself is left alone — it
     holds what was typed, and rewriting it mid-keystroke is how a 1 becomes impossible
     to turn into a 12. */
  function writeGap(el){
    const drug = DRUGS[detailEvent().name];
    const hours = parseFloat(el.value);
    /* nothing, nought, or a day or more is not a distance — the last good one stands */
    if (!drug || !(hours > 0) || hours >= 24) return;
    const mins = ruleMins();
    if (!mins.length || mins[0] == null) return;
    const step = Math.round(hours * 60);
    const hs = [...document.querySelectorAll(".ocust .js-cust-h")];
    const ms = [...document.querySelectorAll(".ocust .js-cust-m")];
    const out = mins.map((_, i) => (mins[0] + i * step) % 1440);
    out.forEach((m, i) => {
      if (!i) return;
      hs[i].value = fmt(m).slice(0, 2);
      ms[i].value = fmt(m).slice(3);
    });
    drug.when = joinTimes(out.map(fmt));
    paintChip("when", drug);
  }

  function writeCustom(){
    const drug = DRUGS[detailEvent().name];
    const way = drug && fieldOpen && waysOf(fieldOpen).find(w => w.id === custOpen);
    if (!way) return;
    const box = sel => { const el = document.querySelector(sel); return el ? el.value : ""; };
    const digits = sel => box(sel).replace(/\D/g, "");
    const kind = way.kind;
    /* Each rule is read as a pair, and the ones that do not yet say an hour are left
       out rather than written as a blank — a medicine with the second of its two times
       still empty is on one time, not on one time and nothing. */
    const clock = () => {
      const hs = [...document.querySelectorAll(".ocust .js-cust-h")];
      const ms = [...document.querySelectorAll(".ocust .js-cust-m")];
      return joinTimes(hs.map((h, i) => joinClock(
        h.value.replace(/\D/g, ""), ms[i] ? ms[i].value.replace(/\D/g, "") : "")));
    };
    const unit = () => (document.querySelector(".ounits .on") || { dataset:{} }).dataset.unit || "";
    const val =
      kind === "range" ? joinRange(digits(".js-cust-a"), digits(".js-cust-b")) :
      kind === "clock" ? clock() :
      kind === "interval" ? joinEvery(digits(".js-cust-n"), unit()) :
      joinAmount((box(".js-cust-n").match(/\d+(?:\.\d+)?/) || [""])[0], unit());
    /* Half-typed is not an answer. An empty box is on the way to something rather than a
       request to have no dose at all, and the last good answer stands until there is a
       new one — which is also the only way back out of a half-typed hour, since the way
       to mean no hour at all is the chip that says so and not an emptied box. */
    if (kind === "clock") paintGaps();
    if (!val) return;
    drug[way.key] = val;
    /* A written span is a schedule, so whatever else the medicine was it is not taken
       as needed any more. Which means it is taken some number of times a day, and the
       count went when as-needed was chosen — so it comes back at once, the same answer
       tapping a count gives. Without it the chip would read "every 4 days" and say
       nothing about how many, which is not a thing a label ever says. */
    if (way.key === "every"){
      drug.asNeeded = false;
      if (!drug.freq) drug.freq = TIMES_A_DAY[0];
      paintDirections(drug);
    } else paintChip(fieldOpen, drug);
  }

  /* ═════════ how it looks, on the edit page ═════════
     The mark beside the name, where it stands on the read-only page, made into the
     control that changes it. Read-only, the glyph follows the name; editing, the pill
     follows the name input, drawn large enough to be seen as a pill and set in a tile with
     the live tint every settable thing on this page wears — so it says it can be
     changed without a caption saying so. It opens a sheet for the reason the chips do.

     After the name rather than before it, which is where the glyph stands on the
     read-only page — so going into edit does not move the mark to the other end. */
  function lookChip(name){
    const L = lookOf(SHAPE_OF[name]);
    return `<button class="lookchip js-look" aria-haspopup="dialog"
        aria-expanded="${lookOpen}" aria-label="Change how it looks — ${lookSaid(L)}">
        ${pill(L.form, L.ink, 40, L.ink2)}</button>`;
  }

  /* ── the sheet ──
     appearance.html's sheet on this app's paper: the pill drawn large, what it is said
     as, then shape and colour as two rails, with the two wells on the colour line when
     the form has two pieces to dye. No Reset: nothing else on the edit page has one,
     and the page's own Cancel is where a visit is undone. */
  function lookBody(L){
    const forms = FORMS.map(f => `<button class="lswatch${f.k === L.form ? " on" : ""}"
        data-lform="${f.k}" aria-pressed="${f.k === L.form}" aria-label="${f.name}">
        ${pill(f.k, L.ink, 62, f.twoTone ? (L.ink2 || "chalk") : L.ink2)}</button>`).join("");
    const twoPiece = !!FORM[L.form].twoTone;
    const onBody = twoPiece && lookPiece === "body";
    const held = onBody ? (L.ink2 || "chalk") : L.ink;
    const inks = INKS.map(c => `<button class="lswatch${c.k === held ? " on" : ""}"
        data-link="${c.k}" aria-pressed="${c.k === held}" aria-label="${c.name}">${inkChip(c.hex)}</button>`).join("");
    const wells = !twoPiece ? `` : `
      <span class="lwells" role="group" aria-label="Which piece">
        <button class="lwell${onBody ? "" : " on"}" data-lpiece="cap" aria-pressed="${!onBody}"
                aria-label="Colour the cap" style="background-color:${INK[L.ink].hex}"></button>
        <button class="lwell${onBody ? " on" : ""}" data-lpiece="body" aria-pressed="${onBody}"
                aria-label="Colour the body" style="background-color:${INK[L.ink2 || "chalk"].hex}"></button>
      </span>`;
    return `<span class="grab"></span>
      <div class="lstage">${pill(L.form, L.ink, 128, L.ink2)}</div>
      <p class="lsaid">${lookFields(L)}</p>
      <h3 class="llab"><span class="llabt">Shape</span></h3>
      <div class="lrail" role="group" aria-label="Shape">${forms}</div>
      <h3 class="llab"><span class="llabt">Colour</span>${wells}</h3>
      <div class="lrail" role="group"
           aria-label="${onBody ? "Body colour" : twoPiece ? "Cap colour" : "Colour"}">${inks}</div>
      <div class="kfoot"><button class="kdone js-lshut">Done</button></div>`;
  }

  function lookSheet(){
    if (!lookOpen || !editing) return "";
    const name = detailEvent().name;
    return `<div class="sheetscrim js-lshut"></div>
      <div class="logsheet lsheet" id="lsheet" role="dialog" aria-modal="true"
           aria-label="How ${name} looks">${lookBody(lookOf(SHAPE_OF[name]))}</div>`;
  }

  /* A rail that scrolls can hide the answer past its edge, which reads as nothing
     chosen — so the lit tile is brought into view, and only when it is out of it. */
  function revealLook(){
    document.querySelectorAll("#lsheet .lrail").forEach(r => {
      const on = r.querySelector(".lswatch.on");
      if (!on) return;
      const a = r.getBoundingClientRect(), b = on.getBoundingClientRect();
      if (b.left >= a.left && b.right <= a.right) return;
      r.scrollLeft += (b.left - a.left) - (a.width - b.width) / 2;
    });
  }

  /* The look is written as it is chosen, the way every chip on this page writes its
     field, and to every dose of the medicine as well as to SHAPE_OF — the ledger reads
     the mark off the dose and the cabinet reads it off the name, and both have to
     change. The sheet is rewritten in place rather than redrawn, so it does not slide
     away and come back on every tap, and the chip behind it is rewritten with it. */
  function setLook(name, L){
    const key = keyOf(L);
    SHAPE_OF[name] = key;
    DAYS.forEach(d => d.events.forEach(x => { if (x.name === name) x.shape = key; }));
    const el = document.getElementById("lsheet");
    if (el){
      const was = [...el.querySelectorAll(".lrail")].map(r => r.scrollLeft);
      el.innerHTML = lookBody(L);
      el.querySelectorAll(".lrail").forEach((r, i) => { if (was[i] != null) r.scrollLeft = was[i]; });
      revealLook();
    }
    const c = document.querySelector(".js-look");
    if (c) c.outerHTML = lookChip(name);
  }

  function detailView(){
    const e = detailEvent();
    const drug = DRUGS[e.name];
    const isReading = !drug && e.kind !== "note";

    /* A reading with nothing recorded yet still needs a line — it is the difference
       between a page that is empty and a page that looks broken. */
    const done = historyOf(e.name).find(h => h.done);
    const sub = drug
      ? [drug.dose, routineName(e)].filter(Boolean).join(" · ")
      : isReading
        ? (e.value ? `Last reading ${e.value}`
          : done ? `Last recorded ${done.day.toLowerCase()} at ${done.at}`
          : `Nothing recorded yet · due ${fmt(e.at)}`)
        : "";

    /* Read-only, the same directions in the same order the edit page sets them in — one
       list, so a field cannot be settable on one page and missing from the other. What
       it drops is only what is not worth saying: see worthSaying, and `quiet`. */
    const chips = drug
      ? DIRECTIONS.filter(f => worthSaying(f, drug)).map(f => {
          const ink = timedInk(f, drug);
          return `<span class="chip${ink ? " timed" : ""}"${ink ? ` style="${ink}"` : ``}
            >${says(f, valueOf(f, drug))}</span>`;
        }).join("")
      : "";

    const log = historyOf(e.name);

    return `<div class="body">
      <header class="appbar">
        <button class="navicon js-back" aria-label="${editing ? "Cancel" : "Go back"}">${s24(NAV.back)}</button>
        <h1 class="bartitle">${editing ? "Editing" : drug ? "Medicine" : isReading ? "Reading" : "Note"}</h1>
        ${editing
          ? `<button class="save js-save">Save</button>`
          : `${drug ? `<button class="navicon js-edit" aria-label="Edit this medicine">${s24(NAV.edit)}</button>` : ``}
             <button class="navicon" aria-label="More options">${s24(NAV.more)}</button>`}
      </header>

      <div class="dhead">
        ${editing
          ? `<div class="dnamerow">
               <input class="dnameinput js-dname" value="${editName.replace(/"/g, "&quot;")}"
                 aria-label="Name" autocomplete="off">${drug ? lookChip(e.name) : ``}</div>`
          : `<h2 class="dname">${e.name}${glyph(e.shape)}</h2>
             ${sub ? `<p class="dsubt">${sub}</p>` : ``}`}
      </div>


      ${!editing ? (() => {
        const word = occurrenceWord(e.name, drug);
        const nx = nextOf(e.name);
        return `<section class="panel"><h3>Next ${word}</h3>
          ${nx
            ? `<div class="nextrow">${sunmoon(atOf(nx.di, nx.e))}
                 <span class="next-when">${nx.di === NOW.day ? "Today" : DAYS[nx.di].label}
                   · ${fmt(atOf(nx.di, nx.e))}</span>
                 ${routineName(nx.e) ? `<span class="next-rt">${routineName(nx.e)}</span>` : ``}
               </div>`
            : `<p class="none">Nothing scheduled</p>`}
        </section>`;
      })() : ``}

      ${drug ? `<section class="panel"><h3>How to take it</h3><div class="chips js-dirs">${
        editing
          ? DIRECTIONS.filter(f => shows(f, drug))
              .map(f => chipFor(f, drug)).join("")
          : chips}</div></section>` : ``}
      ${drug && (drug.supply || editing) ? `<section class="panel"><h3>What is left</h3>
        <div class="chips">${editing
          ? chipFor("supply", drug)
          : `<span class="chip">${drug.supply}</span>`}</div></section>` : ``}

      ${!editing && (log.length || isReading) ? `<section class="panel">
        <h3>${drug ? "Dose history"
          : occurrenceWord(e.name, drug) === "test" ? "Test history" : "Reading history"}</h3>
        ${log.length ? `` : `<p class="none">Nothing recorded yet</p>`}
        ${log.map(h => `<div class="log-row">
          <span class="log-mark${h.done ? "" : " late"}">${h.done ? TICK : CLOCK}</span>
          <span class="log-when">${h.day}</span>
          ${h.value ? `<span class="log-val">${h.value}</span>` : ``}
          <span class="log-val${h.done ? "" : " late"}">${h.at}</span>
        </div>`).join("")}
      </section>` : ``}

      ${editing && drug ? `<button class="danger js-stop">Stop taking ${e.name}</button>` : ``}

      <div style="height:32px"></div>
    </div>`;
  }

  const logMinutes = () => logAt;


  /* ═════════ the record page ═════════
     Arrived at on a reading, from the sheet or from the day itself. It opens on the last
     figure rather than on nothing: a weight is a small change from the one before it far
     more often than it is a number composed from scratch, so the keyboard is there to
     correct rather than to compose. Where there is no last figure it opens empty and
     says so, which is honest — and Record stays dead until there is something to record. */
  function seedPad(rec){
    const r = READINGS[rec.name] || {};
    pad = { name:rec.name, kind:r.kind || "figure" };
    padFill = rec.d != null ? { d:rec.d, i:rec.i } : null;
    padVals = {};
    const last = lastReading(rec.name);
    if (pad.kind === "bp"){
      const m = last && /(\d+)\D+(\d+)/.exec(last.e.value);
      padVals.s = m ? m[1] : "";
      padVals.d = m ? m[2] : "";
    } else if (pad.kind !== "test"){
      padVals.n = last ? String(parseFloat(last.e.value)) : "";
    }
    /* Filling in something already on the day takes that day and that hour, since the
       entry it is completing has them — the clock is then there to correct a cuff read
       ten minutes ago, not to be set from scratch. Started from the sheet it keeps the
       clock the sheet was left on, which is the one the user has just been looking at. */
    if (padFill){
      logDay = padFill.d;
      logAt = atOf(padFill.d, DAYS[padFill.d].events[padFill.i]);
    }
  }
  function clearPad(){ pad = null; padFill = null; padVals = {}; }

  /* Nothing is focused when the page opens. The caret used to go straight into the first
     figure with its contents selected, on the reasoning that the common act is
     correcting last week's number — but it raises the keyboard over half the page before
     the user has looked at it, selects a value they may have wanted to keep, and on a
     blood pressure it picks one of three fields to be the one you are apparently already
     typing into. The page is a form to be read first and filled second, so it opens with
     the whole of it visible and the first tap decides where to start. */

  /* What is in the pad, as it will be written into the ledger — or null while there is
     nothing worth writing, which is also what greys the button out. */
  function padValue(){
    if (!pad) return null;
    const r = READINGS[pad.name] || {};
    if (pad.kind === "bp"){
      const s = parseInt(padVals.s, 10), d = parseInt(padVals.d, 10);
      if (isNaN(s) || isNaN(d) || s < 40 || s > 260 || d < 20 || d > 200) return null;
      const p = parseInt(padVals.p, 10);
      return `${s}/${d}` + (!isNaN(p) && p > 0 ? ` · ${p} bpm` : "");
    }
    if (pad.kind === "test") return padVals.out || null;
    const n = parseFloat(padVals.n);
    if (isNaN(n) || n <= 0) return null;
    const fig = r.places ? n.toFixed(r.places) : String(n);
    return r.unit ? `${fig} ${r.unit}` : fig;
  }

  /* The line under the figures: what this one means, and what the last one was. Repainted
     where it stands as you type, since a redraw would take the caret with it. */
  function padFoot(){
    const r = READINGS[pad.name] || {};
    const last = lastReading(pad.name);
    const bits = [];
    if (pad.kind === "bp"){
      /* only once both halves are a reading someone could actually have — a band under
         a half-typed figure names the wrong one, and 900 over 84 is not high, it is a
         typo part way through */
      const band = padValue()
        && bpBand(parseInt(padVals.s, 10), parseInt(padVals.d, 10));
      if (band) bits.push(`<span class="band ${band.tone}">${band.label}</span>`);
    } else if (pad.kind !== "test" && last){
      const n = parseFloat(padVals.n), was = parseFloat(last.e.value);
      if (!isNaN(n) && !isNaN(was) && Math.abs(n - was) >= 0.05)
        bits.push(`<span class="delta">${n > was ? "+" : "−"}${
          Math.abs(n - was).toFixed(1)}${r.unit ? ` ${r.unit}` : ``}</span>`);
    }
    /* Today it is the hour that tells them apart, any other day it is the day. */
    bits.push(last
      ? `<span>${last.e.value}${last.di === NOW.day
          ? ` at ${last.e.logged}` : ` on ${DAYS[last.di].label}`}</span>`
      : `<span>Nothing recorded yet</span>`);
    /* Joined by space rather than by a dot. The line can run to two at this width, and
       a separator is a poor thing to leave stranded at the end of the first one — the
       gap says the same thing and says it in nothing. */
    return bits.join("");
  }

  function paintPad(){
    const foot = document.querySelector(".js-padfoot");
    if (foot) foot.innerHTML = padFoot();
    const btn = document.querySelector(".js-pad-save");
    if (btn) btn.disabled = !padValue();
  }

  /* The row the whole page is built from. The name is left off when the panel holds a
     single value, because the heading above it has already given that value its name and
     saying it twice is the noise, not the brevity.

     Both cells are reserved whether or not the row fills them, so the rule is the same
     rule in the same place on all three pages — a page with one value and no unit keeps
     it where a page with three values in millimetres of mercury keeps it. An empty name
     cell is not a missing label; it is the heading above having already given the name. */
  function fieldRow(label, inner, unit){
    return `<div class="frow">
      <span class="flabel">${label || ""}</span>
      ${inner}
      <span class="funit">${unit || ""}</span>
    </div>`;
  }
  /* A figure on a rule. Every typed value on the page is one of these — the weight, both
     halves of a blood pressure, the pulse — so there is one size of figure, one place
     the unit goes, and one rule they all sit on. The decimal ones need the room for a
     point and what follows it; the rest are three digits and no more. */
  const numField = (label, cls, val, unit, mode) => fieldRow(label,
    `<span class="fline">
      <input class="fnum ${cls}" inputmode="${mode || "numeric"}"
             maxlength="${mode === "decimal" ? 6 : 3}"
             value="${val == null ? "" : val}" placeholder="—"
             aria-label="${label || pad.name}${unit ? ` in ${unit}` : ``}">
    </span>`, unit);

  /* The middle panel — the only one that differs between the three, and now only in how
     many rows it has. */
  function padBody(){
    const r = READINGS[pad.name] || {};

    if (pad.kind === "bp")
      return `<section class="panel"><h3>Reading</h3>
        ${numField("Systolic", "js-pad-s", padVals.s, r.unit)}
        ${numField("Diastolic", "js-pad-d", padVals.d, r.unit)}
        ${numField("Pulse", "js-pad-p", padVals.p, "bpm")}
        <p class="padfoot js-padfoot">${padFoot()}</p>
      </section>`;

    /* Chosen rather than typed, so it cycles — the same control the medicine page uses
       to set a dose or a frequency, and the same one the day above it has always used.
       Three chips of three widths were the one block on these pages that shared no edge
       with anything else on them. */
    if (pad.kind === "test")
      return `<section class="panel"><h3>Result</h3>
        ${fieldRow("", `<span class="fline">
          <button class="fpick${padVals.out ? `` : ` unset`}" data-outcome-next
                  aria-label="What the test found — ${padVals.out || "not recorded"}, tap to change"
          >${padVals.out || "Not recorded"}</button>
        </span>`, "")}
        <p class="padfoot js-padfoot">${padFoot()}</p>
      </section>`;

    return `<section class="panel"><h3>Reading</h3>
      ${numField("", "js-pad-n", padVals.n, r.unit, "decimal")}
      <p class="padfoot js-padfoot">${padFoot()}</p>
    </section>`;
  }

  const dayName = i => i === NOW.day ? "Today" : DAYS[i].label;

  function recordView(){
    const word = occurrenceWord(pad.name, null);
    /* Filling in something the day was already expecting, the heading says which one —
       otherwise the page is about a thing that has just happened and has nothing to
       say about it that the fields below do not. */
    const due = padFill
      ? `${dayName(padFill.d)} · ${fmt(atOf(padFill.d, DAYS[padFill.d].events[padFill.i]))}`
      : "";

    return `<div class="body recpage">
      <header class="appbar">
        <button class="navicon js-leave" aria-label="Cancel">${s24(NAV.back)}</button>
        <h1 class="bartitle">Recording</h1>
      </header>

      <div class="dhead">
        <h2 class="dname">${pad.name}${glyph(SHAPE_OF[pad.name])}</h2>
        ${due ? `<p class="dsubt">Due ${due}</p>` : ``}
      </div>

      <section class="panel"><h3>When</h3>
        ${fieldRow("",
          `<span class="fline fwhen">
            <button class="fpick" data-log-day
                    aria-label="Filed under ${dayName(logDay)} — tap to change"
            >${dayName(logDay)}</button>
            <span class="fclock">
              <input class="fnum clock js-h" inputmode="numeric" maxlength="2" size="2"
                     value="${fmt(logAt).slice(0, 2)}" aria-label="Hour"><span class="fsep">:</span
              ><input class="fnum clock js-m" inputmode="numeric" maxlength="2" size="2"
                     value="${fmt(logAt).slice(3)}" aria-label="Minute">
            </span>
          </span>`, "")}
      </section>

      ${padBody()}

      <section class="panel"><h3>Note</h3>
        <div class="frow">
          <span class="fline prose">
            <input class="fnote js-pad-note" value="${(padVals.note || "").replace(/"/g, "&quot;")}"
                   placeholder="—"
                   aria-label="A note to file beside this ${word}">
          </span>
        </div>
      </section>

      <div class="recfill"></div>
      <button class="commit js-pad-save"${padValue() ? `` : ` disabled`}>Record</button>
    </div>`;
  }

  /* ═════════ the dose page ═════════
     The whole cabinet, read as something to take from rather than as a register to
     manage. The sheet offers only the medicines with nowhere else to be ticked off; this
     is where the others are, for the dose taken off schedule that the day has no box
     for — a second paracetamol, a tablet taken early.

     Every medicine, not only the ones the sheet left out: a page arrived at by its own
     address has to make sense on its own, and a list of medicines missing the one you
     reached for is a worse answer than a list with it in twice over. */
  function doseView(){
    const { meds, more } = logItems();
    const all = meds.concat(more).sort((a, b) => a.name.localeCompare(b.name));

    return `<div class="body">
      <header class="appbar">
        <button class="navicon js-leave" aria-label="Go back">${s24(NAV.back)}</button>
        <h1 class="bartitle">Record a dose</h1>
      </header>
      <div style="margin-top:24px; padding:0 0 32px">
        ${all.map(x => {
          const drug = DRUGS[x.name] || {};
          /* the dose and what it comes as, and nothing else: when it is due and what is
             left are the register's business, and this is not the register */
          const said = [drug.dose, drug.form].filter(Boolean).join(" ");
          const q = x.name.replace(/"/g, "&quot;");
          return `<button class="doserow" data-dose="${q}"
                          aria-label="Record a dose of ${q}">
            ${glyph(SHAPE_OF[x.name] || "grey")}
            <span class="dose-n">${x.name}</span>
            ${said ? `<span class="dose-d">${said}</span>` : ``}
          </button>`;
        }).join("")}
        ${all.length ? `` : `<div class="empty"><p>Nothing in the cabinet</p></div>`}
      </div>
    </div>`;
  }

  function logSheet(){
    if (!sheet) return "";
    const { meds, more, readings } = logItems();

    /* The rest of the cabinet is a page of its own, so the sheet shows only what it
       always showed and keeps one way in to the others. Nothing to go to if there is
       nothing there, and nowhere to hang the control if the sheet lists no medicine —
       in which case the cabinet is reached from its own destination like anything else. */
    const run = meds;
    /* The control rides the foot of the medicines rather than sitting in a heading, and
       in doing so it marks the boundary the headings used to: medicines above it,
       readings below. */
    const hinge = meds.length && more.length ? meds.length - 1 : -1;

    /* One list of names. The only thing said beside a name is a dose, because a dose is
       part of what the medicine is — what a reading was last time belongs to the page
       that asks for the next one, not to the list you pick it from. */
    const items = run.concat(readings).map((x, i) => {
      const dose = DRUGS[x.name] && DRUGS[x.name].dose;
      const row = `<button class="logitem" data-log-item="${x.name}">
        ${glyph(SHAPE_OF[x.name])}<span class="li-n">${x.name}</span>
        ${dose ? `<span class="li-d">${dose}</span>` : ``}
      </button>`;
      if (i !== hinge) return row;
      return `<div class="logrow">${row}
        <button class="logmore" data-more-meds
                aria-label="More medicines">${s24(NAV.more)}</button>
      </div>`;
    }).join("");

    return `<div class="sheetscrim js-shut"></div>
      <div class="logsheet" role="dialog" aria-modal="true" aria-label="Record something">
        <span class="grab"></span>
        <div class="logitems">${items}</div>
      </div>`;
  }

  function shell(){
    if (pad) return recordView() + drawer();
    if (dosing) return doseView() + drawer();
    if (detail) return detailView() + fieldSheet() + lookSheet() + drawer();

    /* The cabinet is not a day, so it takes none of the day furniture: no picker in
       the title, no way back to now, no month. Adding a medicine is a bar action
       here, not a floating button — the cabinet is a register you tend, not a log. */
    if (view === "medicines")
      return `<div class="body">
          <header class="appbar">
            <button class="navicon js-menu" aria-label="Open navigation menu"
                    aria-expanded="${drawn}">${s24(NAV.menu)}</button>
            <h1>Cabinet</h1>
            <button class="navicon js-newmed" aria-label="Add a medicine">${s24(NAV.plus)}</button>
          </header>
          ${medicinesView()}
        </div>
        ${drawer()}`;

    /* Same furniture as the cabinet, for the same reason: a register is not a day. */
    if (view === "routines")
      return `<div class="body">
          <header class="appbar">
            <button class="navicon js-menu" aria-label="Open navigation menu"
                    aria-expanded="${drawn}">${s24(NAV.menu)}</button>
            <h1>Routines</h1>
            <button class="navicon js-newrt" aria-label="Add a routine">${s24(NAV.plus)}</button>
          </header>
          ${routinesView()}
        </div>
        ${routineSheet()}
        ${drawer()}`;

    const title = titleFor();
    return `<div class="body">
        <header class="appbar">
