<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Health</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --font:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:#E9E9EC; font-family:var(--font); color:#1E222A;
    -webkit-font-smoothing:antialiased;
    min-height:100dvh; display:flex; align-items:center; justify-content:center;
  }
  @media (prefers-color-scheme: dark){ body{background:#0B0D14} }

  /* Framed on a desktop, edge to edge on a phone — no page around it either way. */
  .phone{
    position:relative; width:412px; height:923px; max-height:100dvh;
    border-radius:22px; overflow:hidden;
    box-shadow:0 18px 44px -26px rgba(15,20,30,.42), 0 0 0 1px rgba(20,24,32,.06);
    --tl:#FFFFFF; --card-bg:#FFFFFF; --card-past:#F8F8FA;
    --edge:rgba(20,24,32,.11); --edge-soft:rgba(20,24,32,.09);
    --tx:#1E222A; --tx2:#666C78; --tx3:#8A909C;
    --bar:#FFFFFF; --bar-tx:#1B1B1F; --bar-ic:#45474F; --bar-edge:rgba(20,24,32,.08);
    --bar-hover:rgba(27,27,31,.07);
    --act:#1F7E74; --act-soft:rgba(31,126,116,.34); --act-hover:rgba(31,126,116,.12);
    --act-fill:rgba(31,126,116,.15);
    --done-bg:#DCEBE2; --done-fg:#3C7A55;
    --warn:#D89A07; --warn-soft:rgba(216,154,7,.72); --warn-fill:rgba(216,154,7,.14);
    --mark:#0E7469;
    color:var(--tx); background:var(--tl);
  }
  .phone.dark{
    --tl:#07091C; --card-bg:#07091C; --card-past:#0D1126;
    --edge:rgba(255,255,255,.15); --edge-soft:rgba(255,255,255,.10);
    --tx:#E4E7F0; --tx2:#98A0B4; --tx3:#767E93;
    --bar:#07091C; --bar-tx:#E4E7F0; --bar-ic:#A5ACC0; --bar-edge:rgba(255,255,255,.13);
    --bar-hover:rgba(255,255,255,.08);
    --act:#6FDBCC; --act-soft:rgba(111,219,204,.36); --act-hover:rgba(111,219,204,.15);
    --act-fill:rgba(111,219,204,.17);
    --done-bg:rgba(104,176,134,.20); --done-fg:#8FD1AB;
    --warn:#F5CC78; --warn-soft:rgba(245,204,120,.70); --warn-fill:rgba(245,204,120,.16);
    --mark:#63E2D0;
  }

  @media (max-width:479px), (max-height:940px){
    .phone{width:100vw; height:100dvh; border-radius:0; box-shadow:none}
  }
  @media (min-width:480px) and (min-height:941px){
    body{padding:24px}
  }

  .body{height:100%; overflow-y:auto; overscroll-behavior:contain; scrollbar-width:none}
  .body::-webkit-scrollbar{display:none}

  .appbar{
    position:sticky; top:0; z-index:6; height:64px; display:flex; align-items:center;
    padding:0 8px 0 4px; background:var(--bar); border-bottom:1px solid var(--bar-edge);
  }
  .appbar h1{flex:1; margin:0 0 0 4px; font-size:22px; font-weight:400; color:var(--bar-tx)}
  .navicon{
    width:48px; height:48px; border-radius:50%; flex:none; padding:0; border:none;
    background:none; color:var(--bar-ic); cursor:pointer; display:grid; place-items:center;
  }
  .navicon:hover{background:var(--bar-hover)}
  .navicon svg{width:24px; height:24px; display:block}

  /* ── the drawer ──
     A modal navigation drawer, as Material draws one: 360dp at most, off the left edge,
     over a scrim, with the current destination held in a filled pill. */
  .scrim{
    position:absolute; inset:0; z-index:14; background:rgba(10,14,22,.44);
    opacity:0; pointer-events:none; transition:opacity .22s ease;
  }
  .phone.drawn .scrim{opacity:1; pointer-events:auto}
  .drawer{
    position:absolute; top:0; bottom:0; left:0; z-index:15; width:300px;
    background:var(--bar); border-right:1px solid var(--bar-edge);
    transform:translateX(-100%); transition:transform .26s cubic-bezier(.2,.7,.3,1);
    padding:22px 12px; display:flex; flex-direction:column;
    border-radius:0 16px 16px 0;
  }
  .phone.drawn .drawer{transform:none}
  .dtitle{margin:6px 16px 18px; font-size:21px; font-weight:600; letter-spacing:-.02em}
  .dsub{
    margin:0 16px 8px; font-size:11px; font-weight:700; letter-spacing:.09em;
    text-transform:uppercase; color:var(--tx3);
  }
  .ditem{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    font-family:inherit; font-size:14.5px; font-weight:600; letter-spacing:-.008em;
    color:var(--tx2); background:none; border:none; border-radius:999px;
    padding:13px 16px; cursor:pointer; transition:background .15s, color .15s;
  }
  .ditem:hover{background:var(--edge-soft); color:var(--tx)}
  .ditem svg{width:22px; height:22px; display:block; flex:none}
  .ditem.on{background:var(--act-fill); color:var(--act)}
  .ditem.off{opacity:.5; cursor:default}
  .ditem.off:hover{background:none; color:var(--tx2)}
  .dsplit{height:1px; background:var(--edge-soft); margin:14px 16px}

  /* ── shared parts ── */
  .card{
    margin:0 20px 8px; padding:13px 14px;
    background:var(--card-bg); border:1px solid var(--edge); border-radius:12px;
  }
  /* the day view stacks its cards straight onto each other with no rail between them,
     so they need a little more air than the timeline's do */
  .dayview .card{margin-bottom:12px}
  .card.logged{background:var(--card-past); border-color:var(--edge-soft)}
  /* The greyscale goes on the contents, not the card: a filter on the card would drain
     its own fill too, which is invisible on white but turns the dark card to flat black.
     In the timeline the rail sits outside the card, so the past run is drained separately. */
  .card.logged > *{filter:grayscale(1)}
  /* The stamp goes with its moment. A blanket rule on the past run was close but not the
     same thing — a past moment can still be outstanding, and that one should keep its
     colour. These follow whether the moment was actually logged. */
  .rail.done, .whenrow.done{filter:grayscale(1)}
  .cardhead{display:flex; align-items:center; gap:9px; margin:0 0 12px}
  .latebar{
    display:flex; align-items:center; gap:5px; margin:0 0 11px;
    font-size:13px; font-weight:600; color:var(--warn);
  }
  .latebar svg{width:14px; height:14px; display:block; flex:none}
  .cardhead .grow{flex:1}
  /* The lines below line up with the time rather than with the mark that governs them —
     which means the indent has to follow the mark to whichever side it is on. */
  /* Only in the day view, where the mark governs the whole moment from the card head.
     The timeline's cards have a head too once the stamp moves inside them, but their
     marks sit on the rows — so an indent there just holds them off the edge. */
  .phone:not(.right-box) .cardhead ~ .entry{padding-left:34px}
  .phone.right-box .cardhead ~ .entry{padding-right:34px}
  /* above the card, the rows have nothing to clear */
  .abovewrap .entry, .stack.wide > .card .entry{padding-left:0; padding-right:0}
  .cardhead .phase{width:20px; height:20px; display:block; flex:none}
  .whentime{font-size:13px; font-weight:600; font-variant-numeric:tabular-nums; flex:none}
  /* the same slot, but a name rather than a reading — so it takes a little more room
     and drops the figures-only spacing */
  .whentime.named{font-variant-numeric:normal; letter-spacing:-.006em; font-size:13.5px}
  .rail .whentime{text-align:center; line-height:1.25}
  .rail .whentime.named{white-space:normal; font-size:12px}
  /* The routine names the occasion; the rows name the things. It used to match a row in
     weight and colour, so it read as more content rather than the label over it. Sentence
     case is kept — the separation comes from being smaller, lighter and quieter instead. */
  .routine{
    font-size:13px; font-weight:500; letter-spacing:-.004em; text-transform:none;
    color:var(--tx2);
    flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    margin-left:4px;
  }
  .cardhead.bare .routine{margin-left:0}
  .entry{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    font-family:inherit; background:none; border:none; padding:0; cursor:pointer;
    border-radius:8px; transition:opacity .12s;
  }
  .entry:hover{opacity:.72}
  .entry + .entry{margin-top:13px}
  .name{margin:0; font-size:15.5px; font-weight:600; letter-spacing:-.012em; flex:1; min-width:0}
  .val{font-size:14px; color:var(--tx2); font-variant-numeric:tabular-nums; white-space:nowrap}
  .gl{width:13px; height:13px; display:inline-block; vertical-align:-2px; margin-left:7px}
  .box{
    width:23px; height:23px; border-radius:50%; flex:none; padding:0;
    border:1.5px solid var(--act-soft); background:none; color:transparent;
    display:grid; place-items:center; cursor:pointer;
    transition:background .15s, border-color .15s, color .15s;
  }
  .box svg{width:13px; height:13px; display:block}
  .box:hover{background:var(--act-hover); border-color:var(--act); color:var(--act)}
  .box.late{border-color:var(--warn-soft)}
  .box.late:hover{border-color:var(--warn); color:var(--warn)}
  /* The plus is shown at rest, and stands on its own: a ring around it would say "this
     is a box to fill in", which is the tick's job. Only the hover draws a disc, for
     something to press against. It keeps the ring's footprint so the column still lines up. */
  .box.plus{border-color:transparent; background:none; color:var(--act)}
  .box.plus svg{width:16px; height:16px}
  .box.plus:hover{background:var(--act-hover); border-color:transparent}
  .box.plus.late{color:var(--warn)}
  .box.plus.late:hover{background:rgba(216,154,7,.14); border-color:transparent}
  .box.on{background:var(--done-bg); border-color:transparent; color:var(--done-fg)}
  .box.mark{border-color:transparent; background:none; cursor:default}

  /* ── the day view ── */
  .titlebtn{
    display:flex; align-items:center; gap:2px; margin:0 0 0 4px; padding:6px 8px 6px 10px;
    font-family:inherit; font-size:22px; font-weight:400; color:var(--bar-tx);
    background:none; border:none; border-radius:999px; cursor:pointer;
  }
  .titlebtn:hover{background:var(--bar-hover)}
  .titlebtn svg{width:22px; height:22px; display:block; color:var(--bar-ic); transition:transform .2s ease}
  .titlebtn[aria-expanded="true"] svg{transform:rotate(180deg)}
  .appbar .grow{flex:1}

  /* the month, dropped under the bar and staying there while it is open */
  .cal{
    position:sticky; top:64px; z-index:5;
    background:var(--bar); border-bottom:1px solid var(--bar-edge);
    padding:10px 14px 14px;
  }
  .calhead{display:flex; align-items:center; margin:0 0 6px}
  .calmonth{flex:1; font-size:14.5px; font-weight:600; letter-spacing:-.012em; padding-left:6px}
  .calnav{display:flex; gap:2px}
  .navicon.sm{width:36px; height:36px}
  .navicon.sm svg{width:20px; height:20px}
  .navicon.sm:first-child svg{transform:rotate(90deg)}
  .navicon.sm:last-child svg{transform:rotate(-90deg)}
  .navicon.sm:disabled{opacity:.35; cursor:default}
  .navicon.sm:disabled:hover{background:none}

  .calgrid{display:grid; grid-template-columns:repeat(7, 1fr); gap:2px}
  .calgrid .dow{
    text-align:center; font-size:10.5px; font-weight:700; letter-spacing:.06em;
    color:var(--tx3); padding:2px 0 4px;
  }
  .cell{
    position:relative; display:flex; flex-direction:column; align-items:center; gap:2px;
    font-family:inherit; font-size:13.5px; font-weight:500; font-variant-numeric:tabular-nums;
    color:var(--tx); background:none; border:none; border-radius:12px;
    padding:6px 0 5px; cursor:pointer; transition:background .15s, color .15s;
  }
  .cell i{width:4px; height:4px; border-radius:50%; background:var(--warn); display:block}
  .cell .void{background:none}
  .cell:hover{background:var(--edge-soft)}
  .cell.off{color:var(--tx3); opacity:.45; cursor:default}
  .cell.off:hover{background:none}
  .cell.today{color:var(--act); font-weight:700}
  .cell.on{background:var(--tx); color:var(--tl)}
  .cell.on:hover{background:var(--tx)}
  .cell.pad{pointer-events:none}

  .ghead{
    display:flex; align-items:baseline; gap:9px; margin:22px 20px 10px;
    font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
    color:var(--tx3);
  }
  .ghead.late{color:var(--warn)}
  .ghead .hide{
    margin-left:auto; font-family:inherit; font-size:11px; font-weight:700;
    letter-spacing:.09em; text-transform:uppercase; color:var(--act);
    background:none; border:none; padding:0; cursor:pointer;
  }
  .ghead .hide:hover{text-decoration:underline}

  .folded{
    display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    margin:0 20px; width:calc(100% - 40px); padding:13px 14px; cursor:pointer;
    font-family:inherit; background:var(--card-past);
    border:1px solid var(--edge-soft); border-radius:12px;
    transition:background .15s, border-color .15s;
  }
  .folded:hover{border-color:var(--edge)}
  .fold-t{font-size:15px; font-weight:600; letter-spacing:-.012em; color:var(--tx2); flex:none}
  .fold-s{display:flex; align-items:center; gap:6px; flex:1; filter:grayscale(1)}
  .fold-s .gl{margin-left:0}
  .chev{display:grid; place-items:center; color:var(--tx3); flex:none}
  .chev svg{width:16px; height:16px; display:block}

  /* ── the timeline view ── */
  .period{display:grid; grid-template-columns:23% 1fr}
  .rail{display:flex; flex-direction:column; align-items:center; gap:3px; padding:16px 4px 0}
  .rail .phase{width:34px; height:34px; display:block}
  .rail .whentime{font-size:12px}

  /* the timestamp can keep its column, narrow it, or move inside the card */
  .period.slim{grid-template-columns:16% 1fr}
  .period.slim .rail{padding-left:2px; padding-right:2px}
  .period.slim .rail .phase{width:28px; height:28px}
  .period.slim .rail .whentime{font-size:11px}
  /* the mark alone needs a narrower column, and sits level with the card's own heading */
  .card.marked{display:grid; grid-template-columns:auto 1fr; gap:12px; align-items:start}
  .phone.right-box .card.marked{grid-template-columns:1fr auto}
  .phone.right-box .card.marked .ringcol{order:2}
  .card.marked .latebar{grid-column:1 / -1}
  .cardbody{min-width:0}
  .routineline{margin:0 0 9px; display:flex}
  .routineline .routine{margin-left:0}

  .period.split{grid-template-columns:19% 1fr}
  .period.split .rail{padding-top:14px}
  .period.split .rail .phase{width:30px; height:30px}
  .period.solo{grid-template-columns:1fr}
  /* the stamp on its own line, above the card and outside it */
  .whenrow{display:flex; align-items:center; gap:9px; margin:0 20px 9px}
  .stack.wide .whenrow{margin:0 20px 9px}
  .whenrow .phase{width:20px; height:20px; display:block; flex:none}
  .whenrow .grow{flex:1}
  .abovewrap + .abovewrap{margin-top:14px}
  .stack.wide .card{margin:0 20px 8px}
  .cardhead.tag{margin:0 0 11px}
  .whentag{
    display:inline-flex; align-items:center; gap:6px; padding:3px 11px 3px 4px;
    border-radius:999px; background:var(--edge-soft);
  }
  .whentag .phase{width:18px; height:18px; display:block; flex:none}
  .stack{padding:16px 0 16px 0}
  .stack .card{margin:0 20px 8px 0}
  .stack .card:last-child{margin-bottom:0}
  /* the chip just marks where a day begins; the app bar title says which day you are in */
  .daychip{display:flex; justify-content:center; padding:16px 0 6px}
  .daychip span{
    background:#2E3138; color:#F3F3F5; font-size:11.5px; font-weight:600;
    letter-spacing:.045em; border-radius:999px; padding:4px 12px;
  }
  .phone.dark .daychip span{background:#E7EAF3; color:#141830}
  .nowedge{position:relative; height:0; z-index:3}
  .tail{height:0}
  .nowedge .bar{
    position:absolute; left:16px; right:16px; top:-5px; height:10px;
    display:flex; align-items:center; gap:9px;
  }
  .nowedge .dot{width:10px; height:10px; border-radius:50%; background:var(--mark); flex:none}
  .nowedge .line{flex:1; height:2px; background:var(--mark); border-radius:2px}
  .past.ends{padding-bottom:12px}
  .period.opens{padding-top:12px}

  /* The boundary. Quiet enough that it does not compete with today, explicit enough
     that the days ahead are obviously there rather than missing. */
  .coming{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:calc(100% - 40px); margin:18px 20px 30px; padding:14px 16px;
    cursor:pointer; font-family:inherit;
    background:none; border:1.5px solid var(--edge); border-radius:12px;
    transition:border-color .15s, background .15s, color .15s;
    color:var(--act);
  }
  .coming:hover{border-color:var(--act-soft); background:var(--act-hover)}
  .coming-t{font-size:15px; font-weight:600; letter-spacing:-.012em}
  .coming svg{width:17px; height:17px; display:block; flex:none}

  /* ── the detail page ── */
  .bartitle{flex:1; margin:0 0 0 4px; font-size:22px; font-weight:400; color:var(--bar-tx)}
  /* the name and its line sit in their own air, clear of the bar above and the first
     panel below */
  .dhead{padding:26px 20px 22px}
  .dname{
    margin:0; font-size:29px; font-weight:600; letter-spacing:-.028em;
    display:flex; align-items:center; gap:10px;
  }
  .dname .gl{width:19px; height:19px; margin-left:0}
  .dsubt{margin:6px 0 0; font-size:15px; color:var(--tx2)}
  .log-row{
    display:flex; align-items:center; gap:12px; padding:9px 0;
    border-top:1px solid var(--edge-soft); font-size:14.5px;
  }
  .log-row:first-of-type{border-top:none; padding-top:2px}
  .log-when{flex:1}
  .log-val{font-size:14px; color:var(--tx2); font-variant-numeric:tabular-nums}
  .log-mark{
    width:20px; height:20px; border-radius:50%; flex:none; display:grid; place-items:center;
    background:var(--done-bg); color:var(--done-fg);
  }
  .log-mark svg{width:12px; height:12px}
  /* an outstanding dose is amber here, as it is everywhere else in the app */
  .log-mark.late{background:var(--warn-fill); color:var(--warn)}
  .log-val.late{color:var(--warn); font-weight:600}
  /* the detail page's sections, matching the cards the two views use */
  .panel{
    margin:16px 20px 0; padding:15px 16px 16px;
    background:var(--card-bg); border:1px solid var(--edge); border-radius:12px;
  }
  .panel > h3{
    font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
    color:var(--tx3); margin:0 0 12px;
  }
  .panel .chips{display:flex; flex-wrap:wrap; gap:8px}
  .panel .chip{
    margin:0; font-size:15px; font-weight:600; letter-spacing:-.01em; color:var(--tx);
    background:var(--edge-soft); border-radius:999px; padding:8px 14px;
    display:inline-flex; align-items:center;
  }

  .day .empty{margin-bottom:26px}
  .empty{
    margin:26px 20px 0; padding:30px 20px; text-align:center;
    border:1px dashed var(--edge); border-radius:12px;
  }
  .empty p{margin:0; font-size:14.5px; font-weight:500; color:var(--tx2)}
</style>
<script data-cv-theme-sync="2">(() => {
  const flipped = new WeakMap(); // media rule -> was it a dark-scheme rule?
  const walk = (rules, dark) => {
    for (const r of rules) {
      // A rewritten rule's mediaText no longer mentions prefers-color-scheme,
      // so membership in the flipped map must count as a match too or it
      // would only ever flip once.
      if (r.media && (flipped.has(r) || /prefers-color-scheme/i.test(r.media.mediaText))) {
        if (!flipped.has(r)) flipped.set(r, /prefers-color-scheme:\s*dark/i.test(r.media.mediaText));
        r.media.mediaText = flipped.get(r) === dark ? 'all' : 'not all';
      } else if (r.cssRules) walk(r.cssRules, dark);
    }
  };

  // The board's theme, once it has said. Null until then: a document opened
  // without a boot hash answers from the OS rather than guessing.
  let host = null;

  /* prefers-color-scheme in JavaScript.

     Rewriting media rules only reaches a document that themes itself in CSS. A
     prototype that renders from script — picking colours in JS, or setting a
     class off matchMedia — reads the media query directly, and inside the
     iframe that answers with the OS. Such a document ignored the board
     entirely: it stayed on the system setting while the host sat pinned to
     light or dark, and when the OS flipped it moved on its own rather than
     with the page around it.

     So prefers-color-scheme queries answer with the host theme instead, and
     fire 'change' when it flips — meaning the ordinary listener a document
     already writes is enough to follow the board, with nothing canvas-specific
     in it. Every other query passes through to the real matchMedia untouched.

     'no-preference' is left to the OS: the host is always one of light or
     dark, so it has no honest answer for "the user expressed none". */
  const native = window.matchMedia && window.matchMedia.bind(window);
  const wants = (q) =>
    /prefers-color-scheme:\s*dark/i.test(q) ? true
    : /prefers-color-scheme:\s*light/i.test(q) ? false
    : null;
  // Held strongly, so a query stays live for as long as the document does —
  // the same lifetime a real MediaQueryList has once it carries a listener.
  const live = [];
  if (native) window.matchMedia = (query) => {
    const q = String(query);
    const dark = wants(q);
    if (dark === null) return native(q);
    const bus = new EventTarget();
    const mql = {
      media: q,
      get matches() { return host === null ? native(q).matches : host === dark; },
      onchange: null,

           object. It only counts as logged when all of it is — a moment holding one
           taken dose and one still outstanding is not a settled thing. */
        const allDone = m.rows.every(x => state(di, x.e) === "done");
        const mark = sunmoon(m.at);
        /* the stamp names the occasion when the moment has one, and falls back to the
           clock when it does not — one slot, not a time and a label side by side */
        const stamp = routineOf(m) || fmt(m.at);
        const when = `<span class="whentime${routineOf(m) ? " named" : ""}"
          style="color:${timeInk(m.at)}">${stamp}</span>`;
        const body = m.rows.map(x => row(x.e, di, x.i, true)).join("");
        const ring = momentMark(m.rows, di);
        const hasRail = tStamp === "rail" || tStamp === "slim" || tStamp === "split";
        const railed = tStamp === "rail" || tStamp === "slim";

        /* out in a column of its own, or in at the head of the card it describes */
        /* Railed, the rail holds the time and the card is left to name the routine; with
           the stamp inside, the two sit together on one line. */
        /* Split keeps the mark out on the rail — where it reads as the hour of the day,
           beside the card rather than in it — and brings only the time inside, where it
           sits with the routine as the card's own heading. */
        /* whatever names the moment also carries its mark; on the left it leads, on the
           right it is pushed to the end of that line */
        const lay = inner => boxSide === "right"
          ? `${inner}<span class="grow"></span>${ring}`
          : `${ring}${inner}`;

        const head = tStamp === "above"
          ? ``
          : tStamp === "split"
            ? `<div class="cardhead">${lay(when)}</div>`
            : tStamp === "tag"
              ? `<div class="cardhead">${lay(`<span class="whentag">${mark}${when}</span>`)}</div>`
              : `<div class="cardhead">${lay(`${mark}${when}`)}</div>`;
        /* The timeline has no group to say it, so a card that is late says so itself —
           the day view leaves this out because its Overdue heading already has. */
        const anyLate = m.rows.some(x => state(di, x.e) === "late");
        const late = anyLate ? `<div class="latebar">${CLOCK}<span>Overdue</span></div>` : ``;
        /* With the stamp out on the rail there is no heading line for the mark to sit on,
           and a lone ring on an otherwise empty row has nothing to align to. A railed card
           gives it a column instead, level with the top of what it governs; the routine,
           when there is one, heads the contents beside it. */
        if (railed){
          return `<section class="period${tStamp === "slim" ? " slim" : ""}">
            <aside class="rail${allDone ? " done" : ""}">${mark}${when}</aside>
            <div class="stack"><div class="card marked${allDone ? " logged" : ""}">${late}
              <span class="ringcol">${ring}</span>
              <div class="cardbody">${body}</div>
            </div></div>
          </section>`;
        }

        const card = `<div class="card${allDone ? " logged" : ""}">${late}${head}${body}</div>`;

        if (hasRail)
          return `<section class="period split">
              <aside class="rail${allDone ? " done" : ""}">${mark}</aside>
              <div class="stack">${card}</div>
            </section>`;

        /* the stamp sits on top of the card rather than inside it — the card holds only
           the things, and what time they belong to is said just above it */
        if (tStamp === "above")
          return `<section class="period solo"><div class="stack wide">
            <div class="whenrow${allDone ? " done" : ""}">${lay(`${mark}${when}`)}</div>${card}</div></section>`;

        return `<section class="period solo"><div class="stack wide">${card}</div></section>`;
      }).join("");

      const inner = [`<div class="daychip" data-daymark="${di}"><span>${d.label}</span></div>`];
      if (past.length) inner.push(`<div class="past${di === NOW.day ? " ends" : ""}">${periods(past)}</div>`);
      if (di === NOW.day) inner.push(`<div class="nowedge" role="separator" aria-label="Now, ${fmt(NOW.at)}">
        <div class="bar"><span class="dot"></span><span class="line"></span></div></div>`);
      inner.push(periods(soon));
      /* An empty day is still a day. Skipping it left a hole the calendar could jump to
         and land nowhere, and made the run of days lie about which ones exist. */
      if (!d.events.length)
        inner.push(`<div class="empty"><p>Nothing scheduled</p></div>`);
      /* Each day wraps its own contents so its chip sticks within that day and is pushed
         off by the next one, rather than every chip pinning to the same spot. */
      out.push(`<div class="day">${inner.join("")}</div>`);
    });
    /* Room after the last day, so the now line can be brought up to where it parks. With
       the future hidden the line is the end of the content, and without this there is
       nothing to scroll into — the line can never leave the bottom of the screen. */
    out.push(comingBar());
    out.push(`<div class="tail"></div>`);
    return out.join("");
  }

  /* ═════════ view two: a day at a time ═════════ */
  function dayView(){
    const d = DAYS[open];
    const rows = d.events.map((e,i) => ({ e, i, d:open, key:e.logged ? toMin(e.logged) : e.at }));
    const late = rows.filter(x => state(open, x.e) === "late");
    const next = rows.filter(x => state(open, x.e) === "next");
    const done = rows.filter(x => state(open, x.e) === "done");

    const block = (title, cls, list, useLogged, logged) => {
      if (!list.length) return "";
      return `<section class="group">
        <div class="ghead ${cls}">${title}<span class="n">${list.length}</span>${
          logged ? `<button class="hide" data-collapse>Hide</button>` : ``}</div>
        ${moments(list, useLogged).map(m => {
          const mark = momentMark(m.rows, open);

          const rt = routineOf(m);
          const when = `${sunmoon(m.at)}<span class="whentime${rt ? " named" : ""}"
            style="color:${timeInk(m.at)}">${rt || fmt(m.at)}</span>`;
          const headRow = boxSide === "right"
            ? `${when}<span class="grow"></span>${mark}`
            : `${mark}${when}`;

          if (tStamp === "above")
            return `<div class="abovewrap">
              <div class="whenrow${logged ? " done" : ""}">${headRow}</div>
              <div class="card${logged ? " logged" : ""}">${
                m.rows.map(x => row(x.e, open, x.i, true)).join("")}</div>
            </div>`;

          return `<div class="card${logged ? " logged" : ""}">
            <div class="cardhead">${headRow}</div>
            ${m.rows.map(x => row(x.e, open, x.i, true)).join("")}
          </div>`;
        }).join("")}
      </section>`;
    };

    return `<div class="dayview" style="padding:6px 0 40px">
        ${block("Overdue", "late", late, false, false)}
        ${block("Scheduled", "next", next, false, false)}
        ${done.length && !loggedOpen ? foldedLogged(done) : block("Logged", "done", done, true, true)}
        ${rows.length ? `` : `<div class="empty"><p>Nothing scheduled</p></div>`}
      </div>`;
  }

  /* Folded, the logged group is one line: how many, what they were, and a way in. What
     is done is the least urgent thing on the screen, so it can be the smallest. */
  function foldedLogged(list){
    const shapes = [...new Set(list.map(x => x.e.shape))].slice(0, 5).map(k => glyph(k)).join("");
    return `<section class="group">
      <div class="ghead">Logged<span class="n">${list.length}</span></div>
      <button class="folded" data-expand aria-expanded="false">
        <span class="fold-t">${list.length} logged</span>
        <span class="fold-s">${shapes}</span>
        <span class="chev">${CHEV}</span>
      </button>
    </section>`;
  }

  /* the days after today that actually hold anything */
  function ahead(){
    return DAYS.map((d, di) => ({ d, di }))
      .filter(x => x.di > NOW.day && x.d.events.length);
  }

  const MINUS = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.6 8h8.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

  function comingBar(){
    const rest = ahead();
    if (futureMode !== "edge" || !rest.length) return "";
    /* Both labels are noun phrases naming what you get, so the two states read as one
       control rather than a section heading on one side and a command on the other. */
    return futureOpen
      ? `<button class="coming" data-fold-future aria-expanded="true">
          <span class="coming-t">Fewer days</span>${MINUS}</button>`
      : `<button class="coming" data-open-future aria-expanded="false">
          <span class="coming-t">Coming up</span>${PLUS}</button>`;
  }

  function calendar(){
    const cells = [];
    for (let i = 0; i < MONTH.firstDow; i++) cells.push(`<span class="cell pad"></span>`);
    for (let date = 1; date <= MONTH.days; date++){
      const di = dayIndexFor(date);
      const has = di >= 0 && (showFuture() || futureMode === "edge" || di <= NOW.day);
      const late = has && DAYS[di].events.some(e => state(di, e) === "late");
      const isToday = has && di === NOW.day;
      const isOpen = has && di === open && view === "day";
      cells.push(has
        ? `<button class="cell${isOpen ? " on" : ""}${isToday ? " today" : ""}" data-jump="${di}"
             aria-label="${DAYS[di].label}${late ? ", has something overdue" : ""}">
             ${date}<i class="${late ? "" : "void"}"></i></button>`
        : `<span class="cell off">${date}<i class="void"></i></span>`);
    }
    return `<section class="cal" aria-label="Choose a day">
      <header class="calhead">
        <span class="calmonth">${MONTH.label}</span>
        <span class="calnav">
          <button class="navicon sm" aria-label="Previous month" disabled>${s24(NAV.chev)}</button>
          <button class="navicon sm" aria-label="Next month" disabled>${s24(NAV.chev)}</button>
        </span>
      </header>
      <div class="calgrid dows">${DOW.map(d => `<span class="dow">${d}</span>`).join("")}</div>
      <div class="calgrid">${cells.join("")}</div>
    </section>`;
  }

  /* ═════════ the shell ═════════ */
  /* Named the way a calendar names its views: single nouns for the shape of the thing,
     sitting above the divider with the real destinations below. "Schedule" is avoided on
     purpose — the other view already has a Scheduled group, and the two would mean
     different things a few pixels apart. */
  const DEST = [
    { key:"timeline", label:"Timeline", icon:"line" },
    { key:"day",      label:"Day",      icon:"grid" }
  ];
  const REST = [
    { label:"Medicines", icon:"pill" },
    { label:"History",   icon:"chart" },
    { label:"Settings",  icon:"cog" }
  ];

  function drawer(){
    return `<div class="scrim js-close"></div>
      <nav class="drawer" aria-label="Main navigation" ${drawn ? "" : `aria-hidden="true"`}>
        <p class="dtitle">Health</p>
        ${DEST.map(x => `<button class="ditem${view === x.key ? " on" : ""}" data-view="${x.key}"
            ${view === x.key ? `aria-current="page"` : ``}>${s24(NAV[x.icon])}${x.label}</button>`).join("")}
        <div class="dsplit"></div>
        ${REST.map(x => `<button class="ditem off" disabled>${s24(NAV[x.icon])}${x.label}</button>`).join("")}
      </nav>`;
  }

  /* Both views name the day they are showing. The day view knows it outright; the
     timeline has to work it out from where it has been scrolled to. */
  const titleFor = () => open === NOW.day ? "Today" : DAYS[open].label;

  /* Which day the timeline is currently over — the last one whose marker has passed
     under the app bar. Updated in place rather than by redrawing, since redrawing
     mid-scroll would fight the scroll it is reacting to. */
  function spyTimeline(){
    const body = document.querySelector(".body");
    if (!body) return;
    const bar = document.querySelector(".appbar");
    const line = (bar ? bar.offsetHeight : 64) + 8;
    const top = body.getBoundingClientRect().top;
    let cur = null;
    document.querySelectorAll("[data-daymark]").forEach(el => {
      if (el.getBoundingClientRect().top - top <= line) cur = +el.dataset.daymark;
    });
    if (cur === null) return;
    open = cur;
    const label = document.querySelector(".titlebtn span");
    if (label) label.textContent = titleFor();
  }

  /* Size the run-out so the now line can reach its parked position: whatever the screen
     has left once the content below the line is accounted for. */
  function sizeTail(){
    if (view !== "timeline") return;
    const body = document.querySelector(".body");
    const mark = document.querySelector(".nowedge");
    const tail = document.querySelector(".tail");
    const bar  = document.querySelector(".appbar");
    if (!body || !mark || !tail) return;
    tail.style.height = "0px";
    const barH = bar ? bar.offsetHeight : 64;
    const top = body.getBoundingClientRect().top;
    const offsetOf = el => el.getBoundingClientRect().top - top + body.scrollTop;
    const H = body.scrollHeight;

    /* Two things have to be able to reach the top of the screen: the now line, where the
       timeline parks, and the last day, which the calendar can jump to. Sizing only for
       the now line left the final day unable to scroll up far enough — so it never
       crossed the line the title watches, and the bar kept naming the day before it. */
    let need = body.clientHeight - (barH + 18) - (H - offsetOf(mark));
    const marks = document.querySelectorAll("[data-daymark]");
    const last = marks[marks.length - 1];
    if (last) need = Math.max(need, body.clientHeight - barH - (H - offsetOf(last)));

    tail.style.height = Math.max(0, need) + "px";
  }

  /* Put a day at the top of the timeline. Today is special: its meaningful position is
     the now line rather than the start of the day, which is where it parks on load. */
  function scrollTimelineTo(di, animate){
    const body = document.querySelector(".body");
    const bar  = document.querySelector(".appbar");
    if (!body) return;
    const barH = bar ? bar.offsetHeight : 64;
    const anchor = di === NOW.day
      ? document.querySelector(".nowedge")
      : document.querySelector(`[data-daymark="${di}"]`);
    if (!anchor) return;
    const inset = di === NOW.day ? barH + 18 : barH;
    const y = anchor.getBoundingClientRect().top - body.getBoundingClientRect().top
            + body.scrollTop - inset;
    if (animate && body.scrollTo) body.scrollTo({ top:Math.max(0, y), behavior:"smooth" });
    else body.scrollTop = Math.max(0, y);
    open = di;
    const label = document.querySelector(".titlebtn span");
    if (label) label.textContent = titleFor();
  }

  function watchTimeline(){
    if (view !== "timeline") return;
    const body = document.querySelector(".body");
    if (!body || !body.addEventListener) return;
    let queued = false;
    body.addEventListener("scroll", () => {
      if (queued) return;
      queued = true;
      requestAnimationFrame(() => { queued = false; spyTimeline(); });
    }, { passive:true });
    spyTimeline();
  }

  /* ═════════ the detail page ═════════
     Everything on it is derived from the same DAYS the two views read, so the history is
     the real history — the days this medicine was taken, and the days it was missed. */
  function historyOf(name){
    const out = [];
    /* A dose that has not come due yet is not history — it would read as a gap in the
       record when nothing has gone wrong. Walk back from today taking only what has
       actually happened or has actually been missed. */
    for (let di = NOW.day; di >= 0 && out.length < 5; di--){
      DAYS[di].events.forEach(e => {
        if (e.name !== name || e.kind === "note") return;
        const past = di < NOW.day || e.at < NOW.at;
        if (!e.logged && !past) return;
        out.push({
          day: di === NOW.day ? "Today" : DAYS[di].label,
          at: e.logged || `overdue · ${fmt(e.at)}`,
          value: e.value || "",
          done: !!e.logged
        });
      });
    }
    return out.slice(0, 5);
  }

  function detailView(){
    const { d, i } = detail;
    const e = DAYS[d].events[i];
    const k = state(d, e);
    const drug = DRUGS[e.name];
    const isReading = !drug && e.kind !== "note";

    const sub = drug
      ? [drug.dose, routineOfEvent(d, i)].filter(Boolean).join(" · ")
      : e.value ? `Last reading ${e.value}` : "";

    const chips = drug
      ? [drug.dose, drug.form, drug.freq, drug.food].filter(Boolean)
          .map(x => `<span class="chip">${x}</span>`).join("")
      : "";

    const log = historyOf(e.name);

    return `<div class="body">
      <header class="appbar">
        <button class="navicon js-back" aria-label="Go back">${s24(NAV.back)}</button>
        <h1 class="bartitle">${drug ? "Medication" : isReading ? "Reading" : "Note"}</h1>
        <button class="navicon" aria-label="More options">${s24(NAV.more)}</button>
      </header>

      <div class="dhead">
        <h2 class="dname">${e.name}${glyph(e.shape)}</h2>
        ${sub ? `<p class="dsubt">${sub}</p>` : ``}
      </div>


      ${chips ? `<section class="panel"><h3>Directions</h3><div class="chips">${chips}</div></section>` : ``}
      ${drug && drug.supply ? `<section class="panel"><h3>Supply</h3>
        <div class="chips"><span class="chip">${drug.supply}</span></div></section>` : ``}

      ${log.length ? `<section class="panel">
        <h3>${isReading ? "Recent readings" : "Recent doses"}</h3>
        ${log.map(h => `<div class="log-row">
          <span class="log-mark${h.done ? "" : " late"}">${h.done ? TICK : CLOCK}</span>
          <span class="log-when">${h.day}</span>
          ${h.value ? `<span class="log-val">${h.value}</span>` : ``}
          <span class="log-val${h.done ? "" : " late"}">${h.at}</span>
        </div>`).join("")}
      </section>` : ``}

      <div style="height:30px"></div>
    </div>`;
  }

  /* the routine a given event belongs to, read back off its moment */
  function routineOfEvent(d, i){
    const e = DAYS[d].events[i];
    return e.routine || "";
  }

  function shell(){
    if (detail) return detailView() + drawer();
    const title = titleFor();
    return `<div class="body">
        <header class="appbar">
          <button class="navicon js-menu" aria-label="Open navigation menu"
                  aria-expanded="${drawn}">${s24(NAV.menu)}</button>
          <button class="titlebtn js-cal" aria-expanded="${calOpen}"
                  aria-label="${title} — choose a day">
            <span>${title}</span>${s24(NAV.chev)}
          </button>
          <span class="grow"></span>
          <button class="navicon js-now" aria-label="Back to now">${s24(NAV.today)}</button>
          <button class="navicon" aria-label="More options">${s24(NAV.more)}</button>
        </header>
        ${calOpen ? calendar() : ``}
        ${view === "timeline" ? timelineView() : dayView()}
      </div>
      ${drawer()}`;
  }

  const wall = document.getElementById("wall");
  let drawnView = null;

  /* Rendering replaces the scroller, so its position has to be carried across by hand.
     Without this, anything that redraws — opening the drawer, ticking a dose, changing a
     setting — silently returns the timeline to the top, and the day spy then reports
     whatever is up there rather than the day the user was actually on. */
  const draw = () => {
    const old = document.querySelector(".body");
    const keepScroll = (old && drawnView === view) ? old.scrollTop : null;

    wall.innerHTML = `<div class="phone${darkMode ? " dark" : ""}${drawn ? " drawn" : ""}${
      boxSide === "right" ? " right-box" : ""}">${shell()}</div>`;
    drawnView = view;

    sizeTail();
    if (keepScroll){
      const body = document.querySelector(".body");
      if (body) body.scrollTop = keepScroll;
    }
    watchTimeline();
  };

  wall.addEventListener("click", e => {
    const openEvt = e.target.closest("[data-open]");
    if (openEvt){
      const [d, i] = openEvt.dataset.open.split(":").map(Number);
      detail = { d, i };
      return draw();
    }
    if (e.target.closest(".js-back")){ detail = null; return draw(); }

    if (e.target.closest(".js-menu")){ drawn = true; return draw(); }
    if (e.target.closest(".js-cal")){ calOpen = !calOpen; return draw(); }
    if (e.target.closest("[data-open-future]")){ futureOpen = true; return draw(); }
    if (e.target.closest("[data-fold-future]")){ futureOpen = false; return draw(); }

    /* One tap means "take me to this day", which the two views answer differently:
       the day view opens it, the timeline scrolls to where it begins. */
    const jump = e.target.closest("[data-jump]");
    if (jump){
      const di = +jump.dataset.jump;
      /* asking for a day that is currently behind the boundary is asking to cross it */
      if (di > NOW.day && futureMode === "edge") futureOpen = true;
      open = di; calOpen = false; draw();
      if (view === "timeline") scrollTimelineTo(di, true);
      return;
    }

    /* "Now" means two different things: in the day view it is a day, and in the timeline
       it is a place on a long scroll. Same button, same intent, different mechanism. */
    if (e.target.closest(".js-now")){
      if (view === "day"){ open = NOW.day; return draw(); }
      /* through the same helper the calendar and the view switch use, so the title is
         renamed at once rather than waiting for the smooth scroll to fire its events */
      scrollTimelineTo(NOW.day, true);
      return;
    }
    if (e.target.closest(".js-close")){ drawn = false; return draw(); }

    const dest = e.target.closest("[data-view]");
    if (dest){
      /* The day survives the switch. Going to the timeline it has to be scrolled to,
         since the timeline holds every day at once and would otherwise open at the top
         — and the spy would then rename the title to whatever that first day is. */
      const keep = open;
      view = dest.dataset.view;
      drawn = false;
      draw();
      if (view === "timeline") scrollTimelineTo(keep, false);
      else { open = keep; draw(); }
      return;
    }

    const day = e.target.closest("[data-day]");
    if (day){ open = +day.dataset.day; return draw(); }

    if (e.target.closest("[data-expand]")){ loggedOpen = true; return draw(); }
    if (e.target.closest("[data-collapse]")){ loggedOpen = false; return draw(); }

    const all = e.target.closest("[data-logall]");
    if (all){
      const [d, list] = all.dataset.logall.split(":");
      list.split(",").forEach(i => DAYS[+d].events[+i].logged = fmt(NOW.at));
      return draw();
    }
    const undoAll = e.target.closest("[data-unall]");
    if (undoAll){
      const [d, list] = undoAll.dataset.unall.split(":");
      list.split(",").forEach(i => DAYS[+d].events[+i].logged = null);
      return draw();
    }

    const log = e.target.closest("[data-log]");
    if (log){
      const [d,i] = log.dataset.log.split(":").map(Number);
      DAYS[d].events[i].logged = fmt(NOW.at);
      return draw();
    }
    const un = e.target.closest("[data-un]");
    if (un){
      const [d,i] = un.dataset.un.split(":").map(Number);
      DAYS[d].events[i].logged = null;
      return draw();
    }
  });

  /* No prototype controls on this build — the settings keep the values they were left
     at, and the appearance follows the device instead of a picker. Listened to rather
     than read once: the colours are picked in script, so a preference changed while the
     page is open only lands if a redraw follows it. (Embedded on the canvas that same
     listener is what follows the board's theme — the bridge answers this query with the
     board's and fires 'change' when it flips.) */
  const scheme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");
  if (scheme){
    darkMode = scheme.matches;
    const follow = (e) => { darkMode = e.matches; draw(); };
    if (scheme.addEventListener) scheme.addEventListener("change", follow);
    else if (scheme.addListener) scheme.addListener(follow); // pre-2019 spelling
  }

  draw();

  /* Open on today rather than at the start of the week: the timeline holds several days,
     and the one that matters on load is the one you are in. Repeated once the fonts have
     settled, since the run-out and the position are both measured and the metrics shift
     when the real typeface arrives. */
  scrollTimelineTo(NOW.day, false);
  if (document.fonts && document.fonts.ready)
    document.fonts.ready.then(() => {
      sizeTail();
      scrollTimelineTo(NOW.day, false);
    });
})();
</script>
</body>
</html>
