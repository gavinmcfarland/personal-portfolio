<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Gavin McFarland — freelance developer building tools that take the friction out of building things. Currently working on Awenate." />
    <meta name="color-scheme" content="light dark" />

    <!-- Generic social card. These absolute-URL defaults are what crawlers that
         don't run JS (Facebook, LinkedIn, iMessage, Slack) read; the <Seo>
         component overrides them per page for crawlers that do. The image is
         the dynamic card from /api/og. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gavin McFarland" />
    <meta property="og:title" content="Gavin McFarland" />
    <meta property="og:description" content="Gavin McFarland — freelance developer building tools that take the friction out of building things. Currently working on Awenate." />
    <meta property="og:url" content="https://gavinmcfarland.co.uk/" />
    <meta property="og:image" content="https://gavinmcfarland.co.uk/api/og" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gavin McFarland" />
    <meta name="twitter:description" content="Gavin McFarland — freelance developer building tools that take the friction out of building things. Currently working on Awenate." />
    <meta name="twitter:image" content="https://gavinmcfarland.co.uk/api/og" />
    <script>
      /* Apply the theme before first paint so a dark-mode refresh never
         flashes the light canvas. Mirrors the logic in ThemeContext. */
      (function () {
        try {
          var mode = localStorage.getItem('theme-mode') || 'system';
          var dark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chivo:ital,wght@0,400;0,600;0,700;1,400&family=Caveat:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <title>Gavin McFarland — Designer & full-stack engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
